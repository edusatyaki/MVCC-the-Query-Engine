/* =====================================================================
   Narration: what the teacher says on each page. The teacher does not
   read the slide aloud; they explain the one idea behind it, point at
   the picture, use an everyday comparison, and ask the class a question.
   One entry per step, keyed by slide id. Technical words are spelled the
   way they should be spoken ("P S Q L", "x min").
   ===================================================================== */
const NARRATION = {
 title:[
  'Good morning everyone! Let me ask you something. When you check your bank balance on your phone, lakhs of other people are using the same bank at the same second. Some are only looking, some are sending money. How does the database stay calm and not get confused? That is the first half of today. And the second half: when you ask the database a question, how does it find the answer so fast? Let us find out.'],
 ch1:[
  'Before we start, one small promise. We will not talk in the air. We will take one tiny bank, with just a few rows, and test every idea on it. If you can follow three rows, you can follow the whole lecture.'],
 neobank:[
  'This is our little bank. Do not worry about all the columns, just focus on one row, Asha\'s account, fifty thousand rupees. We will keep coming back to it. And remember the two characters. Asha only looks at her balance. Ravi is the clerk who changes it. Most of today\'s drama happens between these two.'],
 ch2:[
  'Think of a single notice board in your school. Many students want to read it, and a teacher wants to change something on it at the same time. If the teacher locks the board while writing, everyone waits outside. That is exactly the problem a bank has. In this chapter we will see two such situations, and how PostgreSQL avoids the queue.'],
 casewait:[
  'Look at the numbers going down the middle. They tell you what happens first and what happens next. On the left, Ravi has started changing Asha\'s balance but has not finished. On the right, Asha checks her balance at that very moment. So, what should happen? Should she wait? Think about it for a second.',
  'In an old style database, see what happens on the right side. Asha is simply stuck. The screen is waiting, waiting, and she only gets an answer after Ravi finishes. Imagine standing at an A T M for two minutes because someone else is in the middle of something. Nobody would accept that.',
  'Now the PostgreSQL way. Asha gets her answer immediately. And which answer? The last finished one, fifty thousand, because Ravi has not finished yet, so his change does not count. Once Ravi finishes, Asha sees the new amount. So the rule to remember: people who are only reading never wait for people who are writing.'],
 casesum:[
  'Here is a slightly tricky one. A report is adding up money in all accounts, slowly, one by one. While it is adding, money is moving between accounts. What can go wrong? Take a moment and guess.',
  'See the arrow on top. The report has already counted account one. Then money jumps from account one to account four, which the report has not counted yet. So that same five thousand gets counted twice. The total becomes more than the money that actually exists. It is like counting the students in a class while one student keeps running from one row to another.',
  'The solution is beautiful and simple. When the report starts, it takes a photo of the data, a snapshot. Look at moment one on the left. After that, whatever happens on the right side does not disturb the report, because it keeps looking at its photo. So the answer is correct for that moment. One photo, one consistent answer.'],
 ch3:[
  'Okay, we have seen what PostgreSQL does. Now the real question: how does it do it? How can it show Asha the old value and Ravi the new value at the same time? We will build the answer in three small pieces, and then watch them work together.'],
 appendonly:[
  'Here is the puzzle. Ravi wants to change a number, but Asha still needs the old number for a while. You cannot have both in one box. So where does the old value go?',
  'Look at the picture. If Ravi simply rubs out the old number and writes the new one, the old value is gone forever. Then Asha has only two bad choices: wait, or see something half done. So overwriting is not an option.',
  'So PostgreSQL does something clever. It never rubs anything out. It writes the new version in a new place, and keeps the old one where it was. Now look at the terminal, at the column called C T I D. C T I D is simply the address of a row inside the table, written as two numbers: the page, and the slot on that page. Zero comma one means page zero, slot one, like a house number on a street. Before the update the row lived at zero comma one. After the update, the balance is at zero comma two. A new address means a brand new copy was made. Old copy for Asha, new copy for Ravi.'],
 xminxmax:[
  'Now we have two copies of the same row. Here is the next problem. How will the database know which copy is old and which is new? They look exactly the same.',
  'See, there is no name tag on them. It is like two identical water bottles in a classroom. Without a name written on them, nobody knows whose is whose.',
  'So PostgreSQL sticks two small labels on every copy. First, remember that every change in the database gets a number, called a transaction number, like a token number at a bank counter. The first label is called x min. It stores the token number of the transaction that created this copy, so read it as born by. The second label is called x max. It stores the token number of the transaction that deleted or replaced this copy, so read it as ended by. And if x max is zero, it means nobody has ended it yet, so this copy is still alive. You can see these two hidden columns in the terminal, just by asking for them by name.'],
 stickers:[
  'Many of you asked me: sir, what exactly are C T I D, x min and x max? Let us make it crystal clear. Look at this one row. C T I D is its address in the table, the page number and the slot number, like a house address. Zero comma two means page zero, slot two. x min is the token number of the transaction that created this copy, born by. And x max is the token number of the transaction that ended it, ended by. Zero in x max means it is still alive. Three columns, three simple questions: where does it live, who made it, and who ended it.',
  'Now let us watch these numbers change, one command at a time. First, an insert. Transaction five hundred creates Asha\'s row. It gets the address zero comma one. x min becomes five hundred, because five hundred made it. And x max is zero, because nobody has ended it. Look at the terminal, it shows exactly these three values.',
  'Next, an update. Transaction eight zero two changes the balance to forty thousand. Watch carefully, two things happen. The old copy gets x max eight zero two, meaning it was ended by eight zero two. And a brand new copy is written at a new address, zero comma two, with x min eight zero two, because eight zero two made it. That is why the C T I D changes after an update. An update is really, end the old copy and create a new one.',
  'Now a delete. Transaction nine one zero deletes the row, but has not finished yet. See what changes. No new copy, no new address. Only x max changes, to nine one zero. That is all a delete does, it signs the ended by label. And look, another window can still see the row, because nine one zero has not finished.',
  'And finally, a rollback. Transaction nine one zero is cancelled. Here is the surprise: PostgreSQL does not go back and erase the nine one zero. It leaves it there. But since nine one zero was cancelled, that number simply does not count. So x max nine one zero is treated just like zero, and the row is alive again. Cheap and quick.',
  'Here is your cheat sheet, write it in your notebook. Insert sets x min. Update ends the old copy by setting its x max, and creates a new copy with a new C T I D and a new x min. Delete only sets x max. And rollback changes nothing on disk, the cancelled number is just ignored. One golden rule: a number in x min or x max only counts if that transaction actually finished.'],
 rule:[
  'Labels are good, but we still need a clear rule. When a person looks at a copy, how do they decide, yes I can see this, or no I cannot?',
  'Let us make it a small game. Look at the table. For this person, some changes were finished and one was still running. Now look at each copy and decide, visible or not. Do not look at the answer yet. Try it with your neighbour.',
  'The rule has only two checks, and both must pass. First, was this copy made by someone who had finished? Second, has it not been replaced by someone who had finished? If both are yes, you can see it. That is the whole secret. The database does this tiny check millions of times every second.'],
 trace:[
  'Now let us put all three pieces together on Asha\'s row. Ravi has made a new copy with forty thousand, but he has not finished yet. What will Asha see?',
  'Follow the numbers down the middle. First, Ravi\'s transaction gets its token number, eight zero two. He changes the balance. When Asha looks in between, she sees x min five hundred and x max eight zero two. Read it like this: this copy was born by five hundred, and eight zero two is trying to end it. But eight zero two has not finished, so for Asha the old copy is still valid, and she sees fifty thousand. Then Ravi commits. Now Asha sees x min eight zero two and x max zero: this copy was born by Ravi\'s change, and nobody has ended it. So she sees forty thousand. Two small numbers told the whole story.'],
 ch4:[
  'So far we only changed values. But real life has more. Sometimes we delete things, sometimes we cancel a change halfway, and all these old copies keep piling up. Who cleans them? This chapter answers all of that, with the same labels we just learned.'],
 delete:[
  'Here is something that happens in every office. One person is busy counting a pile of files, and in the middle, someone else quietly takes one file away. So what number should the counting person write down at the end? The number of files when they started, or when they finished? Keep that question in mind.',
  'If the row just disappeared immediately, look what happens. The report started when there were three accounts, but it ends up saying two. The report did nothing wrong, the ground moved under its feet.',
  'So delete in PostgreSQL does not actually throw the row away. It just puts a label saying, this row was removed by Ravi. The report, which started earlier, still sees the row and says three. Anyone who looks after Ravi finishes sees two. Both answers are correct for their own moment.'],
 rollback:[
  'Sometimes a transfer fails in the middle, maybe the network breaks. Then we must cancel it, as if it never happened. How do we undo it?',
  'In some systems, cancelling means going back and copying every old value back into place, one by one. For a small change it is fine, but for a big change it is like un-mixing sugar from tea. Slow and painful.',
  'In PostgreSQL there is almost nothing to undo. Remember, the old copy was never touched. The cancelled change is simply marked as cancelled, and everybody ignores its new copy. You can see in the terminal, the moment we say rollback, the old balance is right there. Cancelling is almost free.'],
 vacuum:[
  'Now think about it. Every change leaves an old copy behind. Day after day, those old copies keep piling up, like old newspapers in a room. Somebody has to clean them. The red boxes you see are exactly those old copies.',
  'But careful. See the small locks. A long report that started earlier might still be reading some of these old copies. If we clean them now, that report will break. So the cleaner cannot just sweep everything blindly.',
  'That cleaner is called VACUUM. It only removes old copies that nobody could possibly need anymore, and it leaves the ones still in use. And the best part, it runs on its own in the background. Just like a good class monitor who cleans the board without being told.'],
 bloat:[
  'Think about your school bag. If every day you put in a fresh copy of every book, but never take the old ones out, what happens? The bag gets heavier and heavier. Now imagine the bank changes all ten lakh accounts every single night. The same thing happens to the table.',
  'Every change makes a new copy, so the table suddenly has double the rows, half of them useless old copies. Look at the size in the terminal, it doubles. Now every search has to walk through twice the pages. The table has become fat and slow. We call this bloat.',
  'The cure is to clean often, in small amounts, instead of once in a while. We can tell the cleaner to be more active for this busy table. And there is one command that cleans and also refreshes some important numbers called statistics. Keep that word in your mind, it will be very important in part two.'],
 oracle:[
  'Is this the only way to do it? Keeping old copies inside the table means we always need a cleaner. Could the old copies be kept somewhere else?',
  'Yes. Oracle, another famous database, chooses a different path. It writes the new value directly and moves the old value to a separate storage area. So its table does not get fat. But cancelling becomes slower, and a very long report can fail if its old copy was already thrown away. So neither way is perfect. Every design gives something and takes something.'],
 ch5:[
  'Welcome to part two! Until now we talked about many people at the same time. Now we focus on one single query. When you type a query and press enter, it is just text for the database. So what happens inside? Let us open the box.'],
 pipeline:[
  'Think of this like a factory line. Your query enters from the left and goes through four stations. First, check the grammar. Second, check if everything makes sense. Third, plan the fastest way. Fourth, actually do the work. Each station has one job, and we will visit them one by one.'],
 running:[
  'This is the query we will follow till the end of the class. In simple words, it asks: show me the people in Pune who have more than one lakh rupees. Remember this sentence, because every station will work on this one query.'],
 parser:[
  'The first station only cares about grammar, just like your English teacher checking sentence structure. Here are two suspicious queries. Which one do you think is broken? Guess.',
  'First, the database breaks the sentence into small words, like cutting a long sentence into pieces. See how every piece gets a colour: some are keywords, some are names, some are values.',
  'Then it arranges those words into a tree to check the grammar. Now the interesting part. The query with the spelling mistake FORM fails right here. But the one asking for unicorns from narnia passes, because the grammar is perfect. The grammar checker does not know whether narnia exists. That is somebody else\'s job, the next station.'],
 analyzer:[
  'Now look at these three errors in the terminal. The grammar of all three is perfect, but the database still says no. Why? Because perfect grammar does not mean the sentence makes sense.',
  'This station checks meaning. Does this table really exist? Is it a number or a word? Is this person even allowed to see this data? It checks everything against the database\'s own register of tables, just like a security guard checking ID cards at the gate.'],
 rewriter:[
  'Look at the words create view on the left. A view is like a shortcut on your phone\'s home screen. The shortcut itself holds nothing, it only points somewhere else. So when someone opens this shortcut, where does the database actually go to fetch the data?',
  'It quietly replaces the shortcut with the real query hidden inside it. Look at the terminal. We asked for the view, but the plan shows it is reading the real accounts table. So a view is just a nickname for a longer query.'],
 ch6:[
  'Now the most interesting station, the planner. There are many roads to the same answer, some short, some very long. The database has to choose the best road without actually travelling on all of them first. How does it decide?'],
 costphil:[
  'Everyone thinks an index always makes things faster. An index is like the index at the back of your textbook. But is it always faster? Let us check.',
  'Imagine almost every account is in Pune. Using the index means flipping to a new page again and again for almost every row. It is faster to just read the whole book from start to end. And look, the database agrees, it ignores the index. So there is no fixed rule. The database compares the cost and picks the cheapest.'],
 stats:[
  'Before a cricket match, the captain decides the batting order without knowing how the match will go. He uses past records. The database has the same problem. It must choose a plan before it runs anything. So what records can it look at?',
  'Without any information, it is completely blind. It knows the table is big, but it has no idea how many are from Pune or how many are rich.',
  'So from time to time the database takes a small sample and notes down some facts, like thirty percent live in Pune. These facts are called statistics. With them it can do simple maths: ten lakh, then thirty percent, then five percent, which gives about fifteen thousand rows. Exactly like estimating the number of students in a school from one class.'],
 scans:[
  'We expect about fifteen thousand matching rows, spread all over the table. There are different ways to pick them up. Let us look at three.',
  'The first way is to simply read everything, page by page, from beginning to end. It sounds slow, but when most rows match, it is actually the smartest way.',
  'The second way uses the index. Find each matching row in the index, then jump straight to its page. Brilliant when you want just one or two rows, like one account number. But for thousands of rows, all that jumping becomes tiring.',
  'The third way is the middle path. First make a list of all the pages that have matches, then visit those pages in order, one time each. Like planning your shopping list by shop, instead of running back and forth. For our fifteen thousand rows, this one fits best.'],
 joins:[
  'Now we have two tables, accounts and transactions, and we want to match them. The simplest idea is to compare every account with every transaction. Look at all those lines. At a real bank that would be billions of comparisons.',
  'So the database has three smarter tricks. One, for each account, quickly look up its transactions using an index. Two, put one table into a quick lookup list in memory, then go through the other only once. Three, sort both lists and walk down them together, like closing a zip. The database picks whichever is cheapest, and here it chose the second trick.'],
 decision:[
  'So now we have three possible plans. Which one will the database actually use? It gives each plan a cost, like a price tag, and the lowest price wins.',
  'Look at the bars. Reading everything costs quite a lot. The index costs even more, because of all that jumping. The middle path is the cheapest, so it wins. And the terminal shows the database picked exactly this plan. We did the same maths ourselves, and we reached the same answer as the database.'],
 ch7:[
  'We are at the last chapter. The plan is ready. Now somebody has to actually run it, quickly, without wasting memory, and while respecting the labels we learned in part one. This is where both halves of today\'s class meet.'],
 volcano:[
  'Imagine a stack of workers, one on top of another. If every worker finished all their work before passing anything up, the top person would wait a long time, and the table would be full of papers. That is the problem you see here.',
  'So instead, the top worker asks the one below, give me just one row. That request goes down, and one row comes back up, like passing a ball in a relay race. The first result reaches you quickly and nobody holds a big pile. Only sorting is special, because to sort you must see everything first.'],
 exectrace:[
  'This is the final case, and it connects everything we did today. Look at the rows the scan is going to meet. Some are perfect, some are from the wrong city, one was deleted, and one is from a change that is still half done. Before I show you, guess: which three names will the user finally see?',
  'Look at the list in the middle. The scan checks every row twice. First, does it match what we asked? Second, the label rule from part one, is this row visible to me? The deleted row and the unfinished row are hidden. Then the rest are sorted, and only the top three go up.',
  'And this is what the user finally sees. Three clean rows, no deleted data, no half finished data. The label rule from part one worked silently inside the engine of part two. That is the connection between everything we studied today.'],
 wrap:[
  'Let us quickly revise. The first station checked the grammar. The second checked the meaning. The third used statistics to choose the fastest road. And the last one brought rows up one by one, showing each person only what they should see. If you remember this one picture, you remember today\'s class. Thank you, and see you next time!']
};

/* =====================================================================
   The narrator: a pre-recorded Indian English teacher's voice
   (Microsoft neural voice en-IN-PrabhatNeural, generated from NARRATION
   by gen_audio.py into audio/<slide>-<step>.mp3). It plays each time the
   page changes. If a clip cannot be played, the browser's own speech
   voice reads the same words instead.

   Browsers only allow sound after the viewer has clicked or pressed a
   key, so the voice starts from the first interaction.
   M (or the Voice button) mutes and unmutes; V replays the current page.
   ===================================================================== */
const VOICE = { on: true, started: false, tts: 'speechSynthesis' in window, ttsVoice: null };
try { VOICE.on = localStorage.getItem('mvcc-voice') !== 'off'; } catch(e){}

const clipFor = (sl, st) => `audio/${sl.id}-${st}.mp3`;
const player  = new Audio();   player.preload = 'auto';
const warm    = new Audio();   warm.preload   = 'auto';   // fetches the next page's clip ahead of time

/* backup voice: prefer an Indian English one */
function pickTtsVoice(){
  if(!VOICE.tts) return;
  const vs = speechSynthesis.getVoices();
  for(const want of ['en-IN', 'en-GB', 'en-US', 'en']){
    const v = vs.find(v => (v.lang || '').replace('_', '-').startsWith(want));
    if(v){ VOICE.ttsVoice = v; return; }
  }
}
if(VOICE.tts){ pickTtsVoice(); speechSynthesis.onvoiceschanged = pickTtsVoice; }

function sayText(sl, st){
  return (NARRATION[sl.id] && NARRATION[sl.id][st]) || (sl.steps[st] && sl.steps[st].note) || '';
}

function voiceUI(speaking){
  const b = document.getElementById('btnVoice');
  if(!b) return;
  b.classList.toggle('muted', !VOICE.on);
  b.classList.toggle('speaking', !!speaking && VOICE.on);
  b.setAttribute('aria-pressed', String(!VOICE.on));
  document.getElementById('btnVoiceTxt').textContent =
    !VOICE.on ? 'Muted' : (VOICE.started ? 'Voice on' : 'Voice: click to start');
}

function stopVoice(){
  player.pause();
  if(VOICE.tts) speechSynthesis.cancel();
}

/* the backup: browser speech, one sentence at a time (long utterances get cut off) */
function speakFallback(sl, st){
  if(!VOICE.tts || !VOICE.on) return;
  speechSynthesis.cancel();
  const parts = (sayText(sl, st).match(/[^.!?]+[.!?]*/g) || []).map(p => p.trim()).filter(Boolean);
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p);
    if(VOICE.ttsVoice){ u.voice = VOICE.ttsVoice; u.lang = VOICE.ttsVoice.lang; } else u.lang = 'en-IN';
    if(i === 0) u.onstart = () => voiceUI(true);
    if(i === parts.length - 1){ u.onend = () => voiceUI(false); u.onerror = () => voiceUI(false); }
    speechSynthesis.speak(u);
  });
}

function nextClip(){
  const s = DECK[si];
  if(pi + 1 < s.steps.length) return clipFor(s, pi + 1);
  return si + 1 < DECK.length ? clipFor(DECK[si + 1], 0) : null;
}

function narrate(sl, st){
  stopVoice();
  voiceUI(false);
  if(!VOICE.on || !VOICE.started) return;
  const src = clipFor(sl, st);
  const mine = () => player.getAttribute('src') === src;     // ignore events from a clip we already left
  player.onplaying = () => { if(mine()) voiceUI(true); };
  player.onended   = () => { if(mine()) voiceUI(false); };
  player.onerror   = () => { if(mine()) speakFallback(sl, st); };
  player.setAttribute('src', src);
  const p = player.play();
  if(p) p.catch(e => { if(e.name !== 'AbortError' && mine()) speakFallback(sl, st); });
  const n = nextClip();
  if(n) warm.setAttribute('src', n);
}

/* the Voice button: if this click is what unlocked sound, start playing
   rather than muting straight away */
function voiceClick(){
  if(VOICE.unlockedByButton){ VOICE.unlockedByButton = false; if(VOICE.on){ narrate(DECK[si], pi); return; } }
  toggleVoice();
}

function toggleVoice(){
  VOICE.on = !VOICE.on;
  try { localStorage.setItem('mvcc-voice', VOICE.on ? 'on' : 'off'); } catch(e){}
  VOICE.started = true;
  if(VOICE.on) narrate(DECK[si], pi); else { stopVoice(); voiceUI(false); }
}

/* the first click or key press unlocks sound; a click that is not a
   navigation also plays the page that is already showing */
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, e => {
  if(VOICE.started) return;
  VOICE.started = true;
  voiceUI(false);
  const nav = e.type === 'keydown' && ['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','PageDown','PageUp','Home','End','m','M','v','V'].includes(e.key);
  const onStage = e.type === 'pointerdown' && e.target.closest && e.target.closest('#stage');
  const onVoice = e.type === 'pointerdown' && e.target.closest && e.target.closest('#btnVoice');
  if(onVoice) VOICE.unlockedByButton = true;
  else if(!nav && !onStage) setTimeout(() => narrate(DECK[si], pi), 0);
}, { capture: true }));
window.addEventListener('beforeunload', stopVoice);

</script>
<script>
/* ---- assemble the running order: a chapter opener, then that chapter's slides ---- */
const BY_ID = Object.fromEntries(DECK.map(d => [d.id, d]));
const RUN = [];
CHAPTERS.forEach(ch => {
  if(OPENERS[ch.n]) RUN.push({
    id:'ch'+ch.n, chapter:ch, type:'chapter',
    eyebrow:'Chapter '+ch.n, title:ch.t, kick:OPENERS[ch.n].when, tag:'story',
    steps:[
      {note:'The requirement for this chapter: ' + OPENERS[ch.n].problem + ' Why it is hard: ' + OPENERS[ch.n].detail + ' Then read out the cases we will solve.'}
    ],
    body:(st)=>chapterBody(ch, st)
  });
  ch.of.forEach(id => { const d = BY_ID[id]; if(d){ d.chapter = ch; RUN.push(d); } });
});
DECK.length = 0;
RUN.forEach(d => DECK.push(d));
/* the title slide opens the deck, ahead of chapter 1's requirement card */
const TI = DECK.findIndex(d => d.id === 'title');
if(TI > 0) DECK.unshift(DECK.splice(TI, 1)[0]);

/* ===================== presenter engine ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
let si = 0, pi = 0, lastSlide = null;

function render(){
  const sl = DECK[si];
  pi = Math.max(0, Math.min(pi, sl.steps.length - 1));
  const entering = lastSlide !== sl.id;
  lastSlide = sl.id;
  stage.innerHTML = `<div class="slide"${entering?' data-entering="1"':''}>`
                  + `<div class="fit">${sl.body(pi)}</div></div>`;
  $('#sTitle').textContent   = sl.title;
  $('#sEyebrow').textContent = sl.eyebrow;
  $('#sKick').textContent    = sl.kick || '';
  railState(sl);
  $('#noteSay').innerHTML = sl.steps[pi].note || '-';
  narrate(sl, pi);
  $('#noteNxt').textContent = pi+1 < sl.steps.length
    ? `next: step ${pi+2} of this slide`
    : (si+1 < DECK.length ? `next: ${DECK[si+1].title}` : 'end of deck');
  const done = DECK.slice(0, si).reduce((n,d)=>n+d.steps.length, 0) + pi + 1;
  const all  = DECK.reduce((n,d)=>n+d.steps.length, 0);
  $('#progFill').style.width = (done/all*100).toFixed(2) + '%';
  $('#stepCount').textContent = `Page ${done} / ${all}`;
  fitSlide();
}

/* Scale the current step down if it would not fit, so a slide is never
   scrollable and never clipped. Entrance animations start elements translated,
   so the first measurement can read short - re-measure once the frame has laid
   out and again once the longest entrance has finished. */
let fitTimer = null;
function fitSlide(){
  const slide = stage.querySelector('.slide'), fit = stage.querySelector('.fit');
  if(!slide || !fit) return;
  const measure = () => {
    if(!fit.isConnected) return;
    fit.style.transform = '';
    /* A centred box splits its overflow above AND below, and scrollHeight only
       counts what hangs below - so a centred measurement under-reports the true
       need by about half. This applies at every nesting level, not just the
       outer column, so flatten them all for the measurement. */
    fit.classList.add('measuring');
    const avail = fit.clientHeight;
    let need = fit.scrollHeight;
    fit.querySelectorAll('*').forEach(el => {        // catch anything still spilling
      const h = el.scrollHeight;
      if(h > need && el.parentElement === fit) need = h;
    });
    fit.classList.remove('measuring');
    if(need > avail + 1){
      /* Centred content that overflows puts half of itself ABOVE the box, which
         a top-origin scale cannot pull back. Anchor to the top before scaling. */
      fit.classList.add('topfit');
      /* the sketch rotations make visual boxes a few px taller than their
         layout boxes, which scrollHeight cannot see - leave room for it */
      const k = Math.max(0.42, (avail - 12) / need);
      fit.style.transform = `scale(${k.toFixed(4)})`;
    } else {
      fit.classList.remove('topfit');
    }
  };
  measure();
  requestAnimationFrame(measure);
  clearTimeout(fitTimer);
  fitTimer = setTimeout(measure, 520);                  // after the last .pop lands
}
window.addEventListener('resize', fitSlide);
if(window.ResizeObserver) new ResizeObserver(fitSlide).observe(document.querySelector('#app'));
/* the rail is the table of contents: click a chapter to jump to its first slide */
$('#railNav').innerHTML = CHAPTERS.map(ch =>
  `<div class="rn" data-ch="${ch.n}">
     <span class="rn-n">${String(ch.n).padStart(2,'0')}</span>
     <span class="rn-t">${ch.t}</span></div>`).join('');
$('#railNav').querySelectorAll('.rn').forEach(el => el.onclick = () => {
  const n = +el.dataset.ch;
  const at = DECK.findIndex(d => d.chapter && d.chapter.n === n);
  if(at >= 0){ si = at; pi = 0; render(); }
});
function railState(sl){
  const cur = sl.chapter ? sl.chapter.n : 0;
  const nav = $('#railNav');
  let now = null;
  nav.querySelectorAll('.rn').forEach(el => {
    const n = +el.dataset.ch;
    el.classList.toggle('now',  n === cur);
    el.classList.toggle('done', n <  cur);
    if(n === cur) now = el;
  });
  // if the list is scrolling, keep the chapter we are in on screen
  if(railScrolls() && now){
    now.scrollIntoView({block:'nearest', behavior: REDUCED ? 'auto' : 'smooth'});
  }
}
function railScrolls(){
  const nav = $('#railNav');
  const over = nav.scrollHeight > nav.clientHeight + 1;
  nav.classList.toggle('scrolls', over);
  return over;
}
window.addEventListener('resize', railScrolls);

/* ---- navigation: right / left arrow drive the whole deck ---- */
function next(){
  const s = DECK[si];
  if(pi < s.steps.length-1) pi++;
  else if(si < DECK.length-1){ si++; pi = 0; }
  else return;
  render();
}
function prev(){
  if(pi > 0) pi--;
  else if(si > 0){ si--; pi = DECK[si].steps.length-1; }
  else return;
  render();
}
function jump(d){ const n = si+d; if(n<0||n>=DECK.length) return; si=n; pi=0; render(); }

/* ---- presenter zoom: type is a share of screen height, this multiplies it ---- */
const ZMIN=.6, ZMAX=2.0, ZSTEP=.08;
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem('mvcc-zoom')) || 1; } catch(e){}
function applyZoom(show){
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom));
  document.documentElement.style.setProperty('--scale', zoom.toFixed(3));
  try { localStorage.setItem('mvcc-zoom', zoom); } catch(e){}
  if(show){
    const px = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const z = $('#zoom');
    z.innerHTML = Math.round(zoom*100) + '%<small>body text about ' + Math.round(px*.72) + 'px | 0 resets</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 1100);
  }
  fitSlide();
}
applyZoom(false);

/* ---- theme: light matches the lecture deck, dark reads better in a dim hall ---- */
function applyTheme(t, show){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('mvcc-theme', t); } catch(e){}
  if(show){
    const z = $('#zoom');
    z.innerHTML = (t === 'dark' ? 'Dark' : 'Light') + '<small>press T to switch</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 900);
  }
}
let theme = 'light';
try { theme = localStorage.getItem('mvcc-theme') || 'light'; } catch(e){}
applyTheme(theme, false);

document.addEventListener('keydown', e=>{
  if($('#ov').classList.contains('open') && !['o','O','Escape'].includes(e.key)) return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp':            e.preventDefault(); prev(); break;
    case 'ArrowDown':  e.preventDefault(); jump(1);  break;
    case 'ArrowUp':    e.preventDefault(); jump(-1); break;
    case 'Home': si=0; pi=0; render(); break;
    case 'End':  si=DECK.length-1; pi=DECK[si].steps.length-1; render(); break;
    case 'f': case 'F': e.preventDefault(); toggleFull(); break;
    case 's': case 'S': $('#notes').classList.toggle('open'); break;
    case 'o': case 'O': $('#ov').classList.toggle('open'); break;
    case 't': case 'T':
      theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme, true); break;
    case 'r': case 'R': pi = 0; render(); break;
    case 'm': case 'M': toggleVoice(); break;
    case 'v': case 'V': VOICE.started = true; narrate(DECK[si], pi); break;
    case 'Escape': $('#ov').classList.remove('open'); $('#notes').classList.remove('open'); break;
    case '+': case '=': e.preventDefault(); zoom += ZSTEP; applyZoom(true); break;
    case '-': case '_': e.preventDefault(); zoom -= ZSTEP; applyZoom(true); break;
    case '0': e.preventDefault(); zoom = 1; applyZoom(true); break;
  }
});
stage.addEventListener('click', () => next());

/* ---- full screen: a visible control, since F is only in the footer legend ---- */
function toggleFull(){
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen().catch(()=>{});
}
$('#btnFull').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
$('#btnVoice').addEventListener('click', e => { e.stopPropagation(); voiceClick(); });
document.addEventListener('fullscreenchange', () => {
  $('#btnFullTxt').textContent = document.fullscreenElement ? 'Exit' : 'Present';
});

/* ---- run of show ---- */
$('#ovGrid').innerHTML = DECK.map((s,i)=>
  `<div class="ovc${s.type==='chapter'?' ovc-ch':''}" data-i="${i}">
     <div class="i">Page ${DECK.slice(0,i).reduce((n,d)=>n+d.steps.length,0)+1} | ${s.chapter ? 'CH '+s.chapter.n : ''} | ${s.tag}</div>
     <div class="t">${s.title}</div></div>`).join('');
$('#ovGrid').querySelectorAll('.ovc').forEach(el =>
  el.onclick = () => { si=+el.dataset.i; pi=0; $('#ov').classList.remove('open'); render(); });

/* ---- elapsed timer ---- */
const t0 = Date.now();
setInterval(()=>{
  const s = Math.floor((Date.now()-t0)/1000);
  $('#clock').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

render();
</script>
</body>
</html>
