<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>MVCC &amp; the Query Engine</title>
<style>
:root{
  /* Type is a share of SCREEN HEIGHT so the deck keeps its physical size on any
     projector resolution. --scale is the presenter's live zoom (+ / - / 0).   */
  --scale:1;

  /* Sketchnote palette: cream paper, ink, highlighter, pencil-blue */
  --paper:#FBF3E4;
  --paper-2:#F5EAD6;
  --card:#FFFFFF;
  --ink:#1C1A17;
  --ink-2:#403B34;
  --muted:#6B6259;
  --line:#D8CCB4;

  --amber:#FFD766;          /* highlighter */
  --amber-2:#F7C948;
  --amber-soft:#FDEFC2;
  --pencil:#7FA3C9;         /* the blue-grey sketch fill */
  --pencil-2:#3D5C7E;
  --pencil-soft:#DCE8F4;
  --flame:#E8553A;          /* warnings, hot shards - a FILL colour */
  --flame-ink:#BF3419;      /* the same voice, dark enough to set as text */
  --flame-soft:#FBE2DC;
  --on-flame:#2A1109;     /* text that sits ON a flame fill, in either theme */
  --surface-blue:#3D5C7E;   /* coloured bands that keep white text in BOTH themes */
  --surface-green:#3A7A3D;
  --leaf:#3A7A3D;           /* good, benefits */
  --leaf-soft:#E2F0E2;

  --bg:var(--paper);
  --bg-2:var(--paper-2);
  --panel:var(--card);
  --panel-2:var(--paper-2);

  /* names the rest of the stylesheet and the scene code already speak */
  --squid:var(--ink);
  --squid-2:var(--pencil-2);
  --squid-deep:#12100E;
  --orange:var(--amber);
  --orange-deep:#6E4A05;
  --orange-soft:var(--amber-soft);
  --link:var(--pencil-2);
  --link-soft:var(--pencil-soft);
  --red:var(--flame);
  --red-soft:var(--flame-soft);
  --green:var(--leaf);
  --green-soft:var(--leaf-soft);
  --white:var(--card);
  --line-2:#E7DEC9;
  --accent:var(--pencil-2);
  --accent-deep:var(--ink);
  --accent-soft:var(--line);
  --accent-tint:var(--amber-soft);
  --violet:var(--pencil-2);
  --violet-soft:var(--pencil-soft);
  --teal:var(--pencil);
  --clay:var(--flame);
  --ok:var(--leaf);
  --navy-900:var(--ink);
  --navy-800:var(--ink);
  --navy-700:var(--ink);
  --blue:var(--pencil-2);
  --blue-400:var(--ink);
  --blue-300:var(--pencil);
  --cyan:var(--amber);
  --purple:var(--pencil-2);
  --purple-300:var(--amber);
  --gold:var(--amber);
  --gold-soft:var(--amber-soft);
  --navy:#1C1A17;

  --shadow:3px 4px 0 rgba(28,26,23,.13);
  --shadow-sm:2px 3px 0 rgba(28,26,23,.11);

  /* hand-drawn box: uneven corner radii, the classic sketch trick */
  --wobble:255px 15px 225px 15px/15px 225px 15px 255px;
  --wobble-2:15px 225px 15px 255px/225px 15px 255px 15px;

  --hand:Arial,Helvetica,sans-serif;
  --marker:Arial,Helvetica,sans-serif;
  --arial:var(--hand);
  --serif:var(--marker);
  --news:var(--hand);
  --sans:var(--hand);
  --mono:Arial,Helvetica,sans-serif;
}
:root[data-theme="dark"]{
  /* accents re-lit for a dark ground - the light-theme values are far too dark here */
  --amber:#6B5416;
  --amber-2:#7A5D14;
  --pencil-2:#B8D4F0;
  --flame-ink:#FF8A6E;
  --leaf:#6FBF73;
  --orange-deep:#F2D07A;
  --paper:#241F1A;
  --paper-2:#2C261F;
  --card:#2B251E;
  --ink:#F6EEDF;
  --ink-2:#DACFBC;
  --muted:#9E9382;
  --line:#4A4136;
  --line-2:#3C342B;
  --amber-soft:#463A1C;
  --pencil-soft:#26323E;
  --flame-soft:#3E241E;
  --leaf-soft:#22331F;
  --white:var(--card);
  --squid-deep:#0E0C0A;
  --shadow:3px 4px 0 rgba(0,0,0,.45);
  --shadow-sm:2px 3px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{height:100dvh}
html{font-size:clamp(14px, calc(min(3.5vh, 2.08vw) * var(--scale)), 56px)}
body{
  margin:0;color:var(--ink);overflow:hidden;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 22% 18%, rgba(255,215,102,.16), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(127,163,201,.13), transparent 46%);
  font-family:var(--sans);overflow:hidden;
}

/* ================= shell: chapter rail + document =================
   Flat and rule-based rather than floating cards: square corners, hairline
   borders, no shadows. The rail carries identity and position so the stage
   gets the full height of the screen.                                      */
#app{height:100%;max-width:100%;display:grid;
  grid-template-columns:clamp(8.2rem,12.5vw,12.5rem) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);overflow:hidden}

.rail{background:transparent;color:var(--ink);display:flex;flex-direction:column;
  padding:.9rem .85rem;gap:.7rem;border-right:3px dashed var(--line);
  min-width:0;min-height:0;overflow:hidden}
.rail-lecture{font-family:var(--hand);font-size:.5rem;font-weight:400;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--orange-deep);padding-bottom:.7rem;
  border-bottom:2px dashed var(--line)}
.rail-lecture b{display:block;margin-top:.15rem;font-family:var(--marker);font-weight:700;
  font-size:1.05rem;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.05}

/* the chapter list scrolls rather than clipping - at a large type scale, or on a
   short screen, it can outgrow the margin. `safe center` keeps it centred while it
   fits but falls back to start when it overflows, so the first item stays reachable. */
.rail-nav{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  justify-content:safe center;gap:.08rem;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;scrollbar-width:none}
.rail-nav::-webkit-scrollbar{width:0;height:0}
/* only when it actually scrolls: fade the cut edges so a half-shown chapter
   reads as "there is more above/below" rather than as a clipping bug */
.rail-nav.scrolls{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,
  #000 calc(100% - 14px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,
  #000 calc(100% - 14px),transparent 100%)}
.rn{display:grid;grid-template-columns:1.35rem 1fr;gap:.4rem;align-items:baseline;
  padding:clamp(.16rem,.72vh,.3rem) .25rem;cursor:pointer;border-left:3px solid transparent;
  color:var(--muted);transition:color .15s,border-color .15s,background .15s}
.rn:hover{color:var(--ink);background:var(--amber-soft)}
.rn-n{font-family:var(--mono);font-size:.46rem;font-weight:700;text-align:right;color:var(--orange-deep)}
.rn-t{font-family:var(--hand);font-size:.62rem;line-height:1.15}
.rn.done{color:var(--muted);opacity:.7}
.rn.now{color:var(--ink);border-left-color:transparent;background:var(--amber);
  border-radius:var(--wobble-2);box-shadow:var(--shadow-sm)}
.rn.now .rn-n{color:var(--ink)}

.rail-foot{flex:0 0 auto;display:flex;flex-direction:column;gap:.5rem;
  padding-top:.7rem;border-top:2px dashed var(--line)}
.present{display:inline-flex;align-items:center;justify-content:center;gap:.4em;cursor:pointer;
  font-family:var(--hand);font-size:.62rem;letter-spacing:.5px;padding:.34rem .6rem;
  border:2.5px solid var(--ink);border-radius:var(--wobble);background:var(--amber);
  color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .12s}
.present:hover{transform:translate(-1px,-1px) rotate(-.7deg)}
.present svg{width:1.05em;height:1.05em}
.rail-meta{display:flex;justify-content:space-between;gap:.4rem;font-family:var(--mono);
  font-size:.44rem;color:var(--muted)}
.rail-keys{font-size:.48rem;line-height:1.8;color:var(--muted)}
kbd{font-family:var(--mono);font-size:.9em;background:var(--amber-soft);
  border:1.5px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--ink-2)}

.doc{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:transparent}
.doc-head{flex:0 0 auto;min-width:0;padding:.7rem 1.35rem .55rem;
  border-bottom:3px solid var(--ink)}
.eyebrow{font-family:var(--hand);font-size:.6rem;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--orange-deep);margin-bottom:.1rem}
.slide-title{display:inline-block;margin:0;font-family:var(--marker);font-weight:700;
  font-size:2rem;line-height:1;letter-spacing:0;color:var(--ink);
  background:linear-gradient(var(--amber),var(--amber));
  background-size:100% .62em;background-position:0 .62em;background-repeat:no-repeat;
  padding:0 .18em .06em;transform:rotate(-.5deg)}
:root[data-theme="dark"] .slide-title{color:var(--ink)}
.kick{margin-top:.12rem;font-family:var(--hand);font-size:.72rem;color:var(--muted)}

main{flex:1 1 auto;min-height:0;min-width:0;padding:.65rem 1.35rem .7rem;display:flex;overflow:hidden}
.slide{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.fit{width:100%;height:100%;min-height:0;padding:5px 0;display:flex;flex-direction:column;gap:.38rem;
  justify-content:center;transform-origin:center top}
/* measurement pose: centred boxes hide half their overflow from scrollHeight,
   so everything is top-aligned for the instant we measure */
.fit.topfit{justify-content:flex-start}
.fit.measuring,.fit.measuring *{
  align-items:flex-start!important;align-content:flex-start!important;
  justify-content:flex-start!important}

/* a credit line, not content: capped so it stays subordinate on a big projector
   and never steals height from the chapter list */
.rail-by{flex:0 0 auto;font-family:var(--hand);font-size:clamp(8px,.44rem,12px);
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
  padding-top:clamp(4px,.42rem,9px);border-top:1px dashed var(--line);
  white-space:nowrap;overflow:hidden}
.rail-by b{font-family:var(--marker);font-weight:700;font-size:clamp(11px,.6rem,15px);
  letter-spacing:.2px;text-transform:none;color:var(--ink)}

.progress{flex:0 0 auto;height:5px;background:var(--line)}
.progress span{display:block;height:100%;background:var(--amber-2);transition:width .2s ease}

@media (max-height:820px){ .rail-keys{display:none} }
@media (max-height:720px){
  .rail-lecture{padding-bottom:.5rem}
  .rail-lecture b{font-size:.56rem}
  .rn{padding:.22rem .25rem}
  .rail-foot{gap:.35rem;padding-top:.5rem}
}
@media (max-height:600px){
  .rail-lecture b{display:none}
  .rail-by{font-size:0;padding-top:.32rem}
  .rail-by b{font-size:.56rem}
  .rn-t{font-size:.46rem}
}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;align-items:center;gap:.7rem;border-right:none;
    border-bottom:3px solid var(--orange);padding:.5rem .8rem}
  .rail-nav,.rail-keys{display:none}
  .rail-lecture{padding-bottom:0;border-bottom:none}
  .rail-foot{flex-direction:row;align-items:center;border-top:none;padding-top:0;margin-left:auto}
  .rail-by{font-size:0;padding-top:0;border-top:none}
  .rail-by b{font-size:.56rem}
  .doc-head{padding:.8rem 1rem .5rem}
  main{padding:.7rem 1rem}
}

/* ================= shared blocks ================= */
.lede{margin:0;font-family:var(--hand);font-size:.94rem;line-height:1.38;color:var(--ink-2);max-width:54rem}
.lede b{color:var(--ink);font-weight:600}
.kicker{font-family:var(--news);font-style:italic;font-size:.82rem;color:var(--violet);margin:0}
.stage-row{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
svg.scene{width:100%;height:100%;max-height:100%;overflow:visible;fill:var(--ink)}
svg.scene rect:not(.nofx),svg.scene circle:not(.packet){filter:url(#rough)}
.cards{display:grid;gap:.5rem}
/* equal-height cards within a row, without forcing the grid to fill */
.fit > .cards > .pop{display:flex}
.fit > .cards > .pop > .card{flex:1 1 auto}
.card{position:relative;background:var(--card);border:2.5px solid var(--ink);
  border-radius:var(--wobble);padding:.62rem .9rem;overflow:visible;box-shadow:var(--shadow-sm)}
.card:nth-of-type(even){border-radius:var(--wobble-2);transform:rotate(.22deg)}
.card:nth-of-type(odd){transform:rotate(-.18deg)}
.card::after{content:'';position:absolute;left:.7rem;right:.7rem;top:-2px;height:7px;
  background:var(--pencil);border-radius:99px;opacity:.85}
.card.warn::after{background:var(--flame)} .card.good::after{background:var(--leaf)}
.card.pp::after{background:var(--amber-2)} .card.tl::after{background:var(--pencil-2)}
.card h4{margin:.1rem 0 .2rem;font-family:var(--hand);font-size:.62rem;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--orange-deep)}
.card.warn h4{color:var(--flame-ink)} .card.good h4{color:var(--leaf)}
.card.pp h4{color:var(--orange-deep)} .card.tl h4{color:var(--pencil-2)}
.card h3{margin:0 0 .18rem;font-family:var(--marker);font-weight:700;font-size:1.12rem;
  line-height:1.02;letter-spacing:0;color:var(--ink)}
.card p{margin:0;font-family:var(--hand);font-size:.76rem;line-height:1.34;color:var(--ink-2)}
.card:has(.ico) h3,.card:has(.ico) h4{padding-right:2.6rem}
.card .ico{position:absolute;right:.6rem;top:.55rem;width:1.9rem;height:1.9rem;
  border-radius:var(--wobble-2);display:grid;place-items:center;background:var(--amber-soft);
  border:2px solid var(--ink)}
.card .ico svg{width:1rem;height:1rem;color:var(--ink)}
.card.warn .ico svg{color:var(--flame)} .card.good .ico svg{color:var(--leaf)}
.card.pp .ico svg{color:var(--orange-deep)} .card.tl .ico svg{color:var(--pencil-2)}
code,.mono{font-family:var(--mono);font-size:.84em;background:var(--amber-soft);
  padding:1px 5px;border-radius:5px;color:var(--ink);border:1.5px solid var(--line)}
:root[data-theme="dark"] code,:root[data-theme="dark"] .mono{color:var(--orange-deep)}

.pop{opacity:0;transform:translateY(12px);animation:pop .42s cubic-bezier(.22,1,.36,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}
.d4{animation-delay:.3s}.d5{animation-delay:.38s}.d6{animation-delay:.46s}

/* ================= motion primitives ================= */
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(27,127,212,0))}
                     50%{filter:drop-shadow(0 0 10px rgba(27,127,212,.65))}}
@keyframes hotPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(232,85,45,.35))}
                    50%{filter:drop-shadow(0 0 16px rgba(232,85,45,.85))}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes dashFlow{to{stroke-dashoffset:-36}}

.sv-draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:drawIn .7s ease forwards}
.sv-fade{opacity:0;animation:fadeIn .45s ease forwards}
.sv-rise{opacity:0;animation:riseIn .5s cubic-bezier(.22,1,.36,1) forwards}
.sv-pop{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
.sv-glow{animation:glowPulse 2.1s ease-in-out infinite}
.sv-hot{animation:hotPulse 1.3s ease-in-out infinite}
.sv-float{animation:floatY 2.6s ease-in-out infinite}
.wire{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;filter:url(#rough2)}
.wire.live{stroke:var(--pencil-2);stroke-width:2.6;stroke-dasharray:9 9;animation:dashFlow .9s linear infinite}
/* `animation` is a shorthand, so a flowing wire that also fades in needs BOTH
   animations declared together - otherwise the flow replaces the fade and the
   line is stuck at opacity 0. */
/* packets riding the wires */
.packet{filter:drop-shadow(0 0 4px currentColor);opacity:.95}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sv-grow{transform-box:fill-box;transform-origin:bottom;animation:growUp .75s cubic-bezier(.22,1,.36,1) forwards}
@keyframes sweepX{0%{transform:translateX(0)}100%{transform:translateX(var(--sweep,840px))}}
.sv-sweep{animation:sweepX 2.4s linear infinite}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
.sv-blip{animation:blip 1.4s ease-in-out infinite}
@keyframes railPulse{0%,100%{opacity:1}50%{opacity:.55}}
.rn.now .rn-n{animation:railPulse 2.4s ease-in-out infinite}
.wire.live.sv-fade{animation:dashFlow .9s linear infinite, fadeIn .45s ease forwards}
.wire.sv-fade{animation:fadeIn .45s ease forwards}
.wire.hotwire{stroke:var(--orange)}
text{font-family:var(--hand)}
.t-lbl{font-size:17px;fill:var(--ink)}
.t-serif{font-family:var(--marker);font-weight:700;fill:var(--ink)}
.t-sub{font-size:16px;fill:var(--muted)}
.t-mono{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:var(--ink-2)}
.t-big{font-family:var(--marker);font-size:30px;font-weight:700;fill:var(--ink)}
.box{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-navy{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-blue{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-purple{fill:var(--amber);stroke:var(--ink);stroke-width:2.2;filter:url(#rough)}
.box-orange{fill:var(--flame);stroke:var(--ink);stroke-width:2.2;filter:url(#rough)}
.on-navy{fill:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .sv-draw{stroke-dashoffset:0}
  .sv-fade,.sv-rise,.sv-pop,.pop{opacity:1;transform:none}
}

/* ================= side-by-side explainer ================= */
.split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);
  gap:.9rem;align-items:start}
.split-l,.split-r{min-width:0;min-height:0}
.split-l{display:flex;align-items:center;height:100%}
.lp{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);
  padding:.85em 1em;box-shadow:var(--shadow-sm);transform:rotate(.22deg);
  font-size:clamp(10px,min(1.62vh,0.98vw),27px)}
.lp-head{display:flex;align-items:center;flex-wrap:wrap;gap:.45em;margin-bottom:.5em;min-width:0}
.lp-ico{flex:0 0 auto;width:2.3em;height:2.3em;border-radius:var(--wobble-2);display:grid;
  place-items:center;background:var(--amber-soft);border:2px solid var(--ink)}
.lp-ico svg{width:1.25em;height:1.25em;color:var(--ink)}
.lp-n{font-family:var(--hand);font-size:.86em;letter-spacing:1.3px;text-transform:uppercase;color:var(--orange-deep)}
.lp-t{font-family:var(--marker);font-weight:700;font-size:1.72em;line-height:.98;color:var(--ink)}
.lp-when{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:.72em;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink);background:var(--amber);padding:.18em .55em;
  border:2px solid var(--ink);border-radius:var(--wobble-2)}
.lp-owns{margin:0 0 .5em;font-family:var(--hand);font-size:1.08em;line-height:1.26;color:var(--ink-2)}
.lp-row{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:.5em;padding:.3em 0;
  border-top:2px dashed var(--line)}
.lp-k{font-family:var(--hand);font-size:.86em;letter-spacing:.9px;text-transform:uppercase;
  color:var(--muted);padding-top:.12em}
.lp-row.warn .lp-k{color:var(--flame-ink)} .lp-row.good .lp-k{color:var(--green)}
.lp-v{font-family:var(--hand);font-size:1.04em;line-height:1.26;color:var(--ink-2)}
@media (max-width:980px){.split{grid-template-columns:1fr;gap:.6rem}}

/* ================= taped-in logo ================= */
.taped{position:relative;display:inline-block;background:#fff;padding:.55rem .85rem;
  border:1px solid var(--line);box-shadow:var(--shadow);transform:rotate(-1.6deg)}
.taped.r{transform:rotate(1.3deg)}
.taped::before,.taped::after{content:'';position:absolute;width:3rem;height:1rem;
  background:rgba(255,215,102,.6);border:1px solid rgba(28,26,23,.14);
  box-shadow:0 1px 2px rgba(28,26,23,.10)}
.taped::before{top:-.42rem;left:-.85rem;transform:rotate(-24deg)}
.taped::after{bottom:-.42rem;right:-.85rem;transform:rotate(-24deg)}
.taped img{display:block;height:var(--logo-h,2.4rem);width:auto}
.taped figcaption{margin-top:.25rem;font-family:var(--hand);font-size:.5rem;
  color:var(--muted);text-align:center;letter-spacing:.3px}
:root[data-theme="dark"] .taped{background:#F7F2E8;color:#1C1A17}
:root[data-theme="dark"] .taped figcaption{color:#6B6259}

/* ================= chapter opener ================= */
.chapter{flex:1 1 auto;display:flex;align-items:center;gap:2.4rem;padding:0 .6rem}
.ch-rail{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;
  padding-right:2.2rem;border-right:4px dashed var(--amber-2)}
.ch-num{font-family:var(--marker);font-size:7rem;font-weight:700;line-height:.76;
  color:var(--ink);letter-spacing:0}
:root[data-theme="dark"] .ch-num{color:var(--ink)}
.ch-of{font-family:var(--hand);font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ch-body{flex:1 1 auto;min-width:0;max-width:46rem}
.ch-when{font-family:var(--hand);font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--orange-deep);margin-bottom:.3rem}
.ch-title{display:inline-block;margin:0 0 .65rem;font-family:var(--marker);font-weight:700;
  font-size:2.6rem;line-height:.98;letter-spacing:0;color:var(--ink);transform:rotate(-.8deg);
  background:linear-gradient(var(--amber),var(--amber));background-size:100% .5em;
  background-position:0 .66em;background-repeat:no-repeat;padding:0 .14em}
:root[data-theme="dark"] .ch-title{color:var(--ink)}
.ch-problem{margin:0 0 .45rem;font-family:var(--marker);font-weight:700;font-size:1.5rem;
  line-height:1.06;color:var(--ink)}
.ch-detail{margin:0 0 .5rem;font-family:var(--hand);font-size:.92rem;line-height:1.34;color:var(--ink-2)}
.ch-next{margin:0;font-family:var(--hand);font-size:.86rem;line-height:1.3;color:var(--ink);
  border-left:4px dashed var(--amber-2);padding-left:.7rem}
@media (max-width:900px){
  .chapter{flex-direction:column;align-items:flex-start;gap:1rem}
  .ch-rail{flex-direction:row;align-items:baseline;border-right:none;
    border-bottom:4px solid var(--orange);padding:0 0 .4rem;gap:.7rem}
  .ch-num{font-size:3rem}}

/* ================= chapter chip in the masthead ================= */


/* ================= notes / overview / zoom ================= */
#notes::-webkit-scrollbar,#ov::-webkit-scrollbar{width:0;height:0}
#notes,#ov{scrollbar-width:none}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(101%);
  transition:transform .28s ease;background:var(--navy);color:#eaf3fa;
  border-top:3px solid var(--gold);padding:14px 24px 16px;max-height:46vh;overflow-y:auto}
#notes.open{transform:none}
#notes h6{margin:0 0 6px;font-size:.5rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
#notes .say{font-family:var(--news);font-size:.82rem;line-height:1.55;max-width:66rem}
#notes .say b{color:var(--gold);font-weight:700}
#notes .nxt{margin-top:8px;font-size:.5rem;color:#8fabc2;font-family:var(--mono)}

#ov{position:fixed;inset:0;z-index:50;background:var(--bg);padding:28px;display:none;overflow-y:auto}
#ov.open{display:block}
#ov h3{margin:0 0 16px;font-family:var(--serif);font-size:.86rem;font-weight:700;color:var(--navy);letter-spacing:0;text-transform:none}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:10px}
.ovc{padding:11px 13px;border-radius:0;border:1px solid var(--line);border-top:3px solid var(--line);
  cursor:pointer;background:var(--panel);transition:.15s}
.ovc:hover{border-top-color:var(--orange)}
.ovc-ch{background:var(--squid);border-color:var(--squid);border-top-color:var(--orange)}
.ovc-ch .t{color:#fff}.ovc-ch .i{color:var(--orange)}
.ovc .i{font-family:var(--mono);font-size:.45rem;color:var(--blue);font-weight:700}
.ovc .t{font-family:var(--serif);font-size:.7rem;font-weight:700;margin-top:4px;line-height:1.2}

#zoom{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:60;
  padding:.9rem 1.5rem;border-radius:0;border:2px solid var(--orange);background:var(--panel);
  color:var(--squid);font-family:var(--mono);font-size:1.5rem;font-weight:700;opacity:0;
  pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:var(--shadow)}
#zoom.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#zoom small{display:block;font-size:.42em;color:var(--muted);font-weight:400;margin-top:.3rem;text-align:center}

:root:fullscreen main{padding:22px 34px}
:root:fullscreen header{padding-top:13px;padding-bottom:13px}

@media (max-width:900px){ header,main,footer{padding-left:14px;padding-right:14px} }

/* ================= additions for this deck ================= */
/* straight connectors have a zero-height box, which the rough filter would erase */
.wire{filter:none}
.cards > div{display:flex} .cards > div > .card{flex:1 1 auto}
.sql{font-family:var(--mono);font-size:.6rem;line-height:1.55;background:var(--card);color:var(--ink);
  border:2.5px solid var(--ink);border-radius:var(--wobble-2);padding:.5rem .85rem;box-shadow:var(--shadow-sm);
  white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;transform:rotate(-.15deg)}
.sql.big{font-size:.9rem;align-self:center}
.sql .k{color:var(--pencil-2);font-weight:700} .sql .s{color:var(--leaf);font-weight:700} .sql .c{color:var(--muted)}
.sql .hl{background:var(--amber);border-radius:4px;padding:0 .15em}
.tbl{display:flex;flex-direction:column;gap:.3rem}
.trh{display:grid;gap:.5rem;padding:.36rem .7rem;background:var(--amber);border:2.5px solid var(--ink);
  border-radius:var(--wobble-2);color:var(--ink);font-family:var(--hand);font-size:.62rem}
.tr{display:grid;gap:.5rem;padding:.4rem .7rem;border-radius:10px;background:var(--panel);
  font-family:var(--hand);font-size:.6rem;color:var(--ink-2);align-items:center}
.tr span:first-child{font-weight:700;color:var(--ink)}
.tr.hi{background:var(--amber-soft);box-shadow:inset 0 0 0 2px var(--ink)}
.toks{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;padding:.4rem 0}
.tok{font-family:var(--mono);font-size:.72rem;padding:.2rem .5rem;border:2px solid var(--ink);
  border-radius:var(--wobble-2);background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.tk-k{background:var(--pencil-soft)} .tk-i{background:var(--card)} .tk-o{background:var(--amber)} .tk-l{background:var(--leaf-soft)}
.tok-key{display:flex;gap:.4rem;justify-content:center}
.tok-key .tok{font-size:.44rem;box-shadow:none}
.quote{margin:0;font-family:var(--marker);font-weight:700;font-size:1.25rem;line-height:1.1;color:var(--ink);
  text-align:center}
.bigq{font-family:var(--marker);font-weight:700;font-size:9rem;line-height:1;color:var(--ink);
  background:linear-gradient(var(--amber),var(--amber));background-size:100% .4em;background-position:0 .7em;
  background-repeat:no-repeat;padding:0 .3em;transform:rotate(-3deg)}
.card .ul{display:block;line-height:1.55}
.card .ans{color:var(--leaf);font-size:1.15em}

/* ---- the case strip: problem -> see the problem -> solve it ---- */
.casebar{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem;flex:0 0 auto}
.case-n{font-family:var(--marker);font-weight:700;font-size:.95rem;color:var(--ink);margin-right:.35rem}
.ph{font-family:var(--hand);font-size:.52rem;letter-spacing:1px;text-transform:uppercase;padding:.14rem .55rem;
  border:2px dashed var(--line);border-radius:var(--wobble-2);color:var(--muted);white-space:nowrap}
.ph.done{border-style:solid;border-color:var(--ink-2);color:var(--ink-2)}
.ph.on{border-style:solid;border-color:var(--ink);background:var(--amber);color:var(--ink);box-shadow:var(--shadow-sm)}
.ph-sep{position:relative;width:1rem;height:2px;background:var(--ink-2)}
.ph-sep::after{content:'';position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--ink-2);border-right:0}
.caseq{flex:0 0 auto;font-family:var(--hand);font-size:.62rem;line-height:1.3;color:var(--ink-2);
  border-left:4px solid var(--flame);padding-left:.55rem}
.caseq b{color:var(--flame-ink)}
.probcard{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);padding:.7rem 1rem;
  box-shadow:var(--shadow);transform:rotate(-.25deg);position:relative;flex:0 0 auto}
.probcard::after{content:'';position:absolute;left:.7rem;right:.7rem;top:-2px;height:7px;background:var(--flame);border-radius:99px}
.probcard .pk{font-family:var(--hand);font-size:.58rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--flame-ink)}
.probcard .pq{font-family:var(--marker);font-weight:700;font-size:1.3rem;line-height:1.1;color:var(--ink);margin-top:.1rem}
.probcard p{margin:.3rem 0 0;font-family:var(--hand);font-size:.72rem;color:var(--ink-2)}
/* ---- chapter requirement card ---- */
.req{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble-2);padding:.55rem .85rem;
  box-shadow:var(--shadow-sm);margin-bottom:.5rem}
.req-k{font-family:var(--hand);font-size:.56rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--orange-deep)}
.req p{margin:.15rem 0 0;font-family:var(--marker);font-weight:700;font-size:1.02rem;line-height:1.15;color:var(--ink)}
.hard{font-family:var(--hand);font-size:.74rem;line-height:1.35;color:var(--ink-2);margin-bottom:.5rem}
.caselist{display:flex;flex-direction:column;gap:.22rem;border-left:4px dashed var(--amber-2);padding-left:.7rem}
.cl{display:flex;gap:.55rem;align-items:baseline;font-family:var(--hand);font-size:.7rem;color:var(--ink)}
.cl-n{font-family:var(--mono);font-size:.5rem;font-weight:700;color:var(--orange-deep);white-space:nowrap}
.chars{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.chr{font-family:var(--mono);font-size:.62rem;min-width:1.05em;text-align:center;padding:.12rem .1rem;
  border:1.5px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
.howto{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem;justify-content:center}

/* ---- the narrator's button ---- */
.present.voice{background:var(--card)}
.present.voice.speaking{background:var(--amber);animation:railPulse 1.2s ease-in-out infinite}
.present.voice .slash{display:none}
.present.voice.muted{opacity:.8}
.present.voice.muted .slash{display:inline} .present.voice.muted .wave{display:none}

/* ---- psql terminal windows: dark in both themes, like a real terminal ---- */
.terms{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;flex:0 0 auto}
.term{background:#1D1A17;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:var(--shadow-sm);min-width:0}
.term-bar{display:flex;align-items:center;gap:.28rem;padding:.22rem .55rem;background:#3A342D;color:#E8DFD0;
  font-family:var(--hand);font-size:.5rem;letter-spacing:.5px}
.term-bar i{width:.42rem;height:.42rem;border-radius:50%;background:#E8553A;display:inline-block}
.term-bar i:nth-child(2){background:#F7C948} .term-bar i:nth-child(3){background:#6FBF73}
.term-bar span{margin-left:.35rem}
.term pre{margin:0;padding:.45rem .65rem;font-family:var(--mono);font-size:.54rem;line-height:1.42;color:#EDE6D8;
  white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden}
.fit > .term{flex:0 0 auto}
.term .pr{color:#8FC7FF;font-weight:700}
.term .cm{color:#9E9382}
.term .nw{color:#8FD6AE;font-weight:700}
.term .wt{color:#F7C948;font-weight:700;animation:blip 1.4s ease-in-out infinite}
.term.bad{border-color:var(--flame)} .term.bad .term-bar{background:#6B2A1E}

/* ---- two sessions on one timeline: moments numbered down the middle ---- */
/* named .tline, not .tl: .tl is already a card colour, and the clash turned those cards into grids */
.tline{display:grid;grid-template-columns:minmax(0,1fr) 2.1rem minmax(0,1fr);flex:0 0 auto;row-gap:0}
.tl-h{display:flex;align-items:center;gap:.28rem;padding:.24rem .55rem;background:#3A342D;color:#E8DFD0;
  font-family:var(--hand);font-size:.5rem;letter-spacing:.5px;border:2.5px solid var(--ink);border-bottom:0;
  border-radius:8px 8px 0 0}
.tl-h i{width:.42rem;height:.42rem;border-radius:50%;background:#E8553A;display:inline-block}
.tl-h i:nth-child(2){background:#F7C948} .tl-h i:nth-child(3){background:#6FBF73}
.tl-h span{margin-left:.35rem}
.tl-h.bad{background:#6B2A1E;border-color:var(--flame)}
.tl-tm{align-self:end;text-align:center;font-family:var(--hand);font-size:.44rem;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);padding-bottom:.15rem}
.tl-c{background:#1D1A17;border-left:2.5px solid var(--ink);border-right:2.5px solid var(--ink);
  border-top:1px dashed #4A4136;padding:.28rem .6rem;font-family:var(--mono);font-size:.54rem;line-height:1.4;
  color:#EDE6D8;white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;min-height:1.6rem}
.tl-c.on{background:#26221D;box-shadow:inset 3px 0 0 #F7C948}
.tl-c.bad{border-left-color:var(--flame);border-right-color:var(--flame)}
.tline > .tl-c:nth-last-child(1),.tline > .tl-c:nth-last-child(3){border-bottom:2.5px solid var(--ink);border-radius:0 0 8px 8px}
.tl-c .pr{color:#8FC7FF;font-weight:700} .tl-c .cm{color:#9E9382} .tl-c .nw{color:#8FD6AE;font-weight:700}
.tl-c .wt{color:#F7C948;font-weight:700;animation:blip 1.4s ease-in-out infinite}
.tl-n{display:flex;align-items:flex-start;justify-content:center;padding-top:.3rem;position:relative}
.tl-n::before{content:'';position:absolute;top:0;bottom:0;left:50%;border-left:2px dashed var(--line)}
.tl-n b{position:relative;width:1.3rem;height:1.3rem;border-radius:50%;background:var(--amber);border:2px solid var(--ink);
  display:grid;place-items:center;font-family:var(--hand);font-size:.56rem;color:var(--ink)}

/* ---- Arial throughout: it runs wider than the sketch faces, so sizes are retuned ---- */
:root{--hand:Arial,Helvetica,sans-serif;--marker:Arial,Helvetica,sans-serif}
text{font-family:Arial,Helvetica,sans-serif}
.slide-title{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;transform:none;margin-top:.08rem}
.rail-lecture b{font-size:.78rem;font-weight:700}
.rn-t{font-size:.56rem}
.rail-by b{font-size:clamp(10px,.5rem,13px)}
.card h3{font-size:.84rem;line-height:1.15}
.card p{font-size:.68rem}
.lede{font-size:.8rem}
.ch-num{font-size:5.4rem;line-height:.92;margin-bottom:.25rem}
.ch-title{font-size:1.8rem}
.ch-problem{font-size:1.05rem}
.quote{font-size:.95rem}
.bigq{font-size:7rem}
.probcard .pq{font-size:.95rem;line-height:1.2}
.req p{font-size:.78rem;line-height:1.25}
.case-n{font-size:.72rem}
.t-lbl{font-size:15px} .t-sub{font-size:14px} .t-big{font-size:24px}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="2" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>


<div id="app">
  <aside class="rail">
    <div class="rail-lecture">PostgreSQL internals<b>MVCC &amp; the Query Engine</b></div>
    <nav class="rail-nav" id="railNav"></nav>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg><span id="btnFullTxt">Present</span></button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>
          <path class="slash" d="M22 9l-6 6M16 9l6 6"/>

<script>
/* =====================================================================
   Motion scenes - inline SVG infographics.
   Every scene takes the current step and returns markup; entrance
   animations are CSS classes, so a re-render replays only what changed.
   ===================================================================== */
/* ---- line-art icon set - stroked, inherits colour, reads at projector size ---- */
const ICON = {
  server:  'M3 4h18v6H3zM3 14h18v6H3zM7 7h.01M7 17h.01',
  db:      'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  lock:    'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  grid:    'M3 3h18v18H3zM3 9h18M9 3v18',
  search:  'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3',
  users:   'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6M22 19v-1a4 4 0 0 0-3-3.9',
  cart:    'M2 3h2l2.4 12.5a2 2 0 0 0 2 1.5h9.7a2 2 0 0 0 2-1.6L21 7H6M9.5 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2',
  bolt:    'M13 2 3 14h8l-1 8 10-12h-8z',
  trash:   'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',
  layers:  'M12 2 2 7l10 5 10-5zM2 12l10 5 10-5M2 17l10 5 10-5',
  ban:     'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M5.6 5.6l12.8 12.8',
  sigma:   'M18 5H6l6 7-6 7h12',
  clock:   'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',
  build:   'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5',
  route:   'M6 3v12a3 3 0 0 0 3 3h9M15 15l3 3-3 3',
  shield:  'M12 3l8 3v6c0 5-3.5 8.3-8 9.5C7.5 20.3 4 17 4 12V6z',
  split:   'M6 3v6a3 3 0 0 0 3 3h9M6 21v-6a3 3 0 0 1 3-3M15 9l3 3-3 3',
  gauge:   'M12 21a9 9 0 1 1 9-9M12 12l5-3'
};
const ico = (n, c='currentColor') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[n]||ICON.db}"/></svg>`;

/* ---- motion helpers -------------------------------------------------
   wire() draws a connector AND sends packets riding along it, so a query
   is visibly travelling rather than implied by a dashed line.          */
let flowSeq = 0;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function wire(d, o = {}){
  const id  = 'fp' + (++flowSeq);
  const col = o.color || 'var(--blue)';
  const dur = o.dur || 1.8;
  const n   = o.packets == null ? 1 : o.packets;
  const cls = 'wire' + (o.live === false ? '' : ' live') + (o.cls ? ' ' + o.cls : '');
  let g = `<path id="${id}" d="${d}" class="${cls}"${o.stroke ? ` stroke="${o.stroke}"` : ''}/>`;
  if(!REDUCED) for(let i = 0; i < n; i++){
    g += `<circle r="${o.r || 5}" fill="${col}" class="packet">
      <animateMotion dur="${dur}s" repeatCount="indefinite"
        begin="${((o.delay || 0) + i * dur / n).toFixed(2)}s" rotate="auto">
        <mpath href="#${id}" xlink:href="#${id}"/></animateMotion></circle>`;
  }
  return g;
}

const SV = (vb, inner) => `<svg class="scene" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const D  = n => `style="animation-delay:${n}ms"`;
/* =====================================================================

   One running story: NeoBank. Asha reads, Ravi writes.
   ===================================================================== */
const card = (k,t,p,cls='',ic='',pop='') =>
  `<div class="${pop}"><div class="card ${cls}">${ic?`<span class="ico">${ico(ic)}</span>`:''}
     <h4>${k}</h4><h3>${t}</h3><p>${p}</p></div></div>`;

/* animate only what is new on this step, so earlier steps stay still */
const an  = (k, st, cls='sv-rise') => st === k ? cls : '';
const pp  = (k, st) => st === k ? 'pop' : '';

/* SQL block with light highlighting: pass pre-marked HTML */
const sql = (html, extra='') => `<div class="sql ${extra}">${html}</div>`;
const K = s => `<span class="k">${s}</span>`;
const S = s => `<span class="s">${s}</span>`;
const C = s => `<span class="c">${s}</span>`;

/* a table built one row per step, in the lecture's sketch style */
function rowsTable(head, rows, st, tpl, hi = -1, from = 0){
  return `<div class="tbl">
    <div class="trh" style="grid-template-columns:${tpl}">${head.map(h=>`<span>${h}</span>`).join('')}</div>
    ${rows.map((r,i)=> st >= i + from ? `<div class="tr ${pp(i+from,st)} ${i===hi?'hi':''}"
       style="grid-template-columns:${tpl}">${r.map(c=>`<span>${c}</span>`).join('')}</div>` : '').join('')}

}

/* ---------------- drawing primitives ---------------- */
function person(x, y, name, role, col, cls='', delay=0){
  return `<g class="${cls}" ${D(delay)}>
    <circle cx="${x}" cy="${y}" r="19" fill="var(--amber-soft)" stroke="var(--ink)" stroke-width="2.4"/>

}
function cyl(x, y, w, h, label, sub='', cls='', fill='var(--card)'){
  return `<g class="${cls}">
    <path d="M${x} ${y+14} v${h-28} a${w/2} 14 0 0 0 ${w} 0 v${-(h-28)}" fill="${fill}" stroke="var(--ink)" stroke-width="2.6"/>

}
function boxT(x, y, w, h, title, sub='', o={}){
  const fill = o.fill || 'var(--card)';
  return `<g class="${o.cls||''}" ${D(o.delay||0)}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="var(--ink)"
      stroke-width="${o.sw||2.5}" ${o.dash?'stroke-dasharray="8 6"':''} ${o.glow?'class="sv-glow"':''}/>
    <text class="t-serif" x="${x+w/2}" y="${y+(sub?h/2-2:h/2+8)}" text-anchor="middle"
      style="font-size:${o.fs||18}px;fill:${o.tc||'var(--ink)'}">${title}</text>
    ${sub?`<text x="${x+w/2}" y="${y+h/2+22}" text-anchor="middle"
      style="font-size:${o.ss||12}px;fill:${o.sc||'var(--muted)'}">${sub}</text>`:''}</g>`;
}
function lockIco(x, y, s=1, col='var(--flame)'){
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-12 -2 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="var(--ink)" stroke-width="3"/>
    <rect x="-17" y="-3" width="34" height="26" rx="4" fill="${col}" stroke="var(--ink)" stroke-width="2.4"/></g>`;
}
function arrowHead(x, y, dir='r', col='var(--ink)'){
  const p = {r:`M${x-12} ${y-8} L${x} ${y} L${x-12} ${y+8}`, l:`M${x+12} ${y-8} L${x} ${y} L${x+12} ${y+8}`,
             d:`M${x-8} ${y-12} L${x} ${y} L${x+8} ${y-12}`, u:`M${x-8} ${y+12} L${x} ${y} L${x+8} ${y+12}`}[dir];
  return `<path d="${p}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
}

/* one heap tuple: version badge, data, and the two hidden header fields */
function tup(x, y, o){
  const w = o.w || 560, h = o.h || 60;

                 gone:'var(--paper)', vis:'var(--leaf-soft)'};

  const dash = (st==='new'||st==='gone') ? 'stroke-dasharray="8 6"' : '';
  const cell = (cx, lab, val, hi) => `
    <rect x="${cx}" y="${y+8}" width="98" height="${h-16}" rx="3"
      fill="${hi?'var(--amber)':'var(--paper-2)'}" stroke="var(--ink)" stroke-width="1.8"/>

    <text class="t-mono" x="${cx+49}" y="${y+h-15}" text-anchor="middle" style="font-size:14px;fill:var(--ink);font-weight:700">${val}</text>`;
  return `<g class="${o.cls||''}" ${D(o.delay||0)} ${st==='gone'?'opacity=".45"':''}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fills[st]}" stroke="var(--ink)" stroke-width="2.4" ${dash}/>
    <circle cx="${x+34}" cy="${y+h/2}" r="19" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>

    <text class="t-mono" x="${x+66}" y="${y+h/2+6}" style="font-size:14px;fill:var(--ink)">${o.data}</text>
    ${cell(x+w-214, 'xmin', o.xmin, o.hiMin)}${cell(x+w-108, 'xmax', o.xmax, o.hiMax)}
    ${o.tag?`<text class="t-serif" x="${x+w+18}" y="${y+h/2+9}" style="font-size:19px;fill:${o.tagc||'var(--ink)'}">${o.tag}</text>`:''}
  </g>`;
}
const VIS = 'var(--leaf)', INV = 'var(--flame-ink)', PEND = 'var(--orange-deep)';

/* VACUUM over a strip of tuple slots */
function sceneVacuum(st){
  const N = 24, pin = [4, 11, 17];
  const dead = [1,4,6,9,11,14,17,19,22];
  let g = `<text class="t-sub" x="40" y="30">accounts, one heap file: each slot holds one tuple</text>`;
  const full = st >= 3;
  let live = 0;
  for(let i=0;i<N;i++){
    let kind = dead.includes(i) ? 'd' : 'l';
    if(st >= 2 && kind === 'd' && !pin.includes(i)) kind = 'f';
    if(st === 1 || st === 2){ /* the long report is holding three of them */ }
    if(full && kind !== 'l' && !pin.includes(i)) continue;
    if(full && pin.includes(i)) kind = 'd';
    const x = full ? 40 + (live++) * 38 : 40 + i*38;
    const fill = kind==='l' ? 'var(--leaf-soft)' : kind==='d' ? 'var(--flame)' : 'var(--paper)';
    g += `<rect class="nofx ${st===2&&kind==='f'?'sv-fade':''}" x="${x}" y="46" width="32" height="54" rx="3" fill="${fill}"
      stroke="var(--ink)" stroke-width="2" ${kind==='f'?'stroke-dasharray="5 4"':''}/>`;
    if(st >= 1 && st < 3 && pin.includes(i)) g += `<g class="${an(1,st,'sv-pop')}">${lockIco(x+16, 128, .6, 'var(--pencil)')}</g>`;
  }
  const len = full ? live*38 : N*38;
  g += `<line x1="40" y1="${st>=1&&st<3?156:120}" x2="${40+len-6}" y2="${st>=1&&st<3?156:120}" stroke="var(--ink)" stroke-width="2"/>
    <text class="t-sub" x="${40+len-6}" y="${st>=1&&st<3?178:142}" text-anchor="end">file size: ${full?'smaller, rewritten':'unchanged'}</text>`;
  if(st >= 1 && st < 3) g += `<text class="t-sub" x="40" y="178" style="fill:var(--pencil-2)">a long-running report still needs these three</text>`;
  if(st === 2) g += `<rect class="nofx sv-sweep" x="36" y="40" width="6" height="66" fill="var(--amber-2)" style="--sweep:${N*38}px"/>`;
  return SV('0 0 1000 190', g);
}

  bal.forEach((b,i)=>{
    const x = 40 + i*235, now = moved ? after[i] : b, isRead = i < read;

    g += `<rect x="${x}" y="90" width="205" height="74" rx="4" fill="${isRead?'var(--pencil-soft)':'var(--card)'}" stroke="var(--ink)" stroke-width="2.4"/>

    <text class="t-sub" x="${36 + read*235}" y="76" text-anchor="middle">scan</text>`;

function tup3(x, y, o){

  const hi = o.hi || [];
  return `<g class="${o.cls||''}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fills[o.st||'live']}" stroke="var(--ink)" stroke-width="2.4"

}

/* the phase strip: only the phases a case actually uses */
const PH = {problem:'Problem', see:'See it go wrong', solve:'Fix it'};
function caseBar(sl, st){
  const ph = sl.steps[st].ph;
  const order = ['problem','see','solve'].filter(p => sl.steps.some(s => s.ph === p));
  const cur = order.indexOf(ph);
  const sols = sl.steps.filter(s=>s.ph==='solve').length;
  const k = sl.steps.slice(0, st+1).filter(s=>s.ph==='solve').length;
  const pills = order.map((p,i)=>`<span class="ph ${i===cur?'on':i<cur?'done':''}">${i+1}. ${PH[p]}${p==='solve'&&ph==='solve'&&sols>1?` (${k} of ${sols})`:''}</span>`)

/* two psql sessions side by side, drawn as terminal windows */
const term = (title, body, cls='') => `<div class="term ${cls}"><div class="term-bar"><i></i><i></i><i></i><span>${title}</span></div><pre>${body}</pre></div>`;
const terms = (a, b) => `<div class="terms">${a}${b}</div>`;
const psql = (title, body, cls='') => term('psql: ' + title, body, cls);
const PR  = '<span class="pr">neobank=#</span> ';
const PRT = '<span class="pr">neobank=*#</span> ';
const PRC  = '<span class="pr">neobank-#</span> ';    /* psql's prompt for a statement's next line */
const PRCT = '<span class="pr">neobank-*#</span> ';
const CM  = s => `<span class="cm">${s}</span>`;
const NEW = s => `<span class="nw">${s}</span>`;

BEGIN
${PRT}UPDATE accounts SET balance = 40000
${PRCT}  WHERE acc_no = 101;

${CM('-- not committed yet')}`;

${PRC}  WHERE acc_no = 101;`;

/* two sessions as one timeline: numbered moments down the middle, and each
   line sits in the window of whoever typed it, in the order it happened */
function timeline(titleL, titleR, rows, badR=false){
  let h = `<div class="tline"><div class="tl-h">${'<i></i><i></i><i></i>'}<span>${titleL}</span></div>
    <div class="tl-tm">time</div>
    <div class="tl-h ${badR?'bad':''}">${'<i></i><i></i><i></i>'}<span>${titleR}</span></div>`;
  rows.forEach(([side, html], i) => {
    const d = `style="animation-delay:${i*700}ms"`;
    h += `<div class="tl-c pop ${side==='L'?'on':''}" ${d}>${side==='L'?html:''}</div>
      <div class="tl-n pop" ${d}><b>${i+1}</b></div>
      <div class="tl-c pop ${side==='R'?'on':''} ${side==='R'&&badR?'bad':''}" ${d}>${side==='R'?html:''}</div>`;
  });
  return h + `</div>`;
}
const SEL101 = `${PR}SELECT balance FROM accounts WHERE acc_no = 101;`;
const RES = (v, note) => `\n${NEW(` balance\n---------\n   ${v}`)}${note?'      '+CM(note):''}`;

{ id:'casewait', kick:'readers vs. writers', eyebrow:'Readers and writers', title:'Asha should not have to wait',

  SEE('In a database that uses only locks: at moment 3 Asha\'s window just hangs. At moment 4 Ravi commits, and only at moment 5 does Asha finally get an answer. She waited the whole time. PostgreSQL does not do this; the next click shows what it does.'),
  SOL('The same moments in PostgreSQL. At moment 3 Asha gets 50,000 at once: the last finished value, from the old version. At moment 4 Ravi commits. At moment 5 Asha runs the same query and now sees 40,000. One limit: two people changing the same row still take turns.')],

    const t = timeline('psql: Ravi (T1), the writer',

{ id:'appendonly', kick:'piece 1: room for both versions', eyebrow:'Keeping two versions', title:'Where does the old value live?',

${NEW(' ctid  | balance\n-------+---------\n (0,1) |   50000')}
${PR}UPDATE accounts SET balance = 40000 WHERE acc_no = 101;
UPDATE 1
${PR}SELECT ctid, balance FROM accounts WHERE acc_no = 101;
${NEW(' ctid  | balance\n-------+---------\n (0,2) |   40000')}      ${CM('-- a new address: a new version was added')}`); } },

{ id:'xminxmax', kick:'piece 2: a label on each version', eyebrow:'Keeping two versions', title:'Which version is which?',

  steps:[

  SOL('The fix: every change gets a number, called a transaction ID. Each version carries two stickers. xmin: which transaction made it. xmax: which transaction replaced it, or 0 if it is still the latest. They are hidden columns, but you can ask for them by name, as the psql window shows.')],

${NEW(' xmin | xmax | acc_no | balance\n------+------+--------+---------\n  500 |    0 |    100 |   72000\n  802 |    0 |    101 |   40000\n  500 |    0 |    102 |   18000')}      ${CM('-- xmin = made by, xmax = replaced by (0 = latest)')}`); } },

{ id:'stickers', kick:'the three hidden columns, in plain words', eyebrow:'Keeping two versions', title:'What ctid, xmin and xmax mean',
  tag:'explainer', steps:[
  {note:'Three hidden columns on every row version. ctid is its address in the table: page number and slot number, so (0,2) means page 0, slot 2. xmin is the number of the transaction that created this version. xmax is the number of the transaction that ended it, by UPDATE or DELETE; 0 means nobody has ended it, so it is alive.'},
  {note:'INSERT. Transaction 500 creates the row. It lands at address (0,1). xmin becomes 500, because 500 made it. xmax is 0, because nobody has ended it.'},
  {note:'UPDATE. Transaction 802 changes the balance. Two things happen. The old version gets xmax 802: it was ended by 802. And a new version is added at a new address, (0,2), with xmin 802, because 802 made it. That is why the ctid changes after an UPDATE.'},
  {note:'DELETE. Transaction 910 deletes the row but has not finished. No new version, no new address. Only xmax changes, to 910. Another window can still see the row, with xmax 910, because 910 has not finished.'},
  {note:'ROLLBACK. Transaction 910 is cancelled. PostgreSQL does not go back and wipe the 910. It leaves it there, but because 910 was cancelled, an xmax of 910 counts as 0. The row is alive again.'},
  {note:'The cheat sheet. INSERT sets xmin. UPDATE ends the old version with xmax and creates a new one with a new ctid and a new xmin. DELETE only sets xmax. ROLLBACK changes nothing on disk; the cancelled number is simply ignored.'}],
  body:(st)=>{
    const q = `${PR}SELECT ctid, xmin, xmax, balance FROM accounts WHERE acc_no = 101;`;
    const res = (c, mn, mx, b, note) => `${NEW(` ctid  | xmin | xmax | balance\n-------+------+------+---------\n ${c} |  ${mn} |  ${mx.padStart(3)} |   ${b}`)}${note?'      '+CM(note):''}`;
    if(st===0) return `<div class="stage-row" style="flex:0 0 auto;height:30%">${sceneStickerParts()}</div>
      <div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${card('ctid','Where it lives','The row version\'s address: (page, slot). <b>(0,2)</b> = page 0, slot 2. A new version gets a new address.','tl','db','pop d1')}
        ${card('xmin','Born by','The number of the transaction that <b>created</b> this version (INSERT or UPDATE).','good','bolt','pop d2')}
        ${card('xmax','Ended by','The transaction that <b>deleted or replaced</b> it. <b>0</b> = nobody has, so it is still alive.','warn','ban','pop d3')}</div>`;
    if(st===5) return rowsTable(['Command','ctid','xmin','xmax'],[
        ['INSERT','new address for the new row','set to my transaction number','0'],
        ['UPDATE','old version keeps its address; the new version gets a new one','new version: my number','old version: my number; new version: 0'],
        ['DELETE','no change','no change','set to my number'],
        ['ROLLBACK','no change','no change','the cancelled number stays, but counts as 0']], 9, '.8fr 1.4fr 1.2fr 1.4fr')
      + fix('A number in xmin or xmax only counts if that transaction <b>finished</b>. A cancelled number is ignored.');
    const k = st - 1, s = STICK[k];
    const psqlBody = [
      `${PR}INSERT INTO accounts VALUES (101, 'Asha', 50000, 'Pune');      ${CM('-- transaction 500')}\nINSERT 0 1\n${q}\n${res('(0,1)','500','0','50000','-- born by 500, not ended')}`,
      `${PR}UPDATE accounts SET balance = 40000 WHERE acc_no = 101;      ${CM('-- transaction 802')}\nUPDATE 1\n${q}\n${res('(0,2)','802','0','40000','-- new address, born by 802 (the old one at (0,1) now has xmax 802)')}`,
      `${PR}BEGIN;\n${PRT}DELETE FROM accounts WHERE acc_no = 101;      ${CM('-- transaction 910, not finished')}\nDELETE 1\n${CM('-- meanwhile, in another window:')}\n${q}\n${res('(0,2)','802','910','40000','-- still visible: 910 has not finished')}`,
      `${PRT}ROLLBACK;      ${CM('-- cancel transaction 910')}\nROLLBACK\n${q}\n${res('(0,2)','802','910','40000','-- 910 was cancelled, so xmax 910 counts as 0: alive')}`][k];
    return `<div class="stage-row" style="flex:0 0 auto;height:${k===0?'22%':'36%'}">${sceneStickers(k)}</div>
      ${fix(s.say)}
      ${psql('watch the hidden columns', psqlBody)}`; } },

{ id:'rollback', kick:'a free lunch', eyebrow:'Deleting, undoing, cleaning', title:'Cancelling a change',

      + psql('cancel a change', `${PR}BEGIN;

UPDATE 1
${PRT}ROLLBACK;      ${CM('-- cancel')}
ROLLBACK
${PR}SELECT balance FROM accounts WHERE acc_no = 101;
${NEW(' balance\n---------\n   40000')}      ${CM('-- the old value, instantly: nothing was copied back')}`); } },

{ id:'vacuum', kick:'the cleaner', eyebrow:'Deleting, undoing, cleaning', title:'Who cleans up old versions?',
  tag:'case', problem:'Every change leaves an old version behind. Who removes them, and when is it safe?',
  steps:[
  P('Red boxes are old, dead versions. They take up space. Something has to clean them up. PostgreSQL counts them: n_dead_tup.'),
  SEE('But careful: a long report that started earlier may still need some of them. Throw those away and the report breaks.'),
  SOL('The fix: VACUUM, the cleaner. It removes an old version only when nobody running can still need it. In psql: 9 dead versions before, VACUUM, 3 left, the ones the report still needs. It also runs automatically, as autovacuum.')],
  body:(st)=>{
    const count = (live, dead, note) => `${PR}SELECT n_live_tup, n_dead_tup FROM pg_stat_user_tables WHERE relname = 'accounts';\n${NEW(` n_live_tup | n_dead_tup\n------------+------------\n         15 |          ${dead}`)}${note?'      '+CM(note):''}`;
    if(st===0) return problemCard(SLIDE.vacuum) + `<div class="stage-row">${sceneVacuum(0)}</div>` + psql('count the dead versions', count(15, 9, '-- 9 dead versions waiting'));
    if(st===1) return `<div class="stage-row">${sceneVacuum(1)}</div>`;
    return `<div class="stage-row" style="flex:0 0 auto;height:30%">${sceneVacuum(2)}</div>`
      + psql('run the cleaner', `${count(15, 9)}\n${PR}VACUUM accounts;\nVACUUM\n${count(15, 3, '-- 3 left: the long report still needs them')}`); } },

{ id:'bloat', kick:'the price', eyebrow:'Deleting, undoing, cleaning', title:'Changing every row at once',
  tag:'case', problem:'Every night, a job adds interest to all 1,000,000 accounts. What happens to the table?',
  steps:[
  P('One million accounts. Tonight a job changes every single one.'),
  SEE('Each change adds a new version, so the table now holds two million versions, half of them dead. In psql, the table grows from 94 MB to 188 MB. Reading it takes twice as long. This is called bloat.'),
  SOL('The fix: keep the cleaner running often. Autovacuum cleans up whenever dead versions pass a limit. In psql we lower that limit for this table with ALTER TABLE, and VACUUM ANALYZE cleans up and refreshes statistics, which we need in Part 2.')],
  body:(st)=>{
    const size = v => `${PR}SELECT pg_size_pretty(pg_relation_size('accounts'));\n${NEW(` pg_size_pretty\n----------------\n ${v}`)}`;
    if(st===0) return problemCard(SLIDE.bloat) + `<div class="stage-row">${sceneBloat(0)}</div>`;
    if(st===1) return `<div class="stage-row" style="flex:0 0 auto;height:34%">${sceneBloat(1)}</div>`
      + psql('the nightly interest job', `${size('94 MB')}\n${PR}UPDATE accounts SET balance = balance * 1.01;      ${CM('-- add 1% interest to every account')}\nUPDATE 1000000\n${size('188 MB')}      ${CM('-- twice the size: bloat')}`);
    return `<div class="stage-row" style="flex:0 0 auto;height:34%">${sceneSaw(1)}</div>`
      + psql('clean often, in small batches', `${PR}ALTER TABLE accounts SET (autovacuum_vacuum_scale_factor = 0.02);      ${CM('-- clean after 2% of rows change')}\nALTER TABLE\n${PR}VACUUM ANALYZE accounts;      ${CM('-- clean up + refresh statistics')}\nVACUUM`); } },

{ id:'oracle', kick:'another way to do it', eyebrow:'Deleting, undoing, cleaning', title:'Could old versions live somewhere else?',
  tag:'case', problem:'PostgreSQL keeps old versions inside the table, so the table grows. Is there another way?',
  steps:[
  P('PostgreSQL keeps old versions in the table itself. That is why we need the cleaner.'),
  SOL('Oracle does it differently. It writes the new value straight into the row, and moves the old value to a separate area called undo. Cancelling is slower there, but the table does not bloat. If undo is reused while a long report still needs it, the report fails with "snapshot too old".')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.oracle) + `<div class="stage-row">${sceneOracle(0)}</div>`;
    return `<div class="stage-row" style="flex:0 0 auto;height:40%">${sceneOracle(1)}</div>
      ${rowsTable(['','PostgreSQL','Oracle'],[
        ['Old versions','stay in the table','move to an undo area'],
        ['Cancelling','almost free','copy old values back'],
        ['Typical trouble','table bloat (VACUUM fixes it)','"ORA-01555: snapshot too old"']], 9, '1fr 1.3fr 1.3fr')}`; } },

{ id:'stats', kick:'counting before running', eyebrow:'Choosing the fastest way', title:'How many rows will match?',
  tag:'case', problem:'To pick the fastest way, the database must guess how many rows match, before running anything. How?',

  SOL('The fix: ANALYZE looks at a sample of rows and saves statistics. pg_stats shows Pune is 30% of accounts, and 5% of balances are above 100,000. So: one million times 0.30 times 0.05 is about 15,000 rows.')],

    if(st===0) return problemCard(SLIDE.stats);

      + psql('the statistics ANALYZE saved', `${PR}ANALYZE accounts;
ANALYZE
${PR}SELECT most_common_vals, most_common_freqs FROM pg_stats WHERE tablename = 'accounts' AND attname = 'branch';
${NEW(' most_common_vals        | most_common_freqs\n-------------------------+---------------------\n {Pune,Mumbai,Delhi,...} | {0.3,0.12,0.08,...}')}      ${CM('-- Pune: 30% of rows')}`); } },

{ id:'scans', kick:'three ways to read', eyebrow:'Choosing the fastest way', title:'Which way to read the table?',
  tag:'case', problem:'About 15,000 matching rows are spread across 12,000 pages. What is the fastest way to get them?',
  steps:[
  P('Our 15,000 matching rows are spread all over the table.'),
  SOL('Way 1, read everything: go through every page, first to last. EXPLAIN calls it Seq Scan. Best when most rows match, or the table is small.'),
  SOL('Way 2, use the index: look up each match, then jump to its page. EXPLAIN calls it Index Scan. Best when only a few rows match, like one account number.'),
  SOL('Way 3, the middle path: first list all the pages that have matches, then visit those pages in order, once each. EXPLAIN calls it Bitmap Heap Scan. Best for a medium number of matches, like our 15,000.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.scans) + `<div class="stage-row">${sceneScatter()}</div>`;
    const k = [0,1,3][st-1];
    const c = [['Way 1: Sequential Scan','Read every page. Best when most rows match.','tl'],
               ['Way 2: Index Scan','Look up, then jump to each page. Best when few rows match.','pp'],
               ['Way 3: Bitmap Scan','List the pages first, then visit them in order. Best for our 15,000.','good']][st-1];
    const q = [
      [`${PR}EXPLAIN SELECT * FROM accounts;`, ' Seq Scan on accounts  (cost=0.00..22000.00 rows=1000000 width=36)'],
      [`${PR}EXPLAIN SELECT * FROM accounts WHERE acc_no = 101;`, ' Index Scan using accounts_pkey on accounts  (cost=0.42..8.44 rows=1 width=36)\n   Index Cond: (acc_no = 101)'],
      [`${PR}EXPLAIN SELECT holder_name, balance FROM accounts\n<span class="pr">neobank-#</span>   WHERE branch = 'Pune' AND balance &gt; 100000;`, " Bitmap Heap Scan on accounts  (cost=180.20..9014.50 rows=15000 width=36)\n   Recheck Cond: (branch = 'Pune'::text)\n   Filter: (balance &gt; '100000'::numeric)\n   -&gt;  Bitmap Index Scan on accounts_branch_idx"]][st-1];
    return `<div class="stage-row" style="flex:0 0 auto;height:${st===3?'32%':'36%'}">${sceneScanKind(k)}</div>
      <div class="cards">${card('Option '+st+' of 3', c[0], c[1], c[2], '', 'pop')}</div>
      ${psql('EXPLAIN shows which way it chose', `${q[0]}\n${NEW(q[1])}`)}`; } },

{ id:'joins', kick:'matching two tables', eyebrow:'Choosing the fastest way', title:'Which way to join?',
  tag:'case', problem:'Match each Pune account with its transactions from a second table. Comparing every pair would take forever. What else can we do?',
  steps:[
  P('A second table, transactions, lists every transaction. The query joins it to accounts. Comparing every account with every transaction means billions of comparisons.'),
  SOL('There are three smarter ways. Nested loop: for each account, look up its transactions by index; good when there are few accounts. Hash join: build a quick-lookup table in memory, then go through the other table once; good for big tables. Merge join: sort both by account number and zip them together. EXPLAIN shows which one the database picked, here a Hash Join.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.joins) + psql('the join query', `${PR}SELECT a.holder_name, t.amount
<span class="pr">neobank-#</span>   FROM accounts a JOIN transactions t ON t.acc_no = a.acc_no
<span class="pr">neobank-#</span>   WHERE a.branch = 'Pune';`) + `<div class="stage-row">${sceneAllPairs()}</div>`;
    return `<div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${card('Way 1','Nested Loop','For each account, look up its transactions by index. Few accounts.','tl','route','pop d1')}
        ${card('Way 2','Hash Join','Build a quick-lookup table in memory, then scan the other once. Big tables.','pp','grid','pop d2')}
        ${card('Way 3','Merge Join','Sort both by account number, then zip them together.','good','split','pop d3')}</div>
      <div class="stage-row" style="flex:0 0 auto;height:30%">${sceneJoin(1)}</div>
      ${psql('EXPLAIN shows the join it picked', `${PR}EXPLAIN SELECT ...;      ${CM('-- the join query')}\n${NEW(' Hash Join\n   Hash Cond: (t.acc_no = a.acc_no)\n   -&gt;  Seq Scan on transactions t\n   -&gt;  Hash  -&gt;  Seq Scan on accounts a')}`)}`; } },

{ id:'decision', kick:'the cheapest wins', eyebrow:'Choosing the fastest way', title:'Pick the winner',
  tag:'case', problem:'Three ways can answer our query. Which one does the database choose?',

  P('Three candidate ways. The database gives each a cost score. Lower is better.'),

      + psql('EXPLAIN: the plan the database picked', `${PR}EXPLAIN SELECT holder_name, balance FROM accounts WHERE branch = 'Pune' AND balance &gt; 100000;
${NEW(" Bitmap Heap Scan on accounts  (cost=180.20..9014.50 rows=15000 width=36)\n   Recheck Cond: (branch = 'Pune'::text)\n   Filter: (balance &gt; '100000'::numeric)\n   -&gt;  Bitmap Index Scan on accounts_branch_idx  (cost=0.00..176.45 rows=300000 width=0)")}`); } },

{ id:'volcano', kick:'one row at a time', eyebrow:'Running the plan', title:'How do rows move through the plan?',
  tag:'case', problem:'If every step finished all its work before passing it on, you would wait a long time and memory would fill up. How does the database avoid that?',
  steps:[
  P('The plan is a stack of steps: Limit on top of Sort on top of a Scan. The slow way: each step finishes everything, then hands over a huge pile. The user waits, and memory fills with a million rows.'),
  SOL('The fix: the top step asks the one below for just one row, with next(). That request passes down, and one row comes back up, like a relay race. The first rows arrive quickly, and memory stays small. EXPLAIN prints the same stack, top to bottom.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.volcano) + `<div class="stage-row">${sceneMaterialize()}</div>`;
    return `<div class="stage-row" style="flex:0 0 auto;height:40%">${sceneVolcano(1)}</div>`
      + psql('the plan is a stack of steps', `${PR}EXPLAIN SELECT holder_name, balance FROM accounts WHERE branch = 'Pune' AND balance &gt; 100000 ORDER BY balance DESC LIMIT 3;
${NEW(" Limit\n   -&gt;  Sort\n         Sort Key: balance DESC\n         -&gt;  Bitmap Heap Scan on accounts")}      ${CM('-- read it top to bottom: Limit, Sort, Scan')}`); } },

{ id:'exectrace', kick:'top 3 richest in Pune', eyebrow:'Running the plan', title:'Which rows reach the user?',

<span class="pr">neobank-#</span>   WHERE branch = 'Pune' AND balance &gt; 100000
<span class="pr">neobank-#</span>   ORDER BY balance DESC LIMIT 3;
${NEW(' holder_name | balance\n-------------+---------\n Nisha       |  410000\n Meera       |  180000\n Rohan       |  125000\n(3 rows)')}      ${CM('-- Kiran (deleted) and Arjun (not finished) are hidden')}`)
