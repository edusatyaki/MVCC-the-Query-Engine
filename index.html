  SEE('The naive answer: overwrite the slot in place. Now 50,000 is gone. Asha can either wait for Ravi, or read a dirty 40,000. Both are exactly what we ruled out in chapter 2.'),
  SOL('Solution, step one: UPDATE never modifies in place. It marks v1 as expired and appends a brand-new version, v2, at a new location, (0,2). v1 is untouched, so Asha can still read it.'),
  SOL('Step two, vocabulary and proof. Each physical version is a tuple; expired versions waiting for cleanup are dead tuples. Select ctid before and after an UPDATE and watch the location change.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.appendonly) + `<div class="stage-row">${sceneOverwrite(0)}</div>`;
    if(st===1) return `<div class="stage-row">${sceneOverwrite(1)}</div>`;
    return `<div class="stage-row">${sceneHeap(1)}</div>
      ${st===3?`<div class="cards pop" style="grid-template-columns:1fr 1fr">
        ${card('Vocabulary','Tuple and dead tuple','Each physical version is a <b>tuple</b>. Expired versions waiting for cleanup are <b>dead tuples</b>.','tl','layers')}
        ${card('Prove it','Watch the ctid move','<code>SELECT ctid, * FROM accounts;</code> before and after the UPDATE.','pp','search')}</div>`:''}`; } },

{ id:'xminxmax', kick:'piece 2 of 3: a label on each version', eyebrow:'Row versions', title:'Tell the versions apart',
  tag:'case', problem:'The heap now holds two versions of row 101. How does a reader know which one belongs to its moment in time?',
  steps:[
  P('We now have two versions of row 101 side by side. Asha has to pick one. How?'),
  SEE('Look closely: nothing on either version says who created it, or whether it is still current. Without that, no reader can choose.'),
  SOL('Solution, step one: every transaction gets a monotonically increasing ID, its XID. Each tuple is stamped with xmin, the XID of the transaction that created it: the INSERT, or the UPDATE that produced it.'),
  SOL('Step two: each tuple is also stamped with xmax, the XID of the transaction that expired it, by an UPDATE or DELETE. Zero means still current.'),
  SOL('Step three: these columns are hidden, but you can ask for them by name. Row 101 after Ravi\'s UPDATE: two versions, and the XIDs tell the whole story.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.xminxmax) + `<div class="stage-row">${sceneWhich(0)}</div>`;
    if(st===1) return `<div class="stage-row">${sceneWhich(1)}</div>`;
    if(st<=3) return `<div class="stage-row">${sceneHeader(st-2)}</div>`;
    return `<div class="pop" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:center">
      ${sql(`${K('SELECT')} xmin, xmax, acc_no, balance
  ${K('FROM')} accounts;`)}
      ${rowsTable(['xmin','xmax','acc_no','balance'],[['500','802','101','50000'],['802','0','101','40000']], 9, '1fr 1fr 1fr 1fr')}
    </div>`; } },

{ id:'rule', kick:'piece 3 of 3: a rule that picks', eyebrow:'Row versions', title:'Decide what a reader may see',
  tag:'case', problem:'Each version now carries xmin and xmax. What exact test turns those two numbers into "visible" or "not visible"?',
  steps:[
  P('Every version has two numbers now. We need a precise test: numbers in, yes or no out.'),
  SEE('Four real tuples, and a reader whose snapshot saw 500 and 802 commit while 905 is still running. Can the class classify them? Without a rule, the answers are guesses.'),
  SOL('Solution, rule one: created and visible. The tuple\'s xmin must have committed at or before my snapshot was taken.'),
  SOL('Rule two: not yet expired. Its xmax is zero, or the transaction in xmax had not committed when my snapshot was taken.'),
  SOL('Both rules, joined by AND. Now the four tuples classify themselves: A visible, B invisible by rule one, C invisible by rule two, D visible because 905 has not committed. The executor runs this on every tuple it touches.')],
  body:(st)=>{
    const rows = (ans) => rowsTable(['Tuple','xmin','xmax','Visible?'],[
      ['A','500 (committed)','0', ans?'yes':'?'],
      ['B','905 (running)','0', ans?'no: rule 1':'?'],
      ['C','500 (committed)','802 (committed)', ans?'no: rule 2':'?'],
      ['D','802 (committed)','905 (running)', ans?'yes':'?']], 9, '.5fr 1.2fr 1.2fr 1fr');
    if(st===0) return problemCard(SLIDE.rule) + `<div class="stage-row">${sceneRule(-1)}</div>`;
    if(st===1) return `<p class="lede pop">Reader's snapshot: <b>500 and 802 had committed; 905 is still running.</b></p>${rows(false)}`;
    return `<div class="stage-row">${sceneRule(st-2)}</div>${st===4?`<div class="pop">${rows(true)}</div>`:''}`; } },

{ id:'trace', kick:'the three pieces, working together', eyebrow:'Worked example, account 101', title:'What does each reader see?',
  tag:'case', problem:'Four moments in the life of account 101. At each one, apply the rule: what does the reader see?',
  steps:[
  P('Put the three pieces together on account 101. Four moments. At each one, the class applies the rule before you reveal it.'),
  SEE('Moment one: transaction 500 inserted the row long ago. v1 holds 50,000 with xmin 500 and xmax 0.'),
  SEE('Moment two: transaction 802, Ravi, runs the UPDATE and has not committed. v1 gets xmax 802; v2 is born with xmin 802.'),
  SOL('Moment three: transaction 803, Asha, reads. v1: xmax 802 has not committed, so v1 is visible. v2: xmin 802 has not committed, so it is invisible. She sees 50,000.'),
  SOL('Moment four: 802 commits, and transaction 804 reads. v2 is visible and shows 40,000. v1 is expired for everyone new: it is now a dead tuple.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.trace) + rowsTable(['XID','Type','Event','Reader sees'],[], 0, '.6fr .6fr 2fr 1fr');
    const k = st-1;
    return `<div class="stage-row" style="flex:0 0 auto">${sceneTuples(TRACE[k], k, true)}</div>
      ${rowsTable(['XID','Type','Event','Reader sees'],[
        ['500','write','Row inserted long ago','-'],
        ['802','write','UPDATE, not committed','-'],
        ['803','read','SELECT while 802 is open','50000'],
        ['804','read','SELECT after 802 commits','40000']], k, '.6fr .6fr 2fr 1fr', k)}`; } },

{ id:'columns', kick:'so the trace reads unambiguously', eyebrow:'Reference', title:'What each column means',
  tag:'reference', steps:[
  {note:'XID: the ID of the transaction driving the event. Type: write means INSERT, UPDATE or DELETE, which change tuples; read means SELECT, which only observes them. Event: the statement and its commit state.'},
  {note:'Heap tuple: the physical version in the table, v1, v2 and so on. xmin: the XID that created it. xmax: the XID that expired it, or zero if it is still current.'},
  {note:'The link: a write transaction\'s XID is stamped into xmin and/or xmax. A read transaction\'s XID never is; it only determines the snapshot.'}],
  body:(st)=>`
    <div class="cards" style="grid-template-columns:repeat(3,1fr);gap:.55rem">
      ${card('XID','Who is acting','The transaction ID, increasing by one for each new transaction.','','', pp(0,st))}
      ${card('Type','Write or read','A write changes tuples; a read only observes them.','tl','', pp(0,st))}
      ${card('Event','What ran','The statement, and whether it has committed.','pp','', pp(0,st))}
      ${st>=1?card('Heap tuple','Which version','The physical row version (v1, v2, ...) and its balance.','','', pp(1,st)):''}
      ${st>=1?card('xmin','Created by','The XID of the INSERT, or of the UPDATE that produced it.','good','', pp(1,st)):''}
      ${st>=1?card('xmax','Expired by','The XID of the UPDATE or DELETE that expired it; 0 if current.','warn','', pp(1,st)):''}
    </div>
    ${st>=2?`<p class="lede ${pp(2,st)}">A write transaction's XID is stamped into <b>xmin and/or xmax</b>. A read transaction's XID never is: <b>it only determines the snapshot</b>.</p>`:''}` },

/* ------------------------------ chapter 4 ------------------------------ */
{ id:'delete', kick:'same mechanism', eyebrow:'Deleting, undoing, cleaning', title:'Deleting while someone is counting',
  tag:'case', problem:'Ravi deletes account 102 while a report that started earlier is counting accounts. Should the report still count 102?',
  steps:[
  P('A report starts counting accounts while three exist. Midway, Ravi deletes account 102. Should the report count it?'),
  SEE('Suppose DELETE physically erased the row. The report has counted 101; now 102 vanishes before the report reaches it.'),
  SEE('The report finishes and says 2. But 3 accounts existed when it began: the same inconsistency as the broken sum.'),
  SOL('Solution, step one: DELETE never erases. It writes Ravi\'s XID, 910, into the tuple\'s xmax. That is all a DELETE does.'),
  SOL('Step two: the report\'s snapshot was taken before 910 committed, so by rule two the tuple is still visible to it. The report counts 3, which is correct for its moment in time.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.delete) + `<div class="stage-row">${sceneDeleteBad(0)}</div>`;
    if(st<=2) return `<div class="stage-row">${sceneDeleteBad(st)}</div>`;
    return `${sql(`${K('DELETE FROM')} accounts ${K('WHERE')} acc_no = ${S('102')};   ${C('-- Ravi closes an account')}`)}
      <div class="stage-row">${sceneDelete(st-2)}</div>`; } },

{ id:'rollback', kick:'a free lunch', eyebrow:'Deleting, undoing, cleaning', title:'Undoing a failed transaction',
  tag:'case', problem:'Transaction 900 updates account 101, then fails and rolls back. How is its change undone?',
  steps:[
  P('Transaction 900 updates account 101: v1 gets xmax 900, and a new v2 appears with xmin 900. Then 900 fails. How is the change undone?'),
  SEE('In a design that overwrites rows in place, the old value is copied to an undo log first.'),
  SEE('To roll back, that design must copy every old value back, row by row. The bigger the failed transaction, the longer the undo takes.'),
  SOL('Solution, step one: in PostgreSQL, transaction 900 is simply marked aborted. v1\'s xmax is 900, but 900 aborted, so the expiry never took effect. v2\'s xmin is 900, so v2 is invisible to everyone, forever.'),
  SOL('Step two: there is nothing to undo. The new version was never marked committed, and no undo log was ever written. Keep this in mind for the Oracle case at the end of the chapter.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.rollback) + `<div class="stage-row">${sceneRollback(0)}</div>`;
    if(st<=2) return `<div class="stage-row">${sceneUndo(st-1)}</div>`;
    return `<div class="stage-row">${sceneRollback(st-2)}</div>`; } },

{ id:'rbtrace', kick:'the rollback, applied', eyebrow:'Deleting, undoing, cleaning', title:'Delete, then change your mind',
  tag:'case', problem:'Ravi runs DELETE on account 101, then rolls back. Is the account still open?',
  steps:[
  P('Start from the committed state after transaction 802: v2, 40,000, xmin 802, xmax 0. Ravi now closes the account, then changes his mind. Is it still open?'),
  SEE('Transaction 905 runs DELETE. v2\'s xmax becomes 905. Read naively, the row now looks deleted.'),
  SOL('Solution: Ravi rolls back, so 905 is aborted, and an aborted XID in xmax means "not expired". v2 is live again and account 101 stays open. On disk xmax still holds 905; VACUUM tidies it later. Nothing was undone physically.')],
  body:(st)=>{
    const tbl = rowsTable(['XID','Type','Event','v2 is'],[
      ['802','state','Committed state after 802','live'],
      ['905','write','DELETE, not committed','expiring'],
      ['905','abort','ROLLBACK: 905 never commits','live again']], st, '.6fr .6fr 2fr 1fr', st);
    if(st===0) return problemCard(SLIDE.rbtrace) + `<div class="stage-row" style="flex:0 0 auto">${sceneTuples(RB[0], 0, true)}</div>`;
    return `<div class="stage-row" style="flex:0 0 auto">${sceneTuples(RB[st], st, true)}</div>${tbl}`; } },

{ id:'vacuum', kick:'the garbage collector', eyebrow:'Deleting, undoing, cleaning', title:'Who clears away the old versions?',
  tag:'case', problem:'Every UPDATE and DELETE leaves a dead version behind. What removes them, and when is it safe to?',
  steps:[
  P('Every UPDATE and DELETE leaves a dead version in the heap. The red slots are dead tuples. Left alone, they stay there forever. What removes them, and when is that safe?'),
  SEE('The catch: some dead versions are still needed. A long-running report took its snapshot earlier, and to it these three are still visible. Remove them and the report breaks.'),
  SOL('Solution, step one: VACUUM reclaims a tuple only if it is dead AND invisible to every running transaction. The pinned three stay; the rest become free, reusable space. Note that the file does not shrink.'),
  SOL('Step two: when the space must actually be returned, VACUUM FULL rewrites the table compactly, under an exclusive lock. And autovacuum runs plain VACUUM automatically once dead tuples cross a threshold.')],
  body:(st)=>{
    const top = st===0 ? problemCard(SLIDE.vacuum) : '';
    return `${top}<div class="stage-row">${sceneVacuum(st===0?0:st)}</div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:.9rem;align-items:center">
        ${sql(`${K('SELECT')} n_dead_tup
  ${K('FROM')} pg_stat_user_tables;`)}
        <p class="lede">${st===0?'Dead tuples are counted in <b>n_dead_tup</b>.':st===1?'Dead, but <b>still visible to a running report</b>: not safe to remove yet.':st===2?'<b>Plain VACUUM recycles</b>: the space is reusable, but the file does not shrink.':'<b>VACUUM FULL rewrites</b> and shrinks the table, under an exclusive lock.'}</p>
      </div>`; } },

{ id:'bloat', kick:'every choice is a trade-off', eyebrow:'Deleting, undoing, cleaning', title:'A job that rewrites every row',
  tag:'case', problem:'A nightly interest job updates all 1,000,000 accounts. What happens to the table, and how do we keep it healthy?',
  steps:[
  P('accounts has one million rows: one million live tuples. Tonight an interest-credit job updates every one of them. What happens?'),
  SEE('Every UPDATE appends a tuple. The heap now holds about two million tuples, half of them dead: roughly twice its logical size.'),
  SEE('And everything slows down: sequential scans read twice the pages, and the cache holds only half as much useful data.'),
  SOL('Solution, step one: autovacuum runs continuously. Dead tuples climb until they cross a threshold, then autovacuum reclaims them.'),
  SOL('Step two: for a high-update table like accounts, lower autovacuum_vacuum_scale_factor. The threshold drops, cleanups are smaller and more frequent, and bloat never builds up.'),
  SOL('Step three: VACUUM ANALYZE does two jobs at once. VACUUM reclaims dead tuples; ANALYZE refreshes statistics. Plant the seed: statistics are the hero of Part 2.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.bloat) + `<div class="stage-row">${sceneBloat(0)}</div>`;
    if(st<=2) return `<div class="stage-row">${sceneBloat(1)}</div>
      ${st===2?`<div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${card('Disk','About 2x the size','The heap holds a dead copy of every row.','warn','db','pop d1')}
        ${card('Scans','2x the pages','A sequential scan reads the dead tuples too.','warn','search','pop d2')}
        ${card('Cache','Half the useful data','Dead tuples take memory live data needed.','warn','layers','pop d3')}</div>`:''}`;
    return `<div class="stage-row">${sceneSaw(st>=4?1:0)}</div>
      ${st===5?`<div class="pop" style="display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:.7rem;align-items:center">
        ${sql(`${K('VACUUM ANALYZE')} accounts;`)}
        ${card('VACUUM','Reclaims dead tuples','Frees their space for reuse.','good','trash')}
        ${card('ANALYZE','Refreshes statistics','The planner depends on it.','pp','gauge')}</div>`:''}`; } },

{ id:'advantages', kick:'evaluating the design', eyebrow:'What append-only MVCC buys', title:'Four advantages',
  tag:'evaluation', steps:[
  {note:'Step back and score the design. One: readers never block writers, and writers never block readers.'},
  {note:'Two: instant, cheap ROLLBACK. There is nothing to undo.'},
  {note:'Three: no separate undo storage to size or manage. Old versions live in the table itself.'},
  {note:'Four: consistent snapshots for long reports, with no table locks.'}],
  body:(st)=>`
    <div class="cards" style="grid-template-columns:1fr 1fr;gap:.7rem">
      ${card('01','No blocking','Readers never block writers, and writers never block readers.','good','shield',pp(0,st))}
      ${st>=1?card('02','Instant ROLLBACK','Nothing to undo: the new version is simply never committed.','good','bolt',pp(1,st)):''}
      ${st>=2?card('03','No undo storage','Nothing extra to size or manage: old versions live in the table.','good','db',pp(2,st)):''}
      ${st>=3?card('04','Long reports, no locks','Consistent snapshots without locking the table.','good','clock',pp(3,st)):''}
    </div>` },

{ id:'oracle', kick:'same concept, two designs', eyebrow:'Deleting, undoing, cleaning', title:'Is there another way to keep old versions?',
  tag:'case', problem:'PostgreSQL keeps old versions inside the table and pays for it with bloat and VACUUM. Could the old versions live somewhere else?',
  steps:[
  P('PostgreSQL keeps old versions in the table itself. Ask: could they live somewhere else?'),
  SEE('The cost of keeping them in the table: bloat, a permanent VACUUM burden, and, in the worst case, XID wraparound.'),
  SOL('Solution, step one: Oracle\'s design. It overwrites the row in place and copies the old data into a separate undo segment; a reader rebuilds a past version by applying undo backwards.'),
  SOL('Step two: compare where old versions live, what UPDATE does, and what ROLLBACK costs. PostgreSQL rollback is nearly free; Oracle must apply undo records.'),
  SOL('Step three: cleanup and failure modes. PostgreSQL carries VACUUM and bloat; Oracle recycles undo automatically but risks ORA-01555 snapshot too old when undo is reused while a long query still needs it. One design pays at read and cleanup time, the other at write time.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.oracle) + `<div class="stage-row">${sceneOracle(0)}</div>`;
    if(st===1) return `<div class="stage-row">${sceneOracle(0)}</div><div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${card('Bloat','The table grows','Old versions take space inside the heap.','warn','db','pop d1')}
        ${card('VACUUM','Never finished','Cleanup has to run all the time.','warn','trash','pop d2')}
        ${card('Worst case','XID wraparound','XIDs must be frozen before the counter wraps.','warn','clock','pop d3')}</div>`;
    const rows = [
      ['Old versions live','in the table itself (heap)','in undo segments'],
      ['UPDATE','appends a new tuple','overwrites in place, old copy to undo'],
      ['ROLLBACK','nearly free (new version ignored)','must apply undo records (costly)'],
      ['Cleanup burden','VACUUM and bloat in the table','undo space recycled automatically'],
      ['Classic failure','table bloat, XID wraparound','ORA-01555 snapshot too old']];
    const upto = st===2 ? -1 : st===3 ? 2 : 4;
    return `<div class="stage-row" style="flex:0 0 auto;height:${st===2?'60%':'32%'}">${sceneOracle(1)}</div>
      ${st>=3?rowsTable(['','PostgreSQL','Oracle'], rows.slice(0, upto+1), 9, '1fr 1.3fr 1.3fr'):''}
      ${st===4?`<p class="lede pop">Same concept, two designs: <b>one pays at read and cleanup time, the other at write time</b>.</p>`:''}`; } },

/* ------------------------------ chapter 5 ------------------------------ */
{ id:'pipeline', kick:'you cannot tune what you cannot see', eyebrow:'Part 2 roadmap', title:'The four-stage pipeline',
  tag:'roadmap', steps:[
  {note:'Before the cases, the map. Every query passes through four stages, and every EXPLAIN plan and index decision maps to one of them.'},
  {note:'Stage one, the Parser: is this valid SQL grammar? It produces a parse tree.'},
  {note:'Stage two, the Analyzer and Rewriter: do these objects exist, are you allowed to use them, and should the query be rewritten? It produces a query tree.'},
  {note:'Stage three, the Planner: of all the ways to get this answer, which is cheapest? It produces a plan tree. That is chapter 6.'},
  {note:'Stage four, the Executor: run the chosen plan, row by row. That is chapter 7.'}],
  body:(st)=>`<div class="stage-row">${scenePipe(st, false)}</div>
    <p class="lede">${['From the raw SQL string to rows on the client: <b>four stages</b>, and each one can go wrong in its own way.',
      '<b>Parser</b>: grammar only. Is this valid SQL?',
      '<b>Analyzer / Rewriter</b>: meaning. Do these objects exist, may you use them, and should the query be rewritten?',
      '<b>Planner</b>: cost. Of all the ways to get this answer, which is cheapest?',
      '<b>Executor</b>: run the chosen plan, row by row.'][st]}</p>` },

{ id:'running', kick:'follow this one all the way', eyebrow:'The running query', title:'Pune high-net-worth accounts',
  tag:'setup', steps:[
  {note:'One query for the rest of the lecture. We will follow this string through all four stages until rows reach the client.'},
  {note:'Note the two-part WHERE clause: branch equals Pune, AND balance above 100,000. It matters at the parser, where AND becomes a node, and again at the planner, where each half gets its own estimate.'}],
  body:(st)=>`
    ${sql(`${K('SELECT')} holder_name, balance
  ${K('FROM')}   accounts
 ${K('WHERE')}  <span class="${st>=1?'hl':''}">branch = ${S("'Pune'")}</span>
   ${K('AND')}  <span class="${st>=1?'hl':''}">balance &gt; ${S('100000')}</span>;`, 'big')}
    <p class="lede">${st>=1?'Two conditions joined by <b>AND</b>. They come back at the parser, and again at the planner.':'We will trace <b>this string</b> all the way to rows on the client.'}</p>` },

{ id:'parser', kick:'stage 1: grammar, not meaning', eyebrow:'From SQL text to a query tree', title:'Is this string valid SQL?',
  tag:'case', problem:'The engine receives a flat string of characters. How does it decide whether it is valid SQL, and what structure does it turn it into?',
  steps:[
  P('The engine receives our query as one flat string. How does it decide whether this is valid SQL, and what does it turn it into?'),
  SEE('To the engine it is only characters. Two suspects: SELECT unicorn FROM narnia, and SELECT star FORM accounts. Which one is invalid? Nothing in a row of characters can tell you yet.'),
  SOL('Solution, step one, lexing: break the string into tokens. Keywords, identifiers, operators and literals.'),
  SOL('Step two, parsing: arrange the tokens by the SQL grammar into a tree. The root is a SELECT statement, and its target list holds the columns.'),
  SOL('Step three: the from clause holds the table name, and the where clause becomes a Boolean tree. AND is a node with two children; operators are internal nodes, operands are leaves.'),
  SOL('Step four, the verdict on our suspects. The parser knows grammar, not meaning. SELECT unicorn FROM narnia parses fine. SELECT star FORM accounts dies here with a syntax error.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.parser) + sql(RAWQ.replace('>','&gt;'));
    if(st===1) return `${charCells()}<div class="cards" style="grid-template-columns:1fr 1fr">
        ${card('Suspect 1','<code>SELECT unicorn FROM narnia;</code>','Valid or invalid?','pp','','pop d1')}
        ${card('Suspect 2','<code>SELECT * FORM accounts;</code>','Valid or invalid?','pp','','pop d2')}</div>`;
    if(st===2) return tokenChips(0);
    if(st<=4) return `<div class="stage-row">${sceneTree(st===3?1:3)}</div>`;
    return `<div class="stage-row" style="flex:0 0 auto;height:45%">${sceneTree(3)}</div>
      <div class="cards" style="grid-template-columns:1fr 1fr">
        ${card('Parses fine','<code>SELECT unicorn FROM narnia;</code>','Whether a table exists is not a question of grammar.','good','','pop d1')}
        ${card('Syntax error','<code>SELECT * FORM accounts;</code>','<code>FORM</code> breaks the grammar. It dies at the parser.','warn','','pop d2')}</div>`; } },

{ id:'analyzer', kick:'stage 2: meaning, checked against the catalog', eyebrow:'From SQL text to a query tree', title:'Grammar is fine. Is the meaning?',
  tag:'case', problem:'These queries all parse. But does the table exist, do the types fit, and is this user allowed to read it?',
  steps:[
  P('The parser has accepted the query. But grammar is not meaning. Does the table exist, do the types fit, may this user read it?'),
  SEE('Three queries that all parse, and all must fail: a misspelled table, a text column compared with a number, and a role with no rights. The query tree still holds unchecked names.'),
  SOL('Solution, job one, catalog lookup: look up accounts in pg_class and replace the name with an OID. "relation acounts does not exist" is raised here.'),
  SOL('Job two, attribute check: do the columns exist, and do the types fit? Checked against pg_attribute. branch greater than 100000 on a TEXT column is a type error.'),
  SOL('Job three, permission check: does the role have SELECT on the table? The intern role gets "permission denied".'),
  SOL('Job four, view substitution: if a name is a view, the Rewriter splices in its definition. That is the next case.'),
  SOL('So errors come in a fixed order: syntax from the parser, then existence, then privileges, both from the analyzer.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.analyzer) + `<div class="stage-row">${sceneCatalog(-1)}</div>`;
    if(st===1) return `<div class="stage-row">${sceneCatalog(-1)}</div><div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${card('Parses, but','<code>SELECT * FROM acounts;</code>','Is there such a table?','warn','','pop d1')}
        ${card('Parses, but','<code>... WHERE branch &gt; 100000</code>','branch is TEXT.','warn','','pop d2')}
        ${card('Parses, but','<code>SET ROLE intern; SELECT ...</code>','intern may only use views.','warn','','pop d3')}</div>`;
    const jobs = [
      ['Job 1','Catalog lookup','Look up <code>accounts</code> in <code>pg_class</code>, replace names with OIDs. "relation acounts does not exist".','tl','db'],
      ['Job 2','Attribute check','Columns and types checked against <code>pg_attribute</code>. <code>branch &gt; 100000</code> on TEXT: type error.','pp','grid'],
      ['Job 3','Permission check','Does the role have SELECT? <code>intern</code> gets "permission denied".','warn','lock'],
      ['Job 4','View substitution','If a name is a view, the Rewriter splices in its definition.','good','layers']];
    const k = st-2;
    return `<div class="stage-row">${sceneCatalog(Math.min(k,4))}</div>
      <div class="cards">${k<4 ? card(jobs[k][0], jobs[k][1], jobs[k][2], jobs[k][3], jobs[k][4], 'pop') :
        card('Error order','Syntax, then existence, then privileges','Syntax errors come from the parser. Existence and privilege errors come from the analyzer.','pp','route','pop')}</div>`; } },

{ id:'rewriter', kick:'stored queries, not data', eyebrow:'From SQL text to a query tree', title:'A view has no rows. What gets scanned?',
  tag:'case', problem:'pune_hnw is a view: it stores no data. So what does the planner scan when someone selects from it?',
  steps:[
  P('Someone runs SELECT holder_name FROM pune_hnw. But pune_hnw is a view. What will the planner scan?'),
  SEE('To the query tree, pune_hnw is just a name, and there are no rows stored under it. Scanning "the view" makes no sense.'),
  SOL('Solution, step one: at rewrite time the view\'s stored definition is fetched. SELECT star FROM accounts WHERE branch is Pune AND balance is above 100,000.'),
  SOL('Step two: the definition is spliced into the tree, which becomes exactly our running query against the base table. Views are stored query fragments, not stored data, and the planner never knows a view was involved.')],
  body:(st)=>{
    const code = sql(`${K('CREATE VIEW')} pune_hnw ${K('AS')}
  ${K('SELECT')} * ${K('FROM')} accounts
   ${K('WHERE')} branch = ${S("'Pune'")}
     ${K('AND')} balance &gt; ${S('100000')};

${K('SELECT')} holder_name ${K('FROM')} pune_hnw;`);
    if(st===0) return problemCard(SLIDE.rewriter) + code;
    return `<div style="display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1rem;align-items:center">
      ${code}<div class="stage-row">${sceneView(st===1?-1:st-1)}</div></div>
      ${st===3?`<p class="lede pop">After rewriting, the planner sees <b>only base tables</b>.</p>`:''}`; } },

/* ------------------------------ chapter 6 ------------------------------ */
{ id:'costphil', kick:'no fixed rules', eyebrow:'Choosing the cheapest plan', title:'Index or no index?',
  tag:'case', problem:'There is an index on branch. Should the planner always use it for branch = \'Pune\'?',
  steps:[
  P('There is an index on branch. The tempting rule: always use an index when one exists. Is that right?'),
  SEE('Imagine 99% of accounts were in Pune. Using the index means one random heap hop for almost every row: about 990,000 hops at cost 4 each. A sequential scan reads the 12,000 pages once, in order.'),
  SOL('Solution: no fixed rules. The planner estimates a cost for each candidate and picks the cheapest, and that depends on the actual shape of the data. To know the shape without reading the table, it needs statistics.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.costphil, 'The tempting rule: "always use an index when there is one."');
    if(st===1) return `<div class="stage-row">${sceneDots()}</div>`;
    return `<div class="stage-row" style="flex:0 0 auto;height:45%">${sceneDots()}</div>
      <div class="cards" style="grid-template-columns:1fr 1fr">
        ${card('The rule','Estimate, then pick the cheapest','No fixed rules like "always use an index".','good','gauge','pop d1')}
        ${card('What it needs','Statistics','How the data is distributed, known without reading the whole table.','pp','sigma','pop d2')}</div>`; } },

{ id:'stats', kick:'the ANALYZE inside VACUUM ANALYZE', eyebrow:'Choosing the cheapest plan', title:'How many rows will match?',
  tag:'case', problem:'To compare costs, the planner must know how many rows match before running anything. Where does that number come from?',
  steps:[
  P('Every cost depends on how many rows match. The planner has to know that before running the query. Where does the number come from?'),
  SEE('Without statistics the planner is blind: it knows the table has a million rows, but not how many are in Pune or above 100,000.'),
  SOL('Solution: ANALYZE samples about 30,000 rows and stores statistics. First, reltuples and relpages: one million rows in 12,000 pages. These size every cost formula.'),
  SOL('null_frac: 2% of branch values are NULL, which shrinks the expected matches.'),
  SOL('n_distinct: branch has 40 distinct values, so equality defaults to about one in forty.'),
  SOL('most_common_vals: but Pune is 30% of all rows. For popular values the planner uses the exact frequency.'),
  SOL('histogram_bounds for balance: from these buckets, balance above 100,000 is about 5% of rows.'),
  SOL('correlation: acc_no is about 1.0, meaning physical order matches key order, which makes index scans cheaper.'),
  SOL('Put it together: one million times 0.30 times 0.05 is about 15,000 rows. That is the estimate every plan will be costed against.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.stats);
    if(st===1) return `<div class="stage-row">${sceneFunnel(0, true)}</div>`;
    if(st<=7) return rowsTable(['Statistic','NeoBank value','The planner uses it to'],[
      ['<code>reltuples, relpages</code>','1,000,000 rows / 12,000 pages','size every cost formula'],
      ['<code>null_frac</code>','2% of branch is NULL','shrink expected matches'],
      ['<code>n_distinct</code>','branch has 40 distinct values','estimate = (about 1/40)'],
      ['<code>most_common_vals</code>',"'Pune' = 30% of rows",'use exact frequency for popular values'],
      ['<code>histogram_bounds</code>','balance: 0, 12k, 45k, ..., 98 lakh','estimate ranges (&gt; 100000 is about 5%)'],
      ['<code>correlation</code>','acc_no is about 1.0','make index scans cheaper']], st-2, '1.1fr 1.2fr 1.3fr', st-2);
    return `<div class="stage-row">${sceneFunnel(0)}</div>
      <p class="lede pop">Estimate for our query: <b>1M x 0.30 x 0.05 = about 15,000 rows</b>.</p>`; } },

{ id:'scans', kick:'the building blocks', eyebrow:'Choosing the cheapest plan', title:'Which way to read the table?',
  tag:'case', problem:'About 15,000 matching rows are scattered across 12,000 pages. What is the fastest way to fetch them?',
  steps:[
  P('We expect about 15,000 matches. What is the fastest way to fetch them?'),
  SEE('The matches are scattered across the heap. Some pages hold several, most hold none. Every way of reading the table pays for that differently.'),
  SOL('Option one, sequential scan: read every page from first to last. It wins when a large fraction qualifies, or the table is small.'),
  SOL('Option two, index scan: walk the B-tree, then hop to the heap for each match. One random hop per row: great for acc_no = 101, costly for 15,000.'),
  SOL('Option three, index-only scan: answer from the index alone, if it holds every needed column and the visibility map says the pages are all-visible. A callback to MVCC.'),
  SOL('Option four, bitmap scan: collect matching locations into a bitmap, sort by page, and visit each page once, in order. The fit for medium selectivity like our 15,000 rows.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.scans) + `<div class="stage-row">${sceneScatter()}</div>`;
    if(st===1) return `<div class="stage-row">${sceneScatter()}</div>`;
    const k = st-2;
    const c = [
      ['Sequential Scan','Read every page.','Wins when a large fraction qualifies, or the table is small.','tl','search'],
      ['Index Scan','B-tree, then one heap hop per match.','Wins for high selectivity (<code>acc_no = 101</code>).','pp','route'],
      ['Index-Only Scan','No heap visits at all.','Only if the index has every needed column and the visibility map allows it.','good','layers'],
      ['Bitmap Heap Scan','Each page visited once, in order.','Wins for medium selectivity: our 15,000 rows.','good','grid']][k];
    return `<div class="stage-row">${sceneScanKind(k)}</div>
      <div class="cards">${card('Option '+(k+1)+' of 4', c[0], '<b>'+c[1]+'</b> '+c[2], c[3], c[4], 'pop')}</div>`; } },

{ id:'joins', kick:'match each Pune account with its transactions', eyebrow:'Choosing the cheapest plan', title:'Which way to join?',
  tag:'case', problem:'Match each Pune account with its rows in transactions. Comparing every account with every transaction would take forever. What are the alternatives?',
  steps:[
  P('A second table: transactions, with txn_id, acc_no, amount and txn_date. We want each Pune account with its transactions. How?'),
  SEE('The brute-force way compares every account with every transaction. 20 comparisons in this picture; 300,000 times 50 million at NeoBank scale.'),
  SOL('Option one, nested loop: for each outer row, probe the inner side through an index. It wins when the outer side is tiny: ten accounts, ten cheap lookups.'),
  SOL('Option two, hash join: build a hash table on the smaller input, then scan the bigger input once and probe it. It wins for large, unsorted equality joins, and needs memory.'),
  SOL('Option three, merge join: sort both sides, or use an order they already have, then zip them together. It wins when inputs are already sorted, or both are huge.'),
  SOL('And the planner also permutes join order: A with B first, or B with C first, can differ enormously in cost.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.joins) + sql(`transactions(txn_id, acc_no, amount, txn_date)`);
    if(st===1) return `<div class="stage-row">${sceneAllPairs()}</div>`;
    const k = Math.min(st-2, 2);
    const c = [
      ['Nested Loop','For each outer row, probe the inner side.','Wins: tiny outer side, indexed inner side.','tl','route'],
      ['Hash Join','Build a hash on the smaller input, scan the bigger, probing.','Wins: large, unsorted equality joins. Needs memory.','pp','grid'],
      ['Merge Join','Sort both sides (or use their order), then zip.','Wins: inputs already sorted, or both huge.','good','split']][k];
    return `<div class="stage-row">${sceneJoin(k)}</div>
      <div class="cards">${card('Option '+(k+1)+' of 3', c[0], c[1]+' '+c[2], c[3], c[4], st-2<=2?'pop':'')}</div>
      ${st===5?`<p class="lede pop">The planner also permutes <b>join order</b>: (A JOIN B) JOIN C versus A JOIN (B JOIN C).</p>`:''}`; } },

{ id:'decision', kick:'lowest total cost wins', eyebrow:'Choosing the cheapest plan', title:'Pick the winner',
  tag:'case', problem:'Three plans can answer the running query. Which one does PostgreSQL actually run?',
  steps:[
  P('We have three candidate plans for the running query. Which one runs?'),
  SEE('Each plan gets a cost in abstract units: pages times page cost, plus rows times CPU cost, plus operator costs. Until we compute them, all three are question marks.'),
  SOL('Sequential scan: 12,000 pages at 1.0 plus a million rows at 0.01. About 22,000.'),
  SOL('Index scan on branch: about 15,000 random heap hops at 4.0. 60,000 or more. The "obvious" index is the most expensive.'),
  SOL('Bitmap scan: pages visited in order. About 9,000. The winner.'),
  SOL('EXPLAIN confirms it: the cost and the 15,000-row estimate are exactly what we computed by hand. The obvious index lost because the planner knew Pune is 30% of the bank.')],
  body:(st)=>{
    const f = `<p class="lede"><b>cost = pages x page_cost + rows x cpu_tuple_cost + operator costs</b>, reported as <code>startup..total</code>.</p>`;
    if(st===0) return problemCard(SLIDE.decision) + f;
    return `${f}<div class="stage-row">${sceneCost(st===1?0:st-1)}</div>
      ${st===5?`<div class="pop" style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:.8rem;align-items:center">
        ${sql(`Bitmap Heap Scan on accounts
  (cost=180.2..9014.5 rows=15000 width=36)
  Recheck Cond: (branch = 'Pune')
  -&gt;  Bitmap Index Scan ...`)}
        <p class="lede">The "obvious" index lost, because the planner <b>knew Pune is 30% of the bank</b>.</p></div>`:''}`; } },

/* ------------------------------ chapter 7 ------------------------------ */
{ id:'volcano', kick:'the iterator model', eyebrow:'Running the plan', title:'How do rows flow through a plan?',
  tag:'case', problem:'If every node computed its whole result before passing it on, the client would wait and memory would fill up. How does the executor avoid that?',
  steps:[
  P('The planner handed over a tree: Limit on Sort on a scan. How do rows actually move through it?'),
  SEE('The naive way: each node computes its entire result, then hands it up. The client waits for everything, and every node holds up to a million rows in memory.'),
  SOL('Solution, step one: every node implements the same tiny interface: open, next and close.'),
  SOL('Step two: it is pull-based. The client asks the root for one row; next calls cascade down; rows bubble up one at a time.'),
  SOL('Step three, the payoff: streaming, because the first rows arrive before the scan finishes, and low memory, because most nodes hold one row at a time.'),
  SOL('Step four, the exception: Sort and hash-build are pipeline-breakers. They must consume their whole input first, which is why ORDER BY delays the first row.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.volcano) + `<div class="stage-row">${sceneVolcano(0)}</div>`;
    if(st===1) return `<div class="stage-row">${sceneMaterialize()}</div>`;
    return `<div class="stage-row">${sceneVolcano(st>=3?1:0)}</div>
      <div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${st>=4?card('Streaming','First rows arrive early','With <code>LIMIT 10</code>, only about 10 rows are pulled.','good','bolt',pp(4,st)):''}
        ${st>=4?card('Low memory','One row at a time','Most nodes never hold a full intermediate result.','tl','layers',pp(4,st)):''}
        ${st>=5?card('Pipeline-breakers','Sort and hash-build','They consume the whole input first: why ORDER BY delays row 1.','warn','clock',pp(5,st)):''}
      </div>`; } },

{ id:'exectrace', kick:'... ORDER BY balance DESC LIMIT 3', eyebrow:'Running the plan', title:'Which rows reach the client?',
  tag:'case', problem:'Run the query with ORDER BY balance DESC LIMIT 3. The heap holds a deleted row and an uncommitted row. Which three rows reach the client, and where is MVCC checked?',
  steps:[
  P('Our query, now with ORDER BY balance DESC LIMIT 3. The plan: Limit on Sort on a sequential scan. Which three rows reach the client?'),
  SEE('Here is what the scan will find in the heap: eight tuples, including Kiran\'s, deleted by a committed transaction, and Arjun\'s, inserted by one that has not committed. Some are not Pune; some are below 100,000.'),
  SOL('Solution, step one: the client asks Limit for a row, and Limit asks Sort.'),
  SOL('Step two: Sort is a pipeline-breaker, so it pulls every row from the scan. The scan applies the filter and, on every tuple, the xmin/xmax rule from Part 1. Kiran and Arjun are invisible.'),
  SOL('Step three: Sort orders the four survivors and answers next three times: Nisha, Meera, Rohan. Limit reports done, and close cascades down.'),
  SOL('The point: every next on a scan node runs the visibility rule. The executor is where MVCC physically happens, and the two halves of the lecture meet here.')],
  body:(st)=>{
    if(st===0) return problemCard(SLIDE.exectrace) + `<div class="stage-row">${sceneExec(0)}</div>`;
    if(st===1) return `<div class="stage-row">${sceneExec(0, true)}</div>`;
    return `<div class="stage-row">${sceneExec(Math.min(st-1,3))}</div>
      ${st===5?`<p class="lede pop">Every <code>next()</code> on a scan node runs the <b>xmin/xmax rule from Part 1</b>. The two halves meet here.</p>`:''}`; } },

{ id:'wrap', kick:'sixty-second replay', eyebrow:'Wrap-up', title:'One query\'s full journey',

/* number the cases in running order, and put the phase strip on each one */
const SLIDE = Object.fromEntries(DECK.map(d => [d.id, d]));
let caseN = 0;
CHAPTERS.forEach(ch => ch.of.forEach(id => {
  const d = SLIDE[id];
  if(d && d.problem){

</script>
<script>
/* ---- assemble the running order: a chapter opener, then that chapter's slides ---- */
const BY_ID = Object.fromEntries(DECK.map(d => [d.id, d]));
const RUN = [];
CHAPTERS.forEach(ch => {
  if(OPENERS[ch.n]) RUN.push({
    id:'ch'+ch.n, chapter:ch, type:'chapter',
    eyebrow:'Chapter '+ch.n, title:ch.t, kick:OPENERS[ch.n].when, tag:'story',
    steps:[
      {note:'Chapter card. Pause here - this is where the story turns. Read the situation, then let them feel the problem before you name the technique.'},
      {note:OPENERS[ch.n].problem},
      {note:OPENERS[ch.n].detail},
      {note:OPENERS[ch.n].next}
    ],
    body:(st)=>chapterBody(ch, st)
  });
  ch.of.forEach(id => { const d = BY_ID[id]; if(d){ d.chapter = ch; RUN.push(d); } });
});
DECK.length = 0;
RUN.forEach(d => DECK.push(d));
/* the title slide opens the deck, ahead of chapter 1's requirement card */
const TI = DECK.findIndex(d => d.id === 'title');
if(TI > 0) DECK.unshift(DECK.splice(TI, 1)[0]);

/* ===================== presenter engine ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
let si = 0, pi = 0, lastSlide = null;

function render(){
  const sl = DECK[si];
  pi = Math.max(0, Math.min(pi, sl.steps.length - 1));
  const entering = lastSlide !== sl.id;
  lastSlide = sl.id;
  stage.innerHTML = `<div class="slide"${entering?' data-entering="1"':''}>`
                  + `<div class="fit">${sl.body(pi)}</div></div>`;
  $('#sTitle').textContent   = sl.title;
  $('#sEyebrow').textContent = sl.eyebrow;
  $('#sKick').textContent    = sl.kick || '';
  railState(sl);
  $('#noteSay').innerHTML = sl.steps[pi].note || '-';
  $('#noteNxt').textContent = pi+1 < sl.steps.length
    ? `next: step ${pi+2} of this slide`
    : (si+1 < DECK.length ? `next: ${DECK[si+1].title}` : 'end of deck');
  const done = DECK.slice(0, si).reduce((n,d)=>n+d.steps.length, 0) + pi + 1;
  const all  = DECK.reduce((n,d)=>n+d.steps.length, 0);
  $('#progFill').style.width = (done/all*100).toFixed(2) + '%';
  $('#stepCount').textContent = `Page ${done} / ${all}`;
  fitSlide();
}

/* Scale the current step down if it would not fit, so a slide is never
   scrollable and never clipped. Entrance animations start elements translated,
   so the first measurement can read short - re-measure once the frame has laid
   out and again once the longest entrance has finished. */
let fitTimer = null;
function fitSlide(){
  const slide = stage.querySelector('.slide'), fit = stage.querySelector('.fit');
  if(!slide || !fit) return;
  const measure = () => {
    if(!fit.isConnected) return;
    fit.style.transform = '';
    /* A centred box splits its overflow above AND below, and scrollHeight only
       counts what hangs below - so a centred measurement under-reports the true
       need by about half. This applies at every nesting level, not just the
       outer column, so flatten them all for the measurement. */
    fit.classList.add('measuring');
    const avail = fit.clientHeight;
    let need = fit.scrollHeight;
    fit.querySelectorAll('*').forEach(el => {        // catch anything still spilling
      const h = el.scrollHeight;
      if(h > need && el.parentElement === fit) need = h;
    });
    fit.classList.remove('measuring');
    if(need > avail + 1){
      /* Centred content that overflows puts half of itself ABOVE the box, which
         a top-origin scale cannot pull back. Anchor to the top before scaling. */
      fit.classList.add('topfit');
      /* the sketch rotations make visual boxes a few px taller than their
         layout boxes, which scrollHeight cannot see - leave room for it */
      const k = Math.max(0.42, (avail - 12) / need);
      fit.style.transform = `scale(${k.toFixed(4)})`;
    } else {
      fit.classList.remove('topfit');
    }
  };
  measure();
  requestAnimationFrame(measure);
  clearTimeout(fitTimer);
  fitTimer = setTimeout(measure, 520);                  // after the last .pop lands
}
window.addEventListener('resize', fitSlide);
if(window.ResizeObserver) new ResizeObserver(fitSlide).observe(document.querySelector('#app'));
/* the rail is the table of contents: click a chapter to jump to its first slide */
$('#railNav').innerHTML = CHAPTERS.map(ch =>
  `<div class="rn" data-ch="${ch.n}">
     <span class="rn-n">${String(ch.n).padStart(2,'0')}</span>
     <span class="rn-t">${ch.t}</span></div>`).join('');
$('#railNav').querySelectorAll('.rn').forEach(el => el.onclick = () => {
  const n = +el.dataset.ch;
  const at = DECK.findIndex(d => d.chapter && d.chapter.n === n);
  if(at >= 0){ si = at; pi = 0; render(); }
});
function railState(sl){
  const cur = sl.chapter ? sl.chapter.n : 0;
  const nav = $('#railNav');
  let now = null;
  nav.querySelectorAll('.rn').forEach(el => {
    const n = +el.dataset.ch;
    el.classList.toggle('now',  n === cur);
    el.classList.toggle('done', n <  cur);
    if(n === cur) now = el;
  });
  // if the list is scrolling, keep the chapter we are in on screen
  if(railScrolls() && now){
    now.scrollIntoView({block:'nearest', behavior: REDUCED ? 'auto' : 'smooth'});
  }
}
function railScrolls(){
  const nav = $('#railNav');
  const over = nav.scrollHeight > nav.clientHeight + 1;
  nav.classList.toggle('scrolls', over);
  return over;
}
window.addEventListener('resize', railScrolls);

/* ---- navigation: right / left arrow drive the whole deck ---- */
function next(){
  const s = DECK[si];
  if(pi < s.steps.length-1) pi++;
  else if(si < DECK.length-1){ si++; pi = 0; }
  else return;
  render();
}
function prev(){
  if(pi > 0) pi--;
  else if(si > 0){ si--; pi = DECK[si].steps.length-1; }
  else return;
  render();
}
function jump(d){ const n = si+d; if(n<0||n>=DECK.length) return; si=n; pi=0; render(); }

/* ---- presenter zoom: type is a share of screen height, this multiplies it ---- */
const ZMIN=.6, ZMAX=2.0, ZSTEP=.08;
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem('mvcc-zoom')) || 1; } catch(e){}
function applyZoom(show){
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom));
  document.documentElement.style.setProperty('--scale', zoom.toFixed(3));
  try { localStorage.setItem('mvcc-zoom', zoom); } catch(e){}
  if(show){
    const px = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const z = $('#zoom');
    z.innerHTML = Math.round(zoom*100) + '%<small>body text about ' + Math.round(px*.72) + 'px | 0 resets</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 1100);
  }
  fitSlide();
}
applyZoom(false);

/* ---- theme: light matches the lecture deck, dark reads better in a dim hall ---- */
function applyTheme(t, show){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('mvcc-theme', t); } catch(e){}
  if(show){
    const z = $('#zoom');
    z.innerHTML = (t === 'dark' ? 'Dark' : 'Light') + '<small>press T to switch</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 900);
  }
}
let theme = 'light';
try { theme = localStorage.getItem('mvcc-theme') || 'light'; } catch(e){}
applyTheme(theme, false);

document.addEventListener('keydown', e=>{
  if($('#ov').classList.contains('open') && !['o','O','Escape'].includes(e.key)) return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp':            e.preventDefault(); prev(); break;
    case 'ArrowDown':  e.preventDefault(); jump(1);  break;
    case 'ArrowUp':    e.preventDefault(); jump(-1); break;
    case 'Home': si=0; pi=0; render(); break;
    case 'End':  si=DECK.length-1; pi=DECK[si].steps.length-1; render(); break;
    case 'f': case 'F': e.preventDefault(); toggleFull(); break;
    case 's': case 'S': $('#notes').classList.toggle('open'); break;
    case 'o': case 'O': $('#ov').classList.toggle('open'); break;
    case 't': case 'T':
      theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme, true); break;
    case 'r': case 'R': pi = 0; render(); break;
    case 'Escape': $('#ov').classList.remove('open'); $('#notes').classList.remove('open'); break;
    case '+': case '=': e.preventDefault(); zoom += ZSTEP; applyZoom(true); break;
    case '-': case '_': e.preventDefault(); zoom -= ZSTEP; applyZoom(true); break;
    case '0': e.preventDefault(); zoom = 1; applyZoom(true); break;
  }
});
stage.addEventListener('click', () => next());

/* ---- full screen: a visible control, since F is only in the footer legend ---- */
function toggleFull(){
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen().catch(()=>{});
}
$('#btnFull').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
document.addEventListener('fullscreenchange', () => {
  $('#btnFullTxt').textContent = document.fullscreenElement ? 'Exit' : 'Present';
});

/* ---- run of show ---- */
$('#ovGrid').innerHTML = DECK.map((s,i)=>
  `<div class="ovc${s.type==='chapter'?' ovc-ch':''}" data-i="${i}">
     <div class="i">Page ${DECK.slice(0,i).reduce((n,d)=>n+d.steps.length,0)+1} | ${s.chapter ? 'CH '+s.chapter.n : ''} | ${s.tag}</div>
     <div class="t">${s.title}</div></div>`).join('');
$('#ovGrid').querySelectorAll('.ovc').forEach(el =>
  el.onclick = () => { si=+el.dataset.i; pi=0; $('#ov').classList.remove('open'); render(); });

/* ---- elapsed timer ---- */
const t0 = Date.now();
setInterval(()=>{
  const s = Math.floor((Date.now()-t0)/1000);
  $('#clock').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

render();
</script>
</body>
</html>
