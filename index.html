  {note:'Know the boundary. Writers still block writers on the same row: if Kiran also updates account 101, he queues behind Ravi. MVCC removes reader-writer blocking, not writer-writer blocking.'}],
  body:(st)=>`
    <p class="quote">"Readers and writers do not block each other: a SELECT never waits on an UPDATE."</p>
    <div class="stage-row">${sceneMvcc(st)}</div>
    <p class="lede">Every transaction sees a <b>consistent snapshot</b>: the versions that were committed when its snapshot was taken.</p>` },

{ id:'longread', kick:'one frozen instant', eyebrow:'Why it matters', title:'Consistent snapshots for long reads',
  tag:'mvcc', steps:[
  {note:'A month-end report sums every balance. It runs for about five minutes, and its snapshot is taken the moment it starts.'},
  {note:'Meanwhile hundreds of transfers commit. With MVCC the report still sees one consistent moment in time; none of those commits leak into its sum.'},
  {note:'Without MVCC you have two bad options: lock the whole table and freeze the bank, or read an inconsistent sum that never existed at any single moment.'}],
  body:(st)=>`
    <div class="stage-row">${sceneSnapshot(st)}</div>
    ${st>=2?`<div class="cards" style="grid-template-columns:1fr 1fr">
      ${card('With MVCC','One consistent instant','The report sees the bank as it was at the start, even as transfers commit around it.','good','shield','pop d1')}
      ${card('Without MVCC','Freeze or be wrong','Lock the whole table and the bank stops, or read a sum that never existed.','warn','ban','pop d2')}</div>`:''}` },

/* ------------------------------ chapter 3 ------------------------------ */
{ id:'appendonly', kick:'implementing MVCC, 1 of 3', eyebrow:'Row versions', title:'UPDATE appends, never overwrites',
  tag:'mvcc', steps:[
  {note:'Before Ravi\'s UPDATE, the heap page holds one version of row 101: v1, 50,000, at location (0,1).'},
  {note:'The UPDATE does not modify v1 in place. It marks v1 as expired and appends a brand-new version, v2, at (0,2). That is exactly why Asha\'s read did not wait: her answer, v1, was never overwritten.'},
  {note:'Vocabulary: each physical version is a tuple. Expired versions awaiting cleanup are dead tuples. You can prove the append yourself: select ctid before and after the UPDATE and watch it change.'}],
  body:(st)=>`
    <div class="stage-row">${sceneHeap(st)}</div>
    ${st>=2?`<div class="cards ${pp(2,st)}" style="grid-template-columns:1fr 1fr">
      ${card('Vocabulary','Tuple and dead tuple','Each physical version is a <b>tuple</b>. Expired versions waiting for cleanup are <b>dead tuples</b>.','tl','layers')}
      ${card('Prove it','Watch the ctid move','<code>SELECT ctid, * FROM accounts;</code> before and after the UPDATE.','pp','search')}</div>`:''}` },

{ id:'xminxmax', kick:'implementing MVCC, 2 of 3', eyebrow:'Visibility bookkeeping', title:'xmin and xmax',
  tag:'mvcc', steps:[
  {note:'Every transaction gets a monotonically increasing transaction ID, an XID. Every tuple carries two hidden columns. xmin: the XID of the transaction that created this version, the INSERT or the UPDATE that produced it.'},
  {note:'xmax: the XID of the transaction that expired this version, a superseding UPDATE or a DELETE. Zero means the version is still current.'},
  {note:'These columns are hidden, but you can ask for them by name. Here is row 101 after Ravi\'s UPDATE: two versions, and the XIDs tell the story.'}],
  body:(st)=>`
    <div class="stage-row">${sceneHeader(st)}</div>
    ${st>=2?`<div class="${pp(2,st)}" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:center">
      ${sql(`${K('SELECT')} xmin, xmax, acc_no, balance
  ${K('FROM')} accounts;`)}
      ${rowsTable(['xmin','xmax','acc_no','balance'],[['500','802','101','50000'],['802','0','101','40000']], 9, '1fr 1fr 1fr 1fr')}
    </div>`:''}` },

{ id:'rule', kick:'the logic run on every tuple', eyebrow:'The rule', title:'Which version can I see?',
  tag:'mvcc', steps:[
  {note:'A tuple is visible to my snapshot only if two things hold. Rule one: created and visible. Its xmin committed at or before the moment my snapshot was taken.'},
  {note:'Rule two: not yet expired. Its xmax is zero, or the transaction in xmax had not committed when my snapshot was taken.'},
  {note:'Both rules, joined by AND. The executor runs this on every tuple it touches. On the next slide the class applies it themselves.'}],
  body:(st)=>`
    <div class="stage-row">${sceneRule(st)}</div>
    <p class="lede">A tuple is visible to my snapshot only if <b>Rule 1 AND Rule 2</b> both hold.</p>` },

{ id:'trace', kick:'apply the rule before each reveal', eyebrow:'Worked example, account 101', title:'Tracing xmin and xmax',
  tag:'centerpiece', steps:[
  {note:'The centerpiece: walk it row by row. Transaction 500 inserted the row long ago. v1 holds 50,000 with xmin 500 and xmax 0.'},
  {note:'Transaction 802, Ravi, runs the UPDATE and has not committed. v1 gets xmax 802. v2 is born with xmin 802 and xmax 0.'},
  {note:'Transaction 803, Asha, runs a SELECT. Ask the class to apply the rule first. v1: xmax 802 has not committed, so v1 is visible. v2: xmin 802 has not committed, so v2 is invisible. She sees 50,000.'},
  {note:'Now 802 commits, and transaction 804 runs a SELECT. v2 is visible and shows 40,000. v1 is expired for everyone new: it is now a dead tuple.'}],
  body:(st)=>`
    <div class="stage-row" style="flex:0 0 auto">${sceneTuples(TRACE[st], st, true)}</div>
    ${rowsTable(['XID','Type','Event','Reader sees'],[
      ['500','write','Row inserted long ago','-'],
      ['802','write','UPDATE, not committed','-'],
      ['803','read','SELECT while 802 is open','50000'],
      ['804','read','SELECT after 802 commits','40000']], st, '.6fr .6fr 2fr 1fr', st)}` },

{ id:'columns', kick:'so the trace reads unambiguously', eyebrow:'Reading the trace', title:'What each column means',
  tag:'reference', steps:[
  {note:'XID: the ID of the transaction driving the event. Type: write means INSERT, UPDATE or DELETE, which change tuples; read means SELECT, which only observes them. Event: the statement and its commit state.'},
  {note:'Heap tuple: the physical version in the table, v1, v2 and so on. xmin: the XID that created it. xmax: the XID that expired it, or zero if it is still current.'},
  {note:'The link: a write transaction\'s XID is stamped into xmin and/or xmax. A read transaction\'s XID never is; it only determines the snapshot.'}],
  body:(st)=>`
    <div class="cards" style="grid-template-columns:repeat(3,1fr);gap:.55rem">
      ${card('XID','Who is acting','The transaction ID, increasing by one for each new transaction.','',  '', pp(0,st))}
      ${card('Type','Write or read','A write changes tuples; a read only observes them.','tl','', pp(0,st))}
      ${card('Event','What ran','The statement, and whether it has committed.','pp','', pp(0,st))}
      ${st>=1?card('Heap tuple','Which version','The physical row version (v1, v2, ...) and its balance.','','', pp(1,st)):''}
      ${st>=1?card('xmin','Created by','The XID of the INSERT, or of the UPDATE that produced it.','good','', pp(1,st)):''}
      ${st>=1?card('xmax','Expired by','The XID of the UPDATE or DELETE that expired it; 0 if current.','warn','', pp(1,st)):''}
    </div>
    ${st>=2?`<p class="lede ${pp(2,st)}">A write transaction's XID is stamped into <b>xmin and/or xmax</b>. A read transaction's XID never is: <b>it only determines the snapshot</b>.</p>`:''}` },

/* ------------------------------ chapter 4 ------------------------------ */
{ id:'delete', kick:'same mechanism', eyebrow:'DELETE', title:'Mark, don\'t remove',
  tag:'mvcc', steps:[
  {note:'Ravi closes account 102: DELETE FROM accounts WHERE acc_no = 102. Watch the tuple.'},
  {note:'It is not erased. Its xmax is set to Ravi\'s XID, 910. That is all a DELETE does.'},
  {note:'So a report that started before Ravi committed still counts account 102. The version is still in the heap, and by the visibility rule it is still visible to that older snapshot.'}],
  body:(st)=>`
    ${sql(`${K('DELETE FROM')} accounts ${K('WHERE')} acc_no = ${S('102')};   ${C('-- Ravi closes an account')}`)}
    <div class="stage-row">${sceneDelete(st)}</div>` },

{ id:'rollback', kick:'a free lunch', eyebrow:'ROLLBACK', title:'Rollback is nearly free',
  tag:'mvcc', steps:[
  {note:'Transaction 900 updates account 101: v1 gets xmax 900, and a new v2 appears with xmin 900.'},
  {note:'Then 900 issues ROLLBACK. It is simply marked aborted. v1\'s xmax is 900, but 900 aborted, so the expiry never took effect: everyone still sees v1. v2\'s xmin is 900, which aborted, so v2 is invisible to every transaction, forever.'},
  {note:'There is nothing to undo. The new version was simply never marked committed. Hold on to this, because it is the big contrast with Oracle later in this chapter.'}],
  body:(st)=>`<div class="stage-row">${sceneRollback(st)}</div>` },

{ id:'rbtrace', kick:'the rollback, applied', eyebrow:'Account 101 again', title:'Ravi closes the account, then aborts',
  tag:'mvcc', steps:[
  {note:'Start from the committed state after transaction 802: v2, 40,000, xmin 802, xmax 0. Live.'},
  {note:'Ravi closes the account: transaction 905 runs DELETE. That sets v2\'s xmax to 905. The row is not removed, just marked, and 905 has not committed.'},
  {note:'Ravi rolls back. Because 905 aborted, its expiry is ignored by everyone: v2 is live again and account 101 stays open. On disk xmax still holds 905, but an aborted XID means not expired; VACUUM tidies it later. Nothing was undone physically: the DELETE simply never counted.'}],
  body:(st)=>`
    <div class="stage-row" style="flex:0 0 auto">${sceneTuples(RB[st], st, true)}</div>
    ${rowsTable(['XID','Type','Event','v2 is'],[
      ['802','state','Committed state after 802','live'],
      ['905','write','DELETE, not committed','expiring'],
      ['905','abort','ROLLBACK: 905 never commits','live again']], st, '.6fr .6fr 2fr 1fr', st)}` },

{ id:'vacuum', kick:'implementing MVCC, 3 of 3', eyebrow:'The garbage collector', title:'Dead tuples & VACUUM',
  tag:'maintenance', steps:[
  {note:'Dead tuples still occupy space in the heap. Here the red slots are dead: expired versions from committed UPDATEs and DELETEs.'},
  {note:'VACUUM may reclaim a tuple only if it is dead AND no longer visible to ANY running transaction. That second condition matters: a long-running report can keep old versions alive, like these three.'},
  {note:'Plain VACUUM marks the rest as free and reusable. Note what it does not do: the file stays the same size. It recycles space; it does not shrink the table.'},
  {note:'VACUUM FULL rewrites the table compactly and does shrink it, but it takes an exclusive lock while it runs. Autovacuum is the background daemon that runs plain VACUUM automatically once dead tuples cross a threshold.'}],
  body:(st)=>`
    <div class="stage-row">${sceneVacuum(st)}</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:.9rem;align-items:center">
      ${sql(`${K('SELECT')} n_dead_tup
  ${K('FROM')} pg_stat_user_tables;`)}
      <p class="lede">${st<2?'VACUUM reclaims tuples that are <b>dead and invisible to every running transaction</b>.':st<3?'<b>Plain VACUUM recycles</b>: the space is reusable, but the file does not shrink.':'<b>VACUUM FULL rewrites</b> the table and shrinks it, under an exclusive lock.'}</p>
    </div>` },

{ id:'advantages', kick:'evaluating the design', eyebrow:'What append-only MVCC buys', title:'Four advantages',
  tag:'evaluation', steps:[
  {note:'One: readers never block writers, and writers never block readers. The promise, delivered.'},
  {note:'Two: instant, cheap ROLLBACK. There is nothing to undo.'},
  {note:'Three: no separate undo storage to size or manage. Old versions live in the table itself.'},
  {note:'Four: consistent snapshots for long reports, with no table locks.'}],
  body:(st)=>`
    <div class="cards" style="grid-template-columns:1fr 1fr;gap:.7rem">
      ${card('01','No blocking','Readers never block writers, and writers never block readers.','good','shield',pp(0,st))}
      ${st>=1?card('02','Instant ROLLBACK','Nothing to undo: the new version is simply never committed.','good','bolt',pp(1,st)):''}
      ${st>=2?card('03','No undo storage','Nothing extra to size or manage: old versions live in the table.','good','db',pp(2,st)):''}
      ${st>=3?card('04','Long reports, no locks','Consistent snapshots without locking the table.','good','clock',pp(3,st)):''}
    </div>` },

{ id:'bloat', kick:'every choice is a trade-off', eyebrow:'The cost', title:'Table bloat',
  tag:'trade-off', steps:[
  {note:'accounts has one million rows. That is one million live tuples in the heap.'},
  {note:'A daily interest-credit job UPDATEs every one of them. Every UPDATE appends a tuple, so the heap now holds about two million tuples, half of them dead. The table is roughly twice its logical size.'},
  {note:'And everything slows down: sequential scans read twice the pages, and the cache holds only half as much useful data. This is why autovacuum is not optional.'}],
  body:(st)=>`
    <div class="stage-row">${sceneBloat(st)}</div>
    ${st>=2?`<div class="cards" style="grid-template-columns:repeat(3,1fr)">
      ${card('Disk','About 2x the size','The heap holds a dead copy of every row.','warn','db','pop d1')}
      ${card('Scans','2x the pages','A sequential scan reads the dead tuples too.','warn','search','pop d2')}
      ${card('Cache','Half the useful data','Dead tuples take up memory that live data needed.','warn','layers','pop d3')}</div>`:''}` },

{ id:'autovac', kick:'not optional maintenance', eyebrow:'Maintenance', title:'Autovacuum & VACUUM ANALYZE',
  tag:'maintenance', steps:[
  {note:'Autovacuum must run continuously. Dead tuples climb until they cross a threshold, then autovacuum reclaims them.'},
  {note:'High-update tables like accounts may need it to run more often: lower autovacuum_vacuum_scale_factor and the threshold drops, so each cleanup is smaller and bloat never builds up.'},
  {note:'And one command does two jobs. VACUUM reclaims dead tuples. ANALYZE refreshes the table\'s statistics. Plant the seed: statistics become the hero of the second half.'}],
  body:(st)=>`
    <div class="stage-row">${sceneSaw(st)}</div>
    ${st>=2?`<div class="${pp(2,st)}" style="display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:.7rem;align-items:center">
      ${sql(`${K('VACUUM ANALYZE')} accounts;`)}
      ${card('VACUUM','Reclaims dead tuples','Frees their space for reuse.','good','trash')}
      ${card('ANALYZE','Refreshes statistics','Hold that thought: the planner depends on it.','pp','gauge')}</div>`:''}` },

{ id:'oracle', kick:'same concept, two designs', eyebrow:'Contrast', title:'How Oracle implements MVCC',
  tag:'contrast', steps:[
  {note:'A second design sharpens the evaluation. PostgreSQL keeps old versions in the table itself. Oracle overwrites the row in place and copies the old data into undo segments. Where old versions live: heap versus undo.'},
  {note:'UPDATE: PostgreSQL appends a new tuple; Oracle overwrites in place and moves the old copy to undo.'},
  {note:'ROLLBACK: nearly free in PostgreSQL, because the new version is simply ignored. Oracle must apply undo records, which is costly.'},
  {note:'Cleanup: PostgreSQL carries the VACUUM burden and bloat in the table. Oracle recycles undo space automatically.'},
  {note:'Classic failures: table bloat and XID wraparound for PostgreSQL; ORA-01555 snapshot too old for Oracle, when undo is recycled while a long query still needs it. One design pays at read and cleanup time, the other at write time.'}],
  body:(st)=>`
    <div class="stage-row" style="flex:0 0 auto;height:34%">${sceneOracle(st)}</div>
    ${rowsTable(['','PostgreSQL','Oracle'],[
      ['Old versions live','in the table itself (heap)','in undo segments'],
      ['UPDATE','appends a new tuple','overwrites in place, old copy to undo'],
      ['ROLLBACK','nearly free (new version ignored)','must apply undo records (costly)'],
      ['Cleanup burden','VACUUM and bloat in the table','undo space recycled automatically'],
      ['Classic failure','table bloat, XID wraparound','ORA-01555 snapshot too old']], st, '1fr 1.3fr 1.3fr', st)}
    ${st>=4?`<p class="lede pop">Same concept, two designs: <b>one pays at read and cleanup time, the other at write time</b>.</p>`:''}` },

/* ------------------------------ chapter 5 ------------------------------ */
{ id:'pipeline', kick:'you cannot tune what you cannot see', eyebrow:'Part 2 overview', title:'The four-stage pipeline',
  tag:'part 2', steps:[
  {note:'Every query passes through four stages, and every EXPLAIN plan and index decision maps to one of them. Here is the whole pipeline at a glance.'},
  {note:'Stage one, the Parser: is this valid SQL grammar? It produces a parse tree.'},
  {note:'Stage two, the Analyzer and Rewriter: do these objects exist, are you allowed to use them, and should the query be rewritten? It produces a query tree.'},
  {note:'Stage three, the Planner: of all the ways to get this answer, which is cheapest? It produces a plan tree.'},
  {note:'Stage four, the Executor: run the chosen plan, row by row, and send rows to the client.'}],
  body:(st)=>`<div class="stage-row">${scenePipe(st, false)}</div>
    <p class="lede">${['From the raw SQL string to rows on the client: <b>four stages</b>, and each one can go wrong in its own way.',
      '<b>Parser</b>: grammar only. Is this valid SQL?',
      '<b>Analyzer / Rewriter</b>: meaning. Do these objects exist, may you use them, and should the query be rewritten?',
      '<b>Planner</b>: cost. Of all the ways to get this answer, which is cheapest?',
      '<b>Executor</b>: run the chosen plan, row by row.'][st]}</p>` },

{ id:'running', kick:'follow this one all the way', eyebrow:'The running query', title:'Pune high-net-worth accounts',
  tag:'setup', steps:[
  {note:'One query for the rest of the lecture. We will follow this string through all four stages until rows reach the client.'},
  {note:'Note the two-part WHERE clause: branch equals Pune, AND balance above 100,000. It matters at the parser, where AND becomes a node, and again at the planner, where each half gets its own selectivity estimate.'}],
  body:(st)=>`
    ${sql(`${K('SELECT')} holder_name, balance
  ${K('FROM')}   accounts
 ${K('WHERE')}  <span class="${st>=1?'hl':''}">branch = ${S("'Pune'")}</span>
   ${K('AND')}  <span class="${st>=1?'hl':''}">balance &gt; ${S('100000')}</span>;`, 'big')}
    <p class="lede">${st>=1?'Two conditions joined by <b>AND</b>. They come back at the parser, and again at the planner.':'We will trace <b>this string</b> all the way to rows on the client.'}</p>` },

{ id:'parser', kick:'grammar, not meaning', eyebrow:'Stage 1 of 4', title:'The Parser',
  tag:'stage 1', steps:[
  {note:'The engine receives a flat string. First, lexing: break it into tokens. Keywords, identifiers, literals and operators.'},
  {note:'Then parsing: arrange the tokens according to the SQL grammar into a hierarchical parse tree. The crucial limitation: the parser knows grammar, not meaning.'},
  {note:'So SELECT unicorn FROM narnia parses perfectly well; the parser has no idea whether tables exist. But SELECT * FORM accounts dies right here with a syntax error, because FORM breaks the grammar.'}],
  body:(st)=>`
    ${tokenChips(st)}
    ${st>=1?`<p class="lede ${pp(1,st)}"><b>Parsing</b> arranges the tokens, according to the SQL grammar, into a parse tree. The parser knows <b>grammar, not meaning</b>.</p>`:''}
    ${st>=2?`<div class="cards" style="grid-template-columns:1fr 1fr">
      ${card('Parses fine','<code>SELECT unicorn FROM narnia;</code>','Whether a column or table exists is not a question of grammar.','good','','pop d1')}
      ${card('Dies here','<code>SELECT * FORM accounts;</code>','<code>FORM</code> breaks the grammar: syntax error.','warn','','pop d2')}</div>`:''}` },

{ id:'parsetree', kick:'what every later stage operates on', eyebrow:'Stage 1 output', title:'Parse tree of the running query',
  tag:'stage 1', steps:[
  {note:'The root: a SELECT statement.'},
  {note:'The target list: the columns in the SELECT clause, holder_name and balance.'},
  {note:'The from clause: the table reference, accounts. Still just a name at this point.'},
  {note:'The where clause: a Boolean expression tree. AND becomes a node with two children. Operators are internal nodes; operands are leaves. Every later stage operates on this structure.'}],
  body:(st)=>`<div class="stage-row">${sceneTree(st)}</div>
    ${st>=3?`<p class="lede pop">Operators become <b>internal nodes</b>; operands become <b>leaves</b>. AND is a node with two children.</p>`:''}` },

{ id:'analyzer', kick:'meaning, checked against the catalog', eyebrow:'Stage 2 of 4', title:'Analyzer / Rewriter: four jobs',
  tag:'stage 2', steps:[
  {note:'Job one, catalog lookup: does accounts exist? It is looked up in pg_class and the name is replaced with an OID. "relation acounts does not exist" is caught here, not by the parser.'},
  {note:'Job two, attribute check: do the columns exist, and do the types make sense? Checked against pg_attribute. branch greater than 100000 on a TEXT column is a type error, raised here.'},
  {note:'Job three, permission check: does the role have SELECT on the table? A role called intern with view-only rights gets "permission denied" here.'},
  {note:'Job four, view substitution: the Rewriter proper splices a view\'s definition into the query tree. That is the next slide.'},
  {note:'So the error order is: syntax errors from the parser first, then existence, then privileges, both raised in the analyzer.'}],
  body:(st)=>{
    const jobs = [
      ['Job 1','Catalog lookup','Look up <code>accounts</code> in <code>pg_class</code> and replace names with OIDs. "relation acounts does not exist" is raised here, not by the parser.','tl','db'],
      ['Job 2','Attribute check','Do the columns exist, and do the types fit? Checked against <code>pg_attribute</code>. <code>branch &gt; 100000</code> on TEXT is a type error.','pp','grid'],
      ['Job 3','Permission check','Does the role have SELECT? The <code>intern</code> role, with view-only rights, gets "permission denied".','warn','lock'],
      ['Job 4','View substitution','The Rewriter proper: a view\'s definition is spliced into your query tree.','good','layers']];
    const j = jobs[Math.min(st,3)];
    return `<div class="stage-row">${sceneCatalog(Math.min(st,4))}</div>
      <div class="cards">${st<4 ? card(j[0], j[1], j[2], j[3], j[4], 'pop') :
        card('Error order','Syntax, then existence, then privileges','Syntax errors come from the parser. Existence and privilege errors both come from the analyzer.','pp','route','pop')}</div>`; } },

{ id:'rewriter', kick:'stored queries, not data', eyebrow:'The Rewriter', title:'Views are spliced in',
  tag:'stage 2', steps:[
  {note:'Someone queries a view: SELECT holder_name FROM pune_hnw. To the query tree, pune_hnw is just a name.'},
  {note:'At rewrite time the view\'s stored definition is fetched: SELECT star FROM accounts WHERE branch is Pune AND balance is above 100,000.'},
  {note:'And it is spliced into the tree, which becomes exactly our running query against the base table. The punchline: views are stored query fragments, not stored data. After rewriting, the planner never knows a view was involved.'}],
  body:(st)=>`
    <div style="display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1rem;align-items:center">
      ${sql(`${K('CREATE VIEW')} pune_hnw ${K('AS')}
  ${K('SELECT')} * ${K('FROM')} accounts
   ${K('WHERE')} branch = ${S("'Pune'")}
     ${K('AND')} balance &gt; ${S('100000')};

${K('SELECT')} holder_name ${K('FROM')} pune_hnw;`)}
      <div class="stage-row">${sceneView(st)}</div>
    </div>
    ${st>=2?`<p class="lede pop">After rewriting, the planner sees <b>only base tables</b>. It never knows a view was involved.</p>`:''}` },

/* ------------------------------ chapter 6 ------------------------------ */
{ id:'costphil', kick:'no fixed rules', eyebrow:'Stage 3 of 4', title:'Cost-based optimization',
  tag:'stage 3', steps:[
  {note:'The planner estimates a cost for each candidate plan and picks the cheapest. It follows no fixed rule such as "always use an index". It decides on the actual shape of the data.'},
  {note:'A question for the room: if 99% of accounts were in Pune, would an index on branch help this query?'},
  {note:'No. Nearly the whole table qualifies, and hopping from the index to the heap for every row is slower than just reading the table. The planner can know this only if it knows how the data is distributed. Enter statistics.'}],
  body:(st)=>`
    <p class="lede">The planner <b>estimates a cost</b> for each candidate and picks the cheapest. No fixed rules like "always use an index": it decides on the <b>actual shape of the data</b>.</p>
    <div class="cards" style="grid-template-columns:1fr 1fr">
      ${st>=1?card('Question','99% of accounts are in Pune.','Is an index on <code>branch</code> helpful for this query?','pp','search',pp(1,st)):''}
      ${st>=2?card('Answer','No, read the table','Nearly every row qualifies. Hopping index to heap per row is slower than one sequential read. To know this, the planner needs <b>statistics</b>.','good','gauge',pp(2,st)):''}
    </div>` },

{ id:'stats', kick:'the ANALYZE inside VACUUM ANALYZE', eyebrow:'What ANALYZE collects', title:'Statistics',
  tag:'stage 3', steps:[
  {note:'ANALYZE samples about 30,000 rows and stores per-table and per-column statistics. reltuples and relpages: one million rows across 12,000 pages. These size every cost formula.'},
  {note:'null_frac: 2% of branch values are NULL, which shrinks the expected number of matches.'},
  {note:'n_distinct: branch has 40 distinct values, so by default equality has a selectivity of about one in forty.'},
  {note:'most_common_vals: but Pune is 30% of all rows. For popular values the planner uses the exact frequency instead.'},
  {note:'histogram_bounds for balance: from these buckets the planner estimates that balance above 100,000 is about 5% of rows.'},
  {note:'correlation: acc_no is about 1.0, meaning physical order matches key order, which makes index scans cheaper.'},
  {note:'Checkpoint: one million times 0.30 times 0.05 is about 15,000 rows. This is the ANALYZE inside VACUUM ANALYZE from the first half; now you know who consumes it.'}],
  body:(st)=> st < 6 ? rowsTable(['Statistic','NeoBank value','The planner uses it to'],[
      ['<code>reltuples, relpages</code>','1,000,000 rows / 12,000 pages','size every cost formula'],
      ['<code>null_frac</code>','2% of branch is NULL','shrink expected matches'],
      ['<code>n_distinct</code>','branch has 40 distinct values','estimate = (about 1/40)'],
      ['<code>most_common_vals</code>',"'Pune' = 30% of rows",'use exact frequency for popular values'],
      ['<code>histogram_bounds</code>','balance: 0, 12k, 45k, ..., 98 lakh','estimate ranges (&gt; 100000 is about 5%)'],
      ['<code>correlation</code>','acc_no is about 1.0','make index scans cheaper']], st, '1.1fr 1.2fr 1.3fr', st)
    : `<div class="stage-row">${sceneFunnel(st)}</div>
       <p class="lede pop">Estimate for our query: <b>1M x 0.30 x 0.05 = about 15,000 rows</b>. This is who consumes the ANALYZE inside VACUUM ANALYZE.</p>` },

{ id:'scans', kick:'the building blocks', eyebrow:'Candidate plans', title:'Scan methods, and when each wins',
  tag:'stage 3', steps:[
  {note:'Sequential scan: read every page from start to finish. It wins when a large fraction of rows qualifies, like our 30% in Pune, or when the table is small.'},
  {note:'Index scan: walk the B-tree, then hop to the heap for each match. It wins for high selectivity, such as acc_no equals 101.'},
  {note:'Index-only scan: answer from the index alone, with no heap visits, if the index holds every needed column and the visibility map says the pages are all-visible. That is a one-line callback to MVCC.'},
  {note:'Bitmap scan, the middle ground: collect matching locations into a bitmap, sort them by page, and visit pages in order. It wins for medium selectivity, like our 15,000 rows, and for combining two indexes.'}],
  body:(st)=>{
    const c = [
      ['Sequential Scan','Read every page','Wins when a large fraction qualifies (our 30% in Pune) or the table is small.','tl','search'],
      ['Index Scan','B-tree, then heap hops','Wins for high selectivity (<code>acc_no = 101</code>).','pp','route'],
      ['Index-Only Scan','No heap visits','If the index has every needed column and the visibility map allows it: an MVCC callback.','good','layers'],
      ['Bitmap Heap Scan','Sorted page visits','Wins for medium selectivity (about 15,000 rows) and for combining two indexes.','pp','grid']][st];
    return `<div class="stage-row">${sceneScanKind(st)}</div>
      <div class="cards">${card('Scan '+(st+1)+' of 4', c[0], '<b>'+c[1]+'.</b> '+c[2], c[3], c[4], 'pop')}</div>`; } },

{ id:'joins', kick:'join each Pune account with its transactions', eyebrow:'Candidate plans', title:'Join methods, and when each wins',
  tag:'stage 3', steps:[
  {note:'Introduce a second table: transactions, with txn_id, acc_no, amount and txn_date. We join each Pune account with its transactions. Nested loop: for each outer row, probe the inner side. It wins when the outer side is tiny and the inner side is indexed: ten accounts, ten indexed probes.'},
  {note:'Hash join: build a hash table on the smaller input, then scan the bigger input and probe it. It wins for large, unsorted equality joins, and it needs memory.'},
  {note:'Merge join: sort both sides, or use an order they already have, then zip them together. It wins when the inputs are already sorted, or when both are huge.'},
  {note:'The planner also permutes join order. A joined with B, then C, can cost enormously more or less than A joined with the result of B and C.'}],
  body:(st)=>{
    const k = Math.min(st,2);
    const c = [
      ['Nested Loop','For each outer row, probe the inner side.','Wins: a tiny outer side and an indexed inner side (10 accounts x indexed probe).','tl','route'],
      ['Hash Join','Build a hash on the smaller input, scan the bigger, probing.','Wins: large, unsorted equality joins. Needs memory.','pp','grid'],
      ['Merge Join','Sort both sides (or use their order), then zip together.','Wins: inputs already sorted, or both huge.','good','split']][k];
    return `${sql(`transactions(txn_id, acc_no, amount, txn_date)`)}
      <div class="stage-row">${sceneJoin(k)}</div>
      <div class="cards">${card('Join '+(k+1)+' of 3', c[0], c[1]+' '+c[2], c[3], c[4], pp(k,st))}</div>
      ${st>=3?`<p class="lede pop">The planner also permutes <b>join order</b>: (A JOIN B) JOIN C versus A JOIN (B JOIN C) can differ enormously.</p>`:''}`; } },

{ id:'decision', kick:'lowest total cost wins', eyebrow:'The decision', title:'Choosing the winner',
  tag:'stage 3', steps:[
  {note:'Each candidate gets a cost in abstract units that blend I/O and CPU: pages times page cost, plus rows times CPU tuple cost, plus operator costs. It is reported as startup cost, two dots, total cost. The lowest total wins.'},
  {note:'Sequential scan: 12,000 pages at 1.0 plus a million rows at 0.01. About 22,000.'},
  {note:'Index scan on branch: about 15,000 random heap hops at 4.0 each. 60,000 or more. The "obvious" index is the most expensive option.'},
  {note:'Bitmap scan: medium selectivity, pages visited in order. About 9,000. The winner.'},
  {note:'Point at the EXPLAIN output: the cost and the 15,000-row estimate are exactly what we computed by hand. The obvious index lost because the planner knew Pune is 30% of the bank.'}],
  body:(st)=>`
    <p class="lede"><b>cost = pages x page_cost + rows x cpu_tuple_cost + operator costs</b>, reported as <code>startup..total</code>.</p>
    <div class="stage-row">${sceneCost(st)}</div>
    ${st>=4?`<div class="pop" style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:.8rem;align-items:center">
      ${sql(`Bitmap Heap Scan on accounts
  (cost=180.2..9014.5 rows=15000 width=36)
  Recheck Cond: (branch = 'Pune')
  -&gt;  Bitmap Index Scan ...`)}
      <p class="lede">The "obvious" index lost, because the planner <b>knew Pune is 30% of the bank</b>.</p></div>`:''}` },

/* ------------------------------ chapter 7 ------------------------------ */
{ id:'volcano', kick:'the iterator model', eyebrow:'Stage 4 of 4', title:'The Executor',
  tag:'stage 4', steps:[
  {note:'The plan is just a tree. Every node in it implements the same tiny interface: open, next and close.'},
  {note:'It is pull-based. The client asks the root for a row, calls cascade down the tree, and rows bubble up one at a time, pipelined.'},
  {note:'Consequence one, streaming: the first rows reach the client before the scan finishes. With LIMIT 10, only about ten rows are ever pulled.'},
  {note:'Consequence two, low memory: most nodes hold one row at a time, so there are no full intermediate result sets.'},
  {note:'Consequence three, pipeline-breakers: Sort and hash-build must consume their whole input before emitting anything. That is why ORDER BY delays the first row.'}],
  body:(st)=>`
    <div class="stage-row">${sceneVolcano(st)}</div>
    <div class="cards" style="grid-template-columns:repeat(3,1fr)">
      ${st>=2?card('Streaming','First rows arrive early','With <code>LIMIT 10</code>, only about 10 rows are ever pulled.','good','bolt',pp(2,st)):''}
      ${st>=3?card('Low memory','One row at a time','Most nodes never hold a full intermediate result.','tl','layers',pp(3,st)):''}
      ${st>=4?card('Pipeline-breakers','Sort and hash-build','They consume the whole input first: why ORDER BY delays the first row.','warn','clock',pp(4,st)):''}
    </div>` },

{ id:'exectrace', kick:'... ORDER BY balance DESC LIMIT 3', eyebrow:'Full circle', title:'Where MVCC lives',
  tag:'stage 4', steps:[
  {note:'Our query with ORDER BY balance DESC LIMIT 3 gives this plan: Limit on top of Sort on top of a sequential scan.'},
  {note:'The client asks Limit for a row. Limit asks Sort.'},
  {note:'Sort is a pipeline-breaker, so it calls the scan\'s next repeatedly. The scan reads each heap tuple and applies the filter AND, tying the whole lecture together, the MVCC visibility check via xmin and xmax on every tuple. Kiran\'s deleted row and Arjun\'s uncommitted row are invisible.'},
  {note:'Sort sorts the four survivors and answers next three times: Nisha, Meera, Rohan. Limit then reports done, and close cascades down the tree.'},
  {note:'Every next on a scan node runs the xmin/xmax rule from Part 1. The executor is where MVCC physically happens: the two halves of the lecture meet here.'}],
  body:(st)=>`
    <div class="stage-row">${sceneExec(Math.min(st,3))}</div>
    ${st>=4?`<p class="lede pop">Every <code>next()</code> on a scan node runs the <b>xmin/xmax rule from Part 1</b>. The two halves meet here.</p>`:''}` },

{ id:'wrap', kick:'sixty-second replay', eyebrow:'Wrap-up', title:'One query\'s full journey',
  tag:'recap', steps:[
  {note:'Replay the running query. One: the raw string becomes a parse tree, grammar only.'},
  {note:'Two: catalog, permission and view resolution produce a validated query tree.'},
  {note:'Three: a statistics-driven cost comparison chooses the cheapest plan tree.'},
  {note:'Four: the executor pulls rows Volcano-style, with MVCC visibility checks at the leaves.'}],
  body:(st)=>`
    <div class="stage-row" style="flex:0 0 auto;height:40%">${scenePipe(st+1, true)}</div>
    <div class="cards" style="grid-template-columns:1fr 1fr;gap:.55rem">
      ${card('1','Raw string to parse tree','Grammar only.','tl','',pp(0,st))}
      ${st>=1?card('2','Validated query tree','Catalog, permissions and views resolved.','pp','',pp(1,st)):''}
      ${st>=2?card('3','Cheapest plan tree','Chosen by statistics-driven cost comparison.','pp','',pp(2,st)):''}
      ${st>=3?card('4','Rows to the client','Pulled Volcano-style, with MVCC visibility at the leaves.','good','',pp(3,st)):''}
    </div>` },

{ id:'exit', kick:'before you leave', eyebrow:'Exit ticket', title:'Two questions',
  tag:'check', steps:[
  {note:'Question one, as an oral poll: which stage substitutes a view?'},
  {note:'The Analyzer / Rewriter.'},
  {note:'Question two: which single command both cleans up dead tuples and refreshes planner statistics?'},
  {note:'VACUUM ANALYZE.'},
  {note:'For students who want more: inspect xmin, xmax and ctid themselves, predict a plan by hand, then check it with EXPLAIN. Next lecture: now that we can read a plan, we learn to change the planner\'s mind, with indexing and EXPLAIN ANALYZE.'}],
  body:(st)=>`
    <div class="cards" style="grid-template-columns:1fr 1fr;gap:.8rem">
      ${card('Q1', 'Which stage substitutes a view?', st>=1?'<b class="ans">The Analyzer / Rewriter</b>':'Think, then answer.', 'pp','layers', pp(0,st))}
      ${st>=2?card('Q2', 'One command that cleans dead tuples and refreshes statistics?', st>=3?'<b class="ans">VACUUM ANALYZE</b>':'Think, then answer.', 'pp','trash', pp(2,st)):''}
    </div>
    ${st>=4?`<p class="lede pop"><b>Go further:</b> inspect <code>xmin</code>, <code>xmax</code> and <code>ctid</code>, predict a plan by hand, then check it with <code>EXPLAIN</code>. <b>Next lecture:</b> indexing and <code>EXPLAIN ANALYZE</code>.</p>`:''}` },

{ id:'questions', kick:'MVCC, xmin/xmax, VACUUM and the four-stage pipeline', eyebrow:'Thank you', title:'Any questions?',
  tag:'close', steps:[
  {note:'Open the floor for questions.'},
  {note:'Please fill in the feedback form for this lecture. It shapes the next one, on indexing and EXPLAIN ANALYZE.'}],
  body:(st)=>`
    <div class="stage-row"><div class="bigq">?</div></div>
    ${st>=1?`<div class="cards pop" style="grid-template-columns:1fr">
      ${card('Two minutes, please','Fill in the feedback form','Your feedback shapes the next lecture, on indexing and EXPLAIN ANALYZE.','pp','users')}</div>`:''}` }
];

</script>
<script>
/* ---- assemble the running order: a chapter opener, then that chapter's slides ---- */
const BY_ID = Object.fromEntries(DECK.map(d => [d.id, d]));
const RUN = [];
CHAPTERS.forEach(ch => {
  if(OPENERS[ch.n]) RUN.push({
    id:'ch'+ch.n, chapter:ch, type:'chapter',
    eyebrow:'Chapter '+ch.n, title:ch.t, kick:OPENERS[ch.n].when, tag:'story',
    steps:[
      {note:'Chapter card. Pause here - this is where the story turns. Read the situation, then let them feel the problem before you name the technique.'},
      {note:OPENERS[ch.n].problem},
      {note:OPENERS[ch.n].detail},
      {note:OPENERS[ch.n].next}
    ],
    body:(st)=>chapterBody(ch, st)
  });
  ch.of.forEach(id => { const d = BY_ID[id]; if(d){ d.chapter = ch; RUN.push(d); } });
});
DECK.length = 0;
RUN.forEach(d => DECK.push(d));

/* ===================== presenter engine ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage');
let si = 0, pi = 0, lastSlide = null;

function render(){
  const sl = DECK[si];
  pi = Math.max(0, Math.min(pi, sl.steps.length - 1));
  const entering = lastSlide !== sl.id;
  lastSlide = sl.id;
  stage.innerHTML = `<div class="slide"${entering?' data-entering="1"':''}>`
                  + `<div class="fit">${sl.body(pi)}</div></div>`;
  $('#sTitle').textContent   = sl.title;
  $('#sEyebrow').textContent = sl.eyebrow;
  $('#sKick').textContent    = sl.kick || '';
  railState(sl);
  $('#stepCount').textContent = `${si+1}/${DECK.length} | step ${pi+1}/${sl.steps.length}`;
  $('#noteSay').innerHTML = sl.steps[pi].note || '-';
  $('#noteNxt').textContent = pi+1 < sl.steps.length
    ? `next: step ${pi+2} of this slide`
    : (si+1 < DECK.length ? `next: ${DECK[si+1].title}` : 'end of deck');
  const done = DECK.slice(0, si).reduce((n,d)=>n+d.steps.length, 0) + pi + 1;
  const all  = DECK.reduce((n,d)=>n+d.steps.length, 0);
  $('#progFill').style.width = (done/all*100).toFixed(2) + '%';
  fitSlide();
}

/* Scale the current step down if it would not fit, so a slide is never
   scrollable and never clipped. Entrance animations start elements translated,
   so the first measurement can read short - re-measure once the frame has laid
   out and again once the longest entrance has finished. */
let fitTimer = null;
function fitSlide(){
  const slide = stage.querySelector('.slide'), fit = stage.querySelector('.fit');
  if(!slide || !fit) return;
  const measure = () => {
    if(!fit.isConnected) return;
    fit.style.transform = '';
    /* A centred box splits its overflow above AND below, and scrollHeight only
       counts what hangs below - so a centred measurement under-reports the true
       need by about half. This applies at every nesting level, not just the
       outer column, so flatten them all for the measurement. */
    fit.classList.add('measuring');
    const avail = fit.clientHeight;
    let need = fit.scrollHeight;
    fit.querySelectorAll('*').forEach(el => {        // catch anything still spilling
      const h = el.scrollHeight;
      if(h > need && el.parentElement === fit) need = h;
    });
    fit.classList.remove('measuring');
    if(need > avail + 1){
      /* Centred content that overflows puts half of itself ABOVE the box, which
         a top-origin scale cannot pull back. Anchor to the top before scaling. */
      fit.classList.add('topfit');
      /* the sketch rotations make visual boxes a few px taller than their
         layout boxes, which scrollHeight cannot see - leave room for it */
      const k = Math.max(0.42, (avail - 12) / need);
      fit.style.transform = `scale(${k.toFixed(4)})`;
    } else {
      fit.classList.remove('topfit');
    }
  };
  measure();
  requestAnimationFrame(measure);
  clearTimeout(fitTimer);
  fitTimer = setTimeout(measure, 520);                  // after the last .pop lands
}
window.addEventListener('resize', fitSlide);
if(window.ResizeObserver) new ResizeObserver(fitSlide).observe(document.querySelector('#app'));
/* the rail is the table of contents: click a chapter to jump to its first slide */
$('#railNav').innerHTML = CHAPTERS.map(ch =>
  `<div class="rn" data-ch="${ch.n}">
     <span class="rn-n">${String(ch.n).padStart(2,'0')}</span>
     <span class="rn-t">${ch.t}</span></div>`).join('');
$('#railNav').querySelectorAll('.rn').forEach(el => el.onclick = () => {
  const n = +el.dataset.ch;
  const at = DECK.findIndex(d => d.chapter && d.chapter.n === n);
  if(at >= 0){ si = at; pi = 0; render(); }
});
function railState(sl){
  const cur = sl.chapter ? sl.chapter.n : 0;
  const nav = $('#railNav');
  let now = null;
  nav.querySelectorAll('.rn').forEach(el => {
    const n = +el.dataset.ch;
    el.classList.toggle('now',  n === cur);
    el.classList.toggle('done', n <  cur);
    if(n === cur) now = el;
  });
  // if the list is scrolling, keep the chapter we are in on screen
  if(railScrolls() && now){
    now.scrollIntoView({block:'nearest', behavior: REDUCED ? 'auto' : 'smooth'});
  }
}
function railScrolls(){
  const nav = $('#railNav');
  const over = nav.scrollHeight > nav.clientHeight + 1;
  nav.classList.toggle('scrolls', over);
  return over;
}
window.addEventListener('resize', railScrolls);

/* ---- navigation: right / left arrow drive the whole deck ---- */
function next(){
  const s = DECK[si];
  if(pi < s.steps.length-1) pi++;
  else if(si < DECK.length-1){ si++; pi = 0; }
  else return;
  render();
}
function prev(){
  if(pi > 0) pi--;
  else if(si > 0){ si--; pi = DECK[si].steps.length-1; }
  else return;
  render();
}
function jump(d){ const n = si+d; if(n<0||n>=DECK.length) return; si=n; pi=0; render(); }

/* ---- presenter zoom: type is a share of screen height, this multiplies it ---- */
const ZMIN=.6, ZMAX=2.0, ZSTEP=.08;
let zoom = 1;
try { zoom = parseFloat(localStorage.getItem('mvcc-zoom')) || 1; } catch(e){}
function applyZoom(show){
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom));
  document.documentElement.style.setProperty('--scale', zoom.toFixed(3));
  try { localStorage.setItem('mvcc-zoom', zoom); } catch(e){}
  if(show){
    const px = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const z = $('#zoom');
    z.innerHTML = Math.round(zoom*100) + '%<small>body text about ' + Math.round(px*.72) + 'px | 0 resets</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 1100);
  }
  fitSlide();
}
applyZoom(false);

/* ---- theme: light matches the lecture deck, dark reads better in a dim hall ---- */
function applyTheme(t, show){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('mvcc-theme', t); } catch(e){}
  if(show){
    const z = $('#zoom');
    z.innerHTML = (t === 'dark' ? 'Dark' : 'Light') + '<small>press T to switch</small>';
    z.classList.add('show');
    clearTimeout(z._t); z._t = setTimeout(()=>z.classList.remove('show'), 900);
  }
}
let theme = 'light';
try { theme = localStorage.getItem('mvcc-theme') || 'light'; } catch(e){}
applyTheme(theme, false);

document.addEventListener('keydown', e=>{
  if($('#ov').classList.contains('open') && !['o','O','Escape'].includes(e.key)) return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft':  case 'PageUp':            e.preventDefault(); prev(); break;
    case 'ArrowDown':  e.preventDefault(); jump(1);  break;
    case 'ArrowUp':    e.preventDefault(); jump(-1); break;
    case 'Home': si=0; pi=0; render(); break;
    case 'End':  si=DECK.length-1; pi=DECK[si].steps.length-1; render(); break;
    case 'f': case 'F': e.preventDefault(); toggleFull(); break;
    case 's': case 'S': $('#notes').classList.toggle('open'); break;
    case 'o': case 'O': $('#ov').classList.toggle('open'); break;
    case 't': case 'T':
      theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme, true); break;
    case 'r': case 'R': pi = 0; render(); break;
    case 'Escape': $('#ov').classList.remove('open'); $('#notes').classList.remove('open'); break;
    case '+': case '=': e.preventDefault(); zoom += ZSTEP; applyZoom(true); break;
    case '-': case '_': e.preventDefault(); zoom -= ZSTEP; applyZoom(true); break;
    case '0': e.preventDefault(); zoom = 1; applyZoom(true); break;
  }
});
stage.addEventListener('click', () => next());

/* ---- full screen: a visible control, since F is only in the footer legend ---- */
function toggleFull(){
  document.fullscreenElement ? document.exitFullscreen()
                             : document.documentElement.requestFullscreen().catch(()=>{});
}
$('#btnFull').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
document.addEventListener('fullscreenchange', () => {
  $('#btnFullTxt').textContent = document.fullscreenElement ? 'Exit' : 'Present';
});

/* ---- run of show ---- */
$('#ovGrid').innerHTML = DECK.map((s,i)=>
  `<div class="ovc${s.type==='chapter'?' ovc-ch':''}" data-i="${i}">
     <div class="i">${s.chapter ? 'CH '+s.chapter.n : ''} | ${s.tag}</div>
     <div class="t">${s.title}</div></div>`).join('');
$('#ovGrid').querySelectorAll('.ovc').forEach(el =>
  el.onclick = () => { si=+el.dataset.i; pi=0; $('#ov').classList.remove('open'); render(); });

/* ---- elapsed timer ---- */
const t0 = Date.now();
setInterval(()=>{
  const s = Math.floor((Date.now()-t0)/1000);
  $('#clock').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}, 1000);

render();
</script>
</body>
