<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>MVCC &amp; the Query Engine</title>
<style>
:root{
  /* Type is a share of SCREEN HEIGHT so the deck keeps its physical size on any
     projector resolution. --scale is the presenter's live zoom (+ / - / 0).   */
  --scale:1;

  /* Sketchnote palette: cream paper, ink, highlighter, pencil-blue */
  --paper:#FBF3E4;
  --paper-2:#F5EAD6;
  --card:#FFFFFF;
  --ink:#1C1A17;
  --ink-2:#403B34;
  --muted:#6B6259;
  --line:#D8CCB4;

  --amber:#FFD766;          /* highlighter */
  --amber-2:#F7C948;
  --amber-soft:#FDEFC2;
  --pencil:#7FA3C9;         /* the blue-grey sketch fill */
  --pencil-2:#3D5C7E;
  --pencil-soft:#DCE8F4;
  --flame:#E8553A;          /* warnings, hot shards - a FILL colour */
  --flame-ink:#BF3419;      /* the same voice, dark enough to set as text */
  --flame-soft:#FBE2DC;
  --on-flame:#2A1109;     /* text that sits ON a flame fill, in either theme */
  --surface-blue:#3D5C7E;   /* coloured bands that keep white text in BOTH themes */
  --surface-green:#3A7A3D;
  --leaf:#3A7A3D;           /* good, benefits */
  --leaf-soft:#E2F0E2;

  --bg:var(--paper);
  --bg-2:var(--paper-2);
  --panel:var(--card);
  --panel-2:var(--paper-2);

  /* names the rest of the stylesheet and the scene code already speak */
  --squid:var(--ink);
  --squid-2:var(--pencil-2);
  --squid-deep:#12100E;
  --orange:var(--amber);
  --orange-deep:#6E4A05;
  --orange-soft:var(--amber-soft);
  --link:var(--pencil-2);
  --link-soft:var(--pencil-soft);
  --red:var(--flame);
  --red-soft:var(--flame-soft);
  --green:var(--leaf);
  --green-soft:var(--leaf-soft);
  --white:var(--card);
  --line-2:#E7DEC9;
  --accent:var(--pencil-2);
  --accent-deep:var(--ink);
  --accent-soft:var(--line);
  --accent-tint:var(--amber-soft);
  --violet:var(--pencil-2);
  --violet-soft:var(--pencil-soft);
  --teal:var(--pencil);
  --clay:var(--flame);
  --ok:var(--leaf);
  --navy-900:var(--ink);
  --navy-800:var(--ink);
  --navy-700:var(--ink);
  --blue:var(--pencil-2);
  --blue-400:var(--ink);
  --blue-300:var(--pencil);
  --cyan:var(--amber);
  --purple:var(--pencil-2);
  --purple-300:var(--amber);
  --gold:var(--amber);
  --gold-soft:var(--amber-soft);
  --navy:#1C1A17;

  --shadow:3px 4px 0 rgba(28,26,23,.13);
  --shadow-sm:2px 3px 0 rgba(28,26,23,.11);

  /* hand-drawn box: uneven corner radii, the classic sketch trick */
  --wobble:255px 15px 225px 15px/15px 225px 15px 255px;
  --wobble-2:15px 225px 15px 255px/225px 15px 255px 15px;

  --hand:Arial,Helvetica,sans-serif;
  --marker:Arial,Helvetica,sans-serif;
  --arial:var(--hand);
  --serif:var(--marker);
  --news:var(--hand);
  --sans:var(--hand);
  --mono:Arial,Helvetica,sans-serif;
}
:root[data-theme="dark"]{
  /* accents re-lit for a dark ground - the light-theme values are far too dark here */
  --amber:#6B5416;
  --amber-2:#7A5D14;
  --pencil-2:#B8D4F0;
  --flame-ink:#FF8A6E;
  --leaf:#6FBF73;
  --orange-deep:#F2D07A;
  --paper:#241F1A;
  --paper-2:#2C261F;
  --card:#2B251E;
  --ink:#F6EEDF;
  --ink-2:#DACFBC;
  --muted:#9E9382;
  --line:#4A4136;
  --line-2:#3C342B;
  --amber-soft:#463A1C;
  --pencil-soft:#26323E;
  --flame-soft:#3E241E;
  --leaf-soft:#22331F;
  --white:var(--card);
  --squid-deep:#0E0C0A;
  --shadow:3px 4px 0 rgba(0,0,0,.45);
  --shadow-sm:2px 3px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{height:100dvh}
html{font-size:clamp(14px, calc(min(3.5vh, 2.08vw) * var(--scale)), 56px)}
body{
  margin:0;color:var(--ink);overflow:hidden;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 22% 18%, rgba(255,215,102,.16), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(127,163,201,.13), transparent 46%);
  font-family:var(--sans);overflow:hidden;
}

/* ================= shell: chapter rail + document =================
   Flat and rule-based rather than floating cards: square corners, hairline
   borders, no shadows. The rail carries identity and position so the stage
   gets the full height of the screen.                                      */
#app{height:100%;max-width:100%;display:grid;
  grid-template-columns:clamp(8.2rem,12.5vw,12.5rem) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);overflow:hidden}

.rail{background:transparent;color:var(--ink);display:flex;flex-direction:column;
  padding:.9rem .85rem;gap:.7rem;border-right:3px dashed var(--line);
  min-width:0;min-height:0;overflow:hidden}
.rail-lecture{font-family:var(--hand);font-size:.5rem;font-weight:400;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--orange-deep);padding-bottom:.7rem;
  border-bottom:2px dashed var(--line)}
.rail-lecture b{display:block;margin-top:.15rem;font-family:var(--marker);font-weight:700;
  font-size:1.05rem;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1.05}

/* the chapter list scrolls rather than clipping - at a large type scale, or on a
   short screen, it can outgrow the margin. `safe center` keeps it centred while it
   fits but falls back to start when it overflows, so the first item stays reachable. */
.rail-nav{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  justify-content:safe center;gap:.08rem;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;scrollbar-width:none}
.rail-nav::-webkit-scrollbar{width:0;height:0}
/* only when it actually scrolls: fade the cut edges so a half-shown chapter
   reads as "there is more above/below" rather than as a clipping bug */
.rail-nav.scrolls{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,
  #000 calc(100% - 14px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,
  #000 calc(100% - 14px),transparent 100%)}
.rn{display:grid;grid-template-columns:1.35rem 1fr;gap:.4rem;align-items:baseline;
  padding:clamp(.16rem,.72vh,.3rem) .25rem;cursor:pointer;border-left:3px solid transparent;
  color:var(--muted);transition:color .15s,border-color .15s,background .15s}
.rn:hover{color:var(--ink);background:var(--amber-soft)}
.rn-n{font-family:var(--mono);font-size:.46rem;font-weight:700;text-align:right;color:var(--orange-deep)}
.rn-t{font-family:var(--hand);font-size:.62rem;line-height:1.15}
.rn.done{color:var(--muted);opacity:.7}
.rn.now{color:var(--ink);border-left-color:transparent;background:var(--amber);
  border-radius:var(--wobble-2);box-shadow:var(--shadow-sm)}
.rn.now .rn-n{color:var(--ink)}

.rail-foot{flex:0 0 auto;display:flex;flex-direction:column;gap:.5rem;
  padding-top:.7rem;border-top:2px dashed var(--line)}
.present{display:inline-flex;align-items:center;justify-content:center;gap:.4em;cursor:pointer;
  font-family:var(--hand);font-size:.62rem;letter-spacing:.5px;padding:.34rem .6rem;
  border:2.5px solid var(--ink);border-radius:var(--wobble);background:var(--amber);
  color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .12s}
.present:hover{transform:translate(-1px,-1px) rotate(-.7deg)}
.present svg{width:1.05em;height:1.05em}
.rail-meta{display:flex;justify-content:space-between;gap:.4rem;font-family:var(--mono);
  font-size:.44rem;color:var(--muted)}
.rail-keys{font-size:.48rem;line-height:1.8;color:var(--muted)}
kbd{font-family:var(--mono);font-size:.9em;background:var(--amber-soft);
  border:1.5px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--ink-2)}

.doc{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:transparent}
.doc-head{flex:0 0 auto;min-width:0;padding:.7rem 1.35rem .55rem;
  border-bottom:3px solid var(--ink)}
.eyebrow{font-family:var(--hand);font-size:.6rem;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--orange-deep);margin-bottom:.1rem}
.slide-title{display:inline-block;margin:0;font-family:var(--marker);font-weight:700;
  font-size:2rem;line-height:1;letter-spacing:0;color:var(--ink);
  background:linear-gradient(var(--amber),var(--amber));
  background-size:100% .62em;background-position:0 .62em;background-repeat:no-repeat;
  padding:0 .18em .06em;transform:rotate(-.5deg)}
:root[data-theme="dark"] .slide-title{color:var(--ink)}
.kick{margin-top:.12rem;font-family:var(--hand);font-size:.72rem;color:var(--muted)}

main{flex:1 1 auto;min-height:0;min-width:0;padding:.65rem 1.35rem .7rem;display:flex;overflow:hidden}
.slide{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.fit{width:100%;height:100%;min-height:0;padding:5px 0;display:flex;flex-direction:column;gap:.38rem;
  justify-content:center;transform-origin:center top}
/* measurement pose: centred boxes hide half their overflow from scrollHeight,
   so everything is top-aligned for the instant we measure */
.fit.topfit{justify-content:flex-start}
.fit.measuring,.fit.measuring *{
  align-items:flex-start!important;align-content:flex-start!important;
  justify-content:flex-start!important}

/* a credit line, not content: capped so it stays subordinate on a big projector
   and never steals height from the chapter list */
.rail-by{flex:0 0 auto;font-family:var(--hand);font-size:clamp(8px,.44rem,12px);
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
  padding-top:clamp(4px,.42rem,9px);border-top:1px dashed var(--line);
  white-space:nowrap;overflow:hidden}
.rail-by b{font-family:var(--marker);font-weight:700;font-size:clamp(11px,.6rem,15px);
  letter-spacing:.2px;text-transform:none;color:var(--ink)}

.progress{flex:0 0 auto;height:5px;background:var(--line)}
.progress span{display:block;height:100%;background:var(--amber-2);transition:width .2s ease}

@media (max-height:820px){ .rail-keys{display:none} }
@media (max-height:720px){
  .rail-lecture{padding-bottom:.5rem}
  .rail-lecture b{font-size:.56rem}
  .rn{padding:.22rem .25rem}
  .rail-foot{gap:.35rem;padding-top:.5rem}
}
@media (max-height:600px){
  .rail-lecture b{display:none}
  .rail-by{font-size:0;padding-top:.32rem}
  .rail-by b{font-size:.56rem}
  .rn-t{font-size:.46rem}
}

@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;align-items:center;gap:.7rem;border-right:none;
    border-bottom:3px solid var(--orange);padding:.5rem .8rem}
  .rail-nav,.rail-keys{display:none}
  .rail-lecture{padding-bottom:0;border-bottom:none}
  .rail-foot{flex-direction:row;align-items:center;border-top:none;padding-top:0;margin-left:auto}
  .rail-by{font-size:0;padding-top:0;border-top:none}
  .rail-by b{font-size:.56rem}
  .doc-head{padding:.8rem 1rem .5rem}
  main{padding:.7rem 1rem}
}

/* ================= shared blocks ================= */
.lede{margin:0;font-family:var(--hand);font-size:.94rem;line-height:1.38;color:var(--ink-2);max-width:54rem}
.lede b{color:var(--ink);font-weight:600}
.kicker{font-family:var(--news);font-style:italic;font-size:.82rem;color:var(--violet);margin:0}
.stage-row{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
svg.scene{width:100%;height:100%;max-height:100%;overflow:visible;fill:var(--ink)}
svg.scene rect:not(.nofx),svg.scene circle:not(.packet){filter:url(#rough)}
.cards{display:grid;gap:.5rem}
/* equal-height cards within a row, without forcing the grid to fill */
.fit > .cards > .pop{display:flex}
.fit > .cards > .pop > .card{flex:1 1 auto}
.card{position:relative;background:var(--card);border:2.5px solid var(--ink);
  border-radius:var(--wobble);padding:.62rem .9rem;overflow:visible;box-shadow:var(--shadow-sm)}
.card:nth-of-type(even){border-radius:var(--wobble-2);transform:rotate(.22deg)}
.card:nth-of-type(odd){transform:rotate(-.18deg)}
.card::after{content:'';position:absolute;left:.7rem;right:.7rem;top:-2px;height:7px;
  background:var(--pencil);border-radius:99px;opacity:.85}
.card.warn::after{background:var(--flame)} .card.good::after{background:var(--leaf)}
.card.pp::after{background:var(--amber-2)} .card.tl::after{background:var(--pencil-2)}
.card h4{margin:.1rem 0 .2rem;font-family:var(--hand);font-size:.62rem;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--orange-deep)}
.card.warn h4{color:var(--flame-ink)} .card.good h4{color:var(--leaf)}
.card.pp h4{color:var(--orange-deep)} .card.tl h4{color:var(--pencil-2)}
.card h3{margin:0 0 .18rem;font-family:var(--marker);font-weight:700;font-size:1.12rem;
  line-height:1.02;letter-spacing:0;color:var(--ink)}
.card p{margin:0;font-family:var(--hand);font-size:.76rem;line-height:1.34;color:var(--ink-2)}
.card:has(.ico) h3,.card:has(.ico) h4{padding-right:2.6rem}
.card .ico{position:absolute;right:.6rem;top:.55rem;width:1.9rem;height:1.9rem;
  border-radius:var(--wobble-2);display:grid;place-items:center;background:var(--amber-soft);
  border:2px solid var(--ink)}
.card .ico svg{width:1rem;height:1rem;color:var(--ink)}
.card.warn .ico svg{color:var(--flame)} .card.good .ico svg{color:var(--leaf)}
.card.pp .ico svg{color:var(--orange-deep)} .card.tl .ico svg{color:var(--pencil-2)}
code,.mono{font-family:var(--mono);font-size:.84em;background:var(--amber-soft);
  padding:1px 5px;border-radius:5px;color:var(--ink);border:1.5px solid var(--line)}
:root[data-theme="dark"] code,:root[data-theme="dark"] .mono{color:var(--orange-deep)}

.pop{opacity:0;transform:translateY(12px);animation:pop .42s cubic-bezier(.22,1,.36,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}
.d4{animation-delay:.3s}.d5{animation-delay:.38s}.d6{animation-delay:.46s}

/* ================= motion primitives ================= */
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(27,127,212,0))}
                     50%{filter:drop-shadow(0 0 10px rgba(27,127,212,.65))}}
@keyframes hotPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(232,85,45,.35))}
                    50%{filter:drop-shadow(0 0 16px rgba(232,85,45,.85))}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes dashFlow{to{stroke-dashoffset:-36}}

.sv-draw{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:drawIn .7s ease forwards}
.sv-fade{opacity:0;animation:fadeIn .45s ease forwards}
.sv-rise{opacity:0;animation:riseIn .5s cubic-bezier(.22,1,.36,1) forwards}
.sv-pop{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
.sv-glow{animation:glowPulse 2.1s ease-in-out infinite}
.sv-hot{animation:hotPulse 1.3s ease-in-out infinite}
.sv-float{animation:floatY 2.6s ease-in-out infinite}
.wire{stroke:var(--ink);stroke-width:2.4;fill:none;stroke-linecap:round;filter:url(#rough2)}
.wire.live{stroke:var(--pencil-2);stroke-width:2.6;stroke-dasharray:9 9;animation:dashFlow .9s linear infinite}
/* `animation` is a shorthand, so a flowing wire that also fades in needs BOTH
   animations declared together - otherwise the flow replaces the fade and the
   line is stuck at opacity 0. */
/* packets riding the wires */
.packet{filter:drop-shadow(0 0 4px currentColor);opacity:.95}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sv-grow{transform-box:fill-box;transform-origin:bottom;animation:growUp .75s cubic-bezier(.22,1,.36,1) forwards}
@keyframes sweepX{0%{transform:translateX(0)}100%{transform:translateX(var(--sweep,840px))}}
.sv-sweep{animation:sweepX 2.4s linear infinite}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
.sv-blip{animation:blip 1.4s ease-in-out infinite}
@keyframes railPulse{0%,100%{opacity:1}50%{opacity:.55}}
.rn.now .rn-n{animation:railPulse 2.4s ease-in-out infinite}
.wire.live.sv-fade{animation:dashFlow .9s linear infinite, fadeIn .45s ease forwards}
.wire.sv-fade{animation:fadeIn .45s ease forwards}
.wire.hotwire{stroke:var(--orange)}
text{font-family:var(--hand)}
.t-lbl{font-size:17px;fill:var(--ink)}
.t-serif{font-family:var(--marker);font-weight:700;fill:var(--ink)}
.t-sub{font-size:16px;fill:var(--muted)}
.t-mono{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:var(--ink-2)}
.t-big{font-family:var(--marker);font-size:30px;font-weight:700;fill:var(--ink)}
.box{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-navy{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-blue{fill:var(--card);stroke:var(--ink);stroke-width:2.6;filter:url(#rough)}
.box-purple{fill:var(--amber);stroke:var(--ink);stroke-width:2.2;filter:url(#rough)}
.box-orange{fill:var(--flame);stroke:var(--ink);stroke-width:2.2;filter:url(#rough)}
.on-navy{fill:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .sv-draw{stroke-dashoffset:0}
  .sv-fade,.sv-rise,.sv-pop,.pop{opacity:1;transform:none}
}

/* ================= side-by-side explainer ================= */
.split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);
  gap:.9rem;align-items:start}
.split-l,.split-r{min-width:0;min-height:0}
.split-l{display:flex;align-items:center;height:100%}
.lp{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wobble);
  padding:.85em 1em;box-shadow:var(--shadow-sm);transform:rotate(.22deg);
  font-size:clamp(10px,min(1.62vh,0.98vw),27px)}
.lp-head{display:flex;align-items:center;flex-wrap:wrap;gap:.45em;margin-bottom:.5em;min-width:0}
.lp-ico{flex:0 0 auto;width:2.3em;height:2.3em;border-radius:var(--wobble-2);display:grid;
  place-items:center;background:var(--amber-soft);border:2px solid var(--ink)}
.lp-ico svg{width:1.25em;height:1.25em;color:var(--ink)}
.lp-n{font-family:var(--hand);font-size:.86em;letter-spacing:1.3px;text-transform:uppercase;color:var(--orange-deep)}
.lp-t{font-family:var(--marker);font-weight:700;font-size:1.72em;line-height:.98;color:var(--ink)}
.lp-when{margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:.72em;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink);background:var(--amber);padding:.18em .55em;
  border:2px solid var(--ink);border-radius:var(--wobble-2)}
.lp-owns{margin:0 0 .5em;font-family:var(--hand);font-size:1.08em;line-height:1.26;color:var(--ink-2)}
.lp-row{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:.5em;padding:.3em 0;
  border-top:2px dashed var(--line)}
.lp-k{font-family:var(--hand);font-size:.86em;letter-spacing:.9px;text-transform:uppercase;
  color:var(--muted);padding-top:.12em}
.lp-row.warn .lp-k{color:var(--flame-ink)} .lp-row.good .lp-k{color:var(--green)}
.lp-v{font-family:var(--hand);font-size:1.04em;line-height:1.26;color:var(--ink-2)}
@media (max-width:980px){.split{grid-template-columns:1fr;gap:.6rem}}

/* ================= taped-in logo ================= */
.taped{position:relative;display:inline-block;background:#fff;padding:.55rem .85rem;
  border:1px solid var(--line);box-shadow:var(--shadow);transform:rotate(-1.6deg)}
.taped.r{transform:rotate(1.3deg)}
.taped::before,.taped::after{content:'';position:absolute;width:3rem;height:1rem;
  background:rgba(255,215,102,.6);border:1px solid rgba(28,26,23,.14);
  box-shadow:0 1px 2px rgba(28,26,23,.10)}
.taped::before{top:-.42rem;left:-.85rem;transform:rotate(-24deg)}
.taped::after{bottom:-.42rem;right:-.85rem;transform:rotate(-24deg)}
.taped img{display:block;height:var(--logo-h,2.4rem);width:auto}
.taped figcaption{margin-top:.25rem;font-family:var(--hand);font-size:.5rem;
  color:var(--muted);text-align:center;letter-spacing:.3px}

/* ================= chapter opener ================= */
.chapter{flex:1 1 auto;display:flex;align-items:center;gap:2.4rem;padding:0 .6rem}
.ch-rail{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;
  padding-right:2.2rem;border-right:4px dashed var(--amber-2)}
.ch-num{font-family:var(--marker);font-size:7rem;font-weight:700;line-height:.76;
  color:var(--ink);letter-spacing:0}
:root[data-theme="dark"] .ch-num{color:var(--ink)}
.ch-of{font-family:var(--hand);font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ch-body{flex:1 1 auto;min-width:0;max-width:46rem}
.ch-when{font-family:var(--hand);font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--orange-deep);margin-bottom:.3rem}
.ch-title{display:inline-block;margin:0 0 .65rem;font-family:var(--marker);font-weight:700;
  font-size:2.6rem;line-height:.98;letter-spacing:0;color:var(--ink);transform:rotate(-.8deg);
  background:linear-gradient(var(--amber),var(--amber));background-size:100% .5em;
  background-position:0 .66em;background-repeat:no-repeat;padding:0 .14em}
:root[data-theme="dark"] .ch-title{color:var(--ink)}
.ch-problem{margin:0 0 .45rem;font-family:var(--marker);font-weight:700;font-size:1.5rem;
  line-height:1.06;color:var(--ink)}
.ch-detail{margin:0 0 .5rem;font-family:var(--hand);font-size:.92rem;line-height:1.34;color:var(--ink-2)}
.ch-next{margin:0;font-family:var(--hand);font-size:.86rem;line-height:1.3;color:var(--ink);
  border-left:4px dashed var(--amber-2);padding-left:.7rem}
@media (max-width:900px){
  .chapter{flex-direction:column;align-items:flex-start;gap:1rem}
  .ch-rail{flex-direction:row;align-items:baseline;border-right:none;
    border-bottom:4px solid var(--orange);padding:0 0 .4rem;gap:.7rem}
  .ch-num{font-size:3rem}}

/* ================= notes / overview / zoom ================= */
#notes::-webkit-scrollbar,#ov::-webkit-scrollbar{width:0;height:0}
#notes,#ov{scrollbar-width:none}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(101%);
  transition:transform .28s ease;background:var(--navy);color:#eaf3fa;
  border-top:3px solid var(--gold);padding:14px 24px 16px;max-height:46vh;overflow-y:auto}
#notes.open{transform:none}
#notes h6{margin:0 0 6px;font-size:.5rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
#notes .say{font-family:var(--news);font-size:.82rem;line-height:1.55;max-width:66rem}
#notes .say b{color:var(--gold);font-weight:700}
#notes .nxt{margin-top:8px;font-size:.5rem;color:#8fabc2;font-family:var(--mono)}

#ov{position:fixed;inset:0;z-index:50;background:var(--bg);padding:28px;display:none;overflow-y:auto}
#ov.open{display:block}
#ov h3{margin:0 0 16px;font-family:var(--serif);font-size:.86rem;font-weight:700;color:var(--navy);letter-spacing:0;text-transform:none}

.ovc{padding:11px 13px;border-radius:0;border:1px solid var(--line);border-top:3px solid var(--line);
  cursor:pointer;background:var(--panel);transition:.15s}
.ovc:hover{border-top-color:var(--orange)}

.ovc-ch .t{color:#fff}.ovc-ch .i{color:var(--orange)}

.ovc .t{font-family:var(--serif);font-size:.7rem;font-weight:700;margin-top:4px;line-height:1.2}

<script>
/* =====================================================================
   Motion scenes - inline SVG infographics.
   Every scene takes the current step and returns markup; entrance
   animations are CSS classes, so a re-render replays only what changed.
   ===================================================================== */
/* ---- line-art icon set - stroked, inherits colour, reads at projector size ---- */
const ICON = {
  server:  'M3 4h18v6H3zM3 14h18v6H3zM7 7h.01M7 17h.01',
  db:      'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  lock:    'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4',
  grid:    'M3 3h18v18H3zM3 9h18M9 3v18',
  search:  'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3',
  users:   'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6M22 19v-1a4 4 0 0 0-3-3.9',
  cart:    'M2 3h2l2.4 12.5a2 2 0 0 0 2 1.5h9.7a2 2 0 0 0 2-1.6L21 7H6M9.5 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2',
  bolt:    'M13 2 3 14h8l-1 8 10-12h-8z',
  trash:   'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14',
  layers:  'M12 2 2 7l10 5 10-5zM2 12l10 5 10-5M2 17l10 5 10-5',
  ban:     'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M5.6 5.6l12.8 12.8',
  sigma:   'M18 5H6l6 7-6 7h12',
  clock:   'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7v5l3 2',
  build:   'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5',
  route:   'M6 3v12a3 3 0 0 0 3 3h9M15 15l3 3-3 3',
  shield:  'M12 3l8 3v6c0 5-3.5 8.3-8 9.5C7.5 20.3 4 17 4 12V6z',
  split:   'M6 3v6a3 3 0 0 0 3 3h9M6 21v-6a3 3 0 0 1 3-3M15 9l3 3-3 3',
  gauge:   'M12 21a9 9 0 1 1 9-9M12 12l5-3'
};
const ico = (n, c='currentColor') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[n]||ICON.db}"/></svg>`;

/* ---- motion helpers -------------------------------------------------
   wire() draws a connector AND sends packets riding along it, so a query
   is visibly travelling rather than implied by a dashed line.          */
let flowSeq = 0;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function wire(d, o = {}){
  const id  = 'fp' + (++flowSeq);
  const col = o.color || 'var(--blue)';
  const dur = o.dur || 1.8;
  const n   = o.packets == null ? 1 : o.packets;
  const cls = 'wire' + (o.live === false ? '' : ' live') + (o.cls ? ' ' + o.cls : '');
  let g = `<path id="${id}" d="${d}" class="${cls}"${o.stroke ? ` stroke="${o.stroke}"` : ''}/>`;
  if(!REDUCED) for(let i = 0; i < n; i++){
    g += `<circle r="${o.r || 5}" fill="${col}" class="packet">
      <animateMotion dur="${dur}s" repeatCount="indefinite"
        begin="${((o.delay || 0) + i * dur / n).toFixed(2)}s" rotate="auto">
        <mpath href="#${id}" xlink:href="#${id}"/></animateMotion></circle>`;
  }
  return g;
}

const SV = (vb, inner) => `<svg class="scene" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const D  = n => `style="animation-delay:${n}ms"`;
/* =====================================================================
   Deck - PostgreSQL Internals: MVCC & the Query Engine
   One running story: NeoBank. Asha reads, Ravi writes.
   ===================================================================== */
const card = (k,t,p,cls='',ic='',pop='') =>
  `<div class="${pop}"><div class="card ${cls}">${ic?`<span class="ico">${ico(ic)}</span>`:''}
     <h4>${k}</h4><h3>${t}</h3><p>${p}</p></div></div>`;

/* animate only what is new on this step, so earlier steps stay still */
const an  = (k, st, cls='sv-rise') => st === k ? cls : '';
const pp  = (k, st) => st === k ? 'pop' : '';

/* SQL block with light highlighting: pass pre-marked HTML */
const sql = (html, extra='') => `<div class="sql ${extra}">${html}</div>`;
const K = s => `<span class="k">${s}</span>`;
const S = s => `<span class="s">${s}</span>`;
const C = s => `<span class="c">${s}</span>`;

/* a table built one row per step, in the lecture's sketch style */
function rowsTable(head, rows, st, tpl, hi = -1, from = 0){
  return `<div class="tbl">
    <div class="trh" style="grid-template-columns:${tpl}">${head.map(h=>`<span>${h}</span>`).join('')}</div>
    ${rows.map((r,i)=> st >= i + from ? `<div class="tr ${pp(i+from,st)} ${i===hi?'hi':''}"
       style="grid-template-columns:${tpl}">${r.map(c=>`<span>${c}</span>`).join('')}</div>` : '').join('')}
  </div>`;
}

/* ---------------- drawing primitives ---------------- */
function person(x, y, name, role, col, cls='', delay=0){
  return `<g class="${cls}" ${D(delay)}>
    <circle cx="${x}" cy="${y}" r="19" fill="var(--amber-soft)" stroke="var(--ink)" stroke-width="2.4"/>
    <path d="M${x-28} ${y+62} q0 -38 28 -38 q28 0 28 38 z" fill="${col}" stroke="var(--ink)" stroke-width="2.4"/>
    <text class="t-serif" x="${x}" y="${y+92}" text-anchor="middle" style="font-size:21px">${name}</text>
    <text class="t-sub" x="${x}" y="${y+114}" text-anchor="middle">${role}</text></g>`;
}
function cyl(x, y, w, h, label, sub='', cls='', fill='var(--card)'){
  return `<g class="${cls}">
    <path d="M${x} ${y+14} v${h-28} a${w/2} 14 0 0 0 ${w} 0 v${-(h-28)}" fill="${fill}" stroke="var(--ink)" stroke-width="2.6"/>
    <ellipse cx="${x+w/2}" cy="${y+14}" rx="${w/2}" ry="14" fill="var(--amber-soft)" stroke="var(--ink)" stroke-width="2.6"/>
    <text class="t-serif" x="${x+w/2}" y="${y+h/2+12}" text-anchor="middle" style="font-size:21px">${label}</text>
    ${sub?`<text class="t-sub" x="${x+w/2}" y="${y+h/2+34}" text-anchor="middle">${sub}</text>`:''}</g>`;
}
function boxT(x, y, w, h, title, sub='', o={}){
  const fill = o.fill || 'var(--card)';
  return `<g class="${o.cls||''}" ${D(o.delay||0)}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="var(--ink)"
      stroke-width="${o.sw||2.5}" ${o.dash?'stroke-dasharray="8 6"':''} ${o.glow?'class="sv-glow"':''}/>
    <text class="t-serif" x="${x+w/2}" y="${y+(sub?h/2-2:h/2+8)}" text-anchor="middle"
      style="font-size:${o.fs||18}px;fill:${o.tc||'var(--ink)'}">${title}</text>
    ${sub?`<text x="${x+w/2}" y="${y+h/2+22}" text-anchor="middle"
      style="font-size:${o.ss||12}px;fill:${o.sc||'var(--muted)'}">${sub}</text>`:''}</g>`;
}
function lockIco(x, y, s=1, col='var(--flame)'){
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-12 -2 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="var(--ink)" stroke-width="3"/>
    <rect x="-17" y="-3" width="34" height="26" rx="4" fill="${col}" stroke="var(--ink)" stroke-width="2.4"/></g>`;
}
function arrowHead(x, y, dir='r', col='var(--ink)'){
  const p = {r:`M${x-12} ${y-8} L${x} ${y} L${x-12} ${y+8}`, l:`M${x+12} ${y-8} L${x} ${y} L${x+12} ${y+8}`,
             d:`M${x-8} ${y-12} L${x} ${y} L${x+8} ${y-12}`, u:`M${x-8} ${y+12} L${x} ${y} L${x+8} ${y+12}`}[dir];
  return `<path d="${p}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
}

/* one heap tuple: version badge, data, and the two hidden header fields */
function tup(x, y, o){
  const w = o.w || 560, h = o.h || 60;
  const fills = {live:'var(--card)', new:'var(--amber-soft)', dead:'var(--flame-soft)',
                 gone:'var(--paper)', vis:'var(--leaf-soft)'};
  const st = o.st || 'live';
  const dash = (st==='new'||st==='gone') ? 'stroke-dasharray="8 6"' : '';
  const cell = (cx, lab, val, hi) => `
    <rect x="${cx}" y="${y+8}" width="98" height="${h-16}" rx="3"
      fill="${hi?'var(--amber)':'var(--paper-2)'}" stroke="var(--ink)" stroke-width="1.8"/>
    <text x="${cx+49}" y="${y+24}" text-anchor="middle" style="font-size:10px;fill:var(--muted)">${lab}</text>
    <text class="t-mono" x="${cx+49}" y="${y+h-15}" text-anchor="middle" style="font-size:14px;fill:var(--ink);font-weight:700">${val}</text>`;
  return `<g class="${o.cls||''}" ${D(o.delay||0)} ${st==='gone'?'opacity=".45"':''}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fills[st]}" stroke="var(--ink)" stroke-width="2.4" ${dash}/>
    <circle cx="${x+34}" cy="${y+h/2}" r="19" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
    <text class="t-serif" x="${x+34}" y="${y+h/2+8}" text-anchor="middle" style="font-size:18px">${o.v}</text>
    <text class="t-mono" x="${x+66}" y="${y+h/2+6}" style="font-size:14px;fill:var(--ink)">${o.data}</text>
    ${cell(x+w-214, 'xmin', o.xmin, o.hiMin)}${cell(x+w-108, 'xmax', o.xmax, o.hiMax)}
    ${o.tag?`<text class="t-serif" x="${x+w+18}" y="${y+h/2+9}" style="font-size:19px;fill:${o.tagc||'var(--ink)'}">${o.tag}</text>`:''}
  </g>`;
}

/* VACUUM over a strip of tuple slots */
function sceneVacuum(st){
  const N = 24, pin = [4, 11, 17];
  const dead = [1,4,6,9,11,14,17,19,22];
  let g = `<text class="t-sub" x="40" y="30">accounts, one heap file: each slot holds one tuple</text>`;
  const full = st >= 3;
  let live = 0;
  for(let i=0;i<N;i++){
    let kind = dead.includes(i) ? 'd' : 'l';
    if(st >= 2 && kind === 'd' && !pin.includes(i)) kind = 'f';
    if(st === 1 || st === 2){ /* the long report is holding three of them */ }
    if(full && kind !== 'l' && !pin.includes(i)) continue;
    if(full && pin.includes(i)) kind = 'd';
    const x = full ? 40 + (live++) * 38 : 40 + i*38;
    const fill = kind==='l' ? 'var(--leaf-soft)' : kind==='d' ? 'var(--flame)' : 'var(--paper)';
    g += `<rect class="nofx ${st===2&&kind==='f'?'sv-fade':''}" x="${x}" y="46" width="32" height="54" rx="3" fill="${fill}"
      stroke="var(--ink)" stroke-width="2" ${kind==='f'?'stroke-dasharray="5 4"':''}/>`;
    if(st >= 1 && st < 3 && pin.includes(i)) g += `<g class="${an(1,st,'sv-pop')}">${lockIco(x+16, 128, .6, 'var(--pencil)')}</g>`;
  }
  const len = full ? live*38 : N*38;
  g += `<line x1="40" y1="${st>=1&&st<3?156:120}" x2="${40+len-6}" y2="${st>=1&&st<3?156:120}" stroke="var(--ink)" stroke-width="2"/>
    <text class="t-sub" x="${40+len-6}" y="${st>=1&&st<3?178:142}" text-anchor="end">file size: ${full?'smaller, rewritten':'unchanged'}</text>`;
  if(st >= 1 && st < 3) g += `<text class="t-sub" x="40" y="178" style="fill:var(--pencil-2)">a long-running report still needs these three</text>`;
  if(st === 2) g += `<rect class="nofx sv-sweep" x="36" y="40" width="6" height="66" fill="var(--amber-2)" style="--sweep:${N*38}px"/>`;
  return SV('0 0 1000 190', g);
}

/* autovacuum: dead tuples climb to a threshold, then get reclaimed */
function sceneSaw(st){
  const lowT = st >= 1;
  const thr = lowT ? 110 : 60;           /* y of the threshold line */
  let g = `<line x1="60" y1="190" x2="940" y2="190" stroke="var(--ink)" stroke-width="2.4"/>
    <line x1="60" y1="30" x2="60" y2="190" stroke="var(--ink)" stroke-width="2.4"/>
    <text class="t-sub" x="70" y="26">n_dead_tup</text><text class="t-sub" x="940" y="212" text-anchor="end">time</text>
    <line x1="60" y1="${thr}" x2="940" y2="${thr}" stroke="var(--flame)" stroke-width="2.4" stroke-dasharray="8 6"/>
    <text x="935" y="${thr-8}" text-anchor="end" style="font-size:13px;fill:var(--flame-ink)">autovacuum threshold${lowT?' (lower scale factor)':''}</text>`;
  const teeth = lowT ? 8 : 4, w = 880/teeth;
  let d = 'M60 190';
  for(let i=0;i<teeth;i++){ d += ` L${60+(i+1)*w} ${thr} L${60+(i+1)*w} 190`; }
  g += `<path d="${d}" fill="none" stroke="var(--pencil-2)" stroke-width="3" class="sv-draw" style="--len:3000"/>`;
  return SV('0 0 1000 220', g);
}

/* PostgreSQL keeps old versions in the heap; Oracle moves them to undo */
function sceneOracle(st){
  let g = `<text class="t-serif" x="250" y="32" text-anchor="middle" style="font-size:21px">PostgreSQL</text>
    ${st>=1?'<text class="t-serif" x="750" y="32" text-anchor="middle" style="font-size:21px">Oracle</text>':''}
    <line x1="500" y1="14" x2="500" y2="210" stroke="var(--line)" stroke-width="3" stroke-dasharray="7 6"/>`;
  g += `<rect x="70" y="50" width="360" height="150" rx="4" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="2.4"/>
    <text class="t-sub" x="84" y="72">the table (heap)</text>
    ${boxT(90, 84, 320, 46, 'v1: 50000 (old)', '', {fill:'var(--flame-soft)', fs:16})}
    ${boxT(90, 140, 320, 46, 'v2: 40000 (new)', '', {fill:'var(--leaf-soft)', fs:16})}`;
  if(st < 1) g += `<text class="t-serif" x="540" y="110" style="font-size:19px;fill:var(--flame-ink)">every UPDATE leaves the old</text>
    <text class="t-serif" x="540" y="142" style="font-size:19px;fill:var(--flame-ink)">version inside the table</text>`;
  if(st >= 1) g += `<rect x="560" y="50" width="380" height="72" rx="4" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="2.4"/>
    <text class="t-sub" x="574" y="70">the table</text>
    ${boxT(580, 76, 340, 40, 'row: 40000 (overwritten)', '', {fill:'var(--leaf-soft)', fs:15})}
    <rect x="560" y="150" width="380" height="58" rx="4" fill="var(--pencil-soft)" stroke="var(--ink)" stroke-width="2.4"/>
    <text class="t-sub" x="574" y="170">undo segment</text>
    <text class="t-serif" x="750" y="196" text-anchor="middle" style="font-size:16px">old copy: 50000</text>
    <path d="M750 120 L750 148" stroke="var(--pencil-2)" stroke-width="2.6"/>${arrowHead(750,150,'d','var(--pencil-2)')}`;
  return SV('0 0 1000 220', g);
}

/* the four-stage pipeline; the lit stage is the one being discussed */
const STAGES = [
  {t:'Parser', q:'valid grammar?', o:'parse tree'},
  {t:'Analyzer', q:'exists? allowed?', o:'query tree'},
  {t:'Planner', q:'which is cheapest?', o:'plan tree'},
  {t:'Executor', q:'run it, row by row', o:'rows'}];
function scenePipe(lit, cum){
  let g = boxT(10, 70, 120, 70, 'SQL', 'text', {fill:'var(--amber-soft)'});
  STAGES.forEach((s,i)=>{
    const x = 170 + i*205, on = cum ? i < lit : i === lit - 1;
    g += boxT(x, 60, 170, 90, s.t, s.q, {fill: on ? 'var(--amber)' : 'var(--card)', glow: i === lit-1, fs:19, sc:'var(--ink-2)'});
    g += `<text class="t-mono" x="${x+85}" y="182" text-anchor="middle" style="font-size:12px;fill:${on?'var(--ink)':'var(--muted)'}">${s.o}</text>`;
    g += `<path d="M${x-35} 105 H${x-4}" stroke="var(--ink)" stroke-width="2.4"/>${arrowHead(x-3,105)}`;
  });
  if(lit >= 1 && !cum){
    const x = 170 + (lit-1)*205;
    g += wire(`M70 150 C 70 215, ${x+85} 215, ${x+85} 152`, {color:'var(--pencil-2)', dur:1.6});
  }
  return SV('0 0 1000 225', g);
}

/* lexing: the string falls apart into typed tokens */
const TOKS = [['SELECT','k'],['holder_name','i'],[',','o'],['balance','i'],['FROM','k'],['accounts','i'],
  ['WHERE','k'],['branch','i'],['=','o'],["'Pune'",'l'],['AND','k'],['balance','i'],['&gt;','o'],['100000','l'],[';','o']];
function tokenChips(st){
  const cls = {k:'tk-k', i:'tk-i', o:'tk-o', l:'tk-l'};
  return `<div class="toks">${TOKS.map((t,i)=>`<span class="tok ${cls[t[1]]} ${st===0?'pop':''}" style="animation-delay:${i*45}ms">${t[0]}</span>`).join('')}</div>
    <div class="tok-key"><span class="tok tk-k">keyword</span><span class="tok tk-i">identifier</span><span class="tok tk-o">operator</span><span class="tok tk-l">literal</span></div>`;
}

/* the parse tree, built one branch per step */
function sceneTree(st){
  const N = [
    {id:'r', t:'SelectStmt', x:500, y:36, s:0, op:1},
    {id:'tl', t:'targetList', x:170, y:120, p:'r', s:1},
    {id:'a', t:'holder_name', x:90, y:210, p:'tl', s:1, leaf:1},
    {id:'b', t:'balance', x:250, y:210, p:'tl', s:1, leaf:1},
    {id:'fc', t:'fromClause', x:470, y:120, p:'r', s:2},
    {id:'c', t:'accounts', x:470, y:210, p:'fc', s:2, leaf:1},
    {id:'wc', t:'whereClause', x:780, y:120, p:'r', s:3},
    {id:'and', t:'AND', x:780, y:210, p:'wc', s:3, op:1},
    {id:'e1', t:"branch = 'Pune'", x:675, y:300, p:'and', s:3, leaf:1},
    {id:'e2', t:'balance &gt; 100000', x:890, y:300, p:'and', s:3, leaf:1}];
  const by = Object.fromEntries(N.map(n=>[n.id,n]));
  let g = '';
  N.forEach(n=>{ if(n.p && st >= n.s){ const p = by[n.p];
    g += `<path class="${an(n.s,st,'sv-draw')}" style="--len:300" d="M${p.x} ${p.y+20} L${n.x} ${n.y-20}" stroke="var(--ink)" stroke-width="2.2" fill="none"/>`; }});
  N.forEach(n=>{ if(st < n.s) return;
    const w = n.t.replace('&gt;','>').length*10.5 + 30;
    g += `<g class="${an(n.s,st,'sv-pop')}"><rect x="${n.x-w/2}" y="${n.y-20}" width="${w}" height="40" rx="4"
      fill="${n.op?'var(--amber)':n.leaf?'var(--card)':'var(--pencil-soft)'}" stroke="var(--ink)" stroke-width="2.3"/>
      <text class="t-mono" x="${n.x}" y="${n.y+6}" text-anchor="middle" style="font-size:14px;fill:var(--ink);font-weight:${n.leaf?400:700}">${n.t}</text></g>`; });
  return SV('0 0 1000 330', g);
}

}

/* four ways to read the table */
function sceneScanKind(k){
  let g = '';
  const pages = (y, hiFn, n=12) => { let s=''; for(let i=0;i<n;i++){ const h = hiFn(i);
    s += `<rect class="nofx" x="${60+i*74}" y="${y}" width="62" height="58" rx="3" fill="${h?'var(--amber)':'var(--card)'}" stroke="var(--ink)" stroke-width="2"/>`; }
    return s; };
  const tree = () => `<g>${boxT(420, 10, 160, 40, 'B-tree root', '', {fs:14, fill:'var(--pencil-soft)'})}
      ${boxT(250, 70, 140, 36, 'branch', '', {fs:13})}${boxT(610, 70, 140, 36, 'branch', '', {fs:13})}
      <path d="M470 50 L330 70 M530 50 L680 70" stroke="var(--ink)" stroke-width="2"/></g>`;
  if(k === 0){
    g += `<text class="t-sub" x="60" y="40">every heap page, first to last</text>${pages(60, ()=>false)}
      <rect class="nofx sv-sweep" x="56" y="54" width="8" height="70" fill="var(--amber-2)" style="--sweep:880px"/>`;
  } else if(k === 1){
    g += tree() + pages(180, i=>[1,6,9].includes(i));
    [[330,1],[330,6],[680,9]].forEach(([x,i],j)=> g += wire(`M${x} 106 C ${x} 150, ${91+i*74} 140, ${91+i*74} 178`, {color:'var(--flame)', dur:1.4, delay:j*.3}));
    g += `<text class="t-sub" x="940" y="170" text-anchor="end">one random heap hop per match</text>`;
  } else if(k === 2){
    g += tree() + `<g opacity=".35">${pages(180, ()=>false)}</g>
      ${boxT(760, 116, 200, 44, 'visibility map', 'all-visible', {fs:13, ss:10, fill:'var(--leaf-soft)'})}
      <text class="t-serif" x="60" y="150" style="font-size:18px;fill:var(--leaf)">answered from the index alone</text>`;
  } else {
    g += `<text class="t-sub" x="60" y="26">1. collect matching locations into a bitmap</text>`;
    for(let i=0;i<24;i++) g += `<rect class="nofx" x="${60+i*37}" y="36" width="30" height="30" fill="${[1,2,6,7,9,15,16,20].includes(i)?'var(--pencil)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.6"/>`;
    g += `<text class="t-sub" x="60" y="100">2. visit only those pages, in page order</text>${pages(112, i=>[0,1,3,4,8,10].includes(i))}
      <path d="M60 190 H920" stroke="var(--pencil-2)" stroke-width="2.6"/>${arrowHead(920,190,'r','var(--pencil-2)')}`;
  }
  return SV(`0 0 1000 ${k===0?130:k===3?205:245}`, g);
}

/* the three candidate costs, grown as bars */
function sceneCost(st){
  const C = [['Seq Scan', 22000, '12,000 pages x 1.0 + 1M rows x 0.01'], ['Index Scan on branch', 60000, '15,000 random heap hops x 4.0'],
             ['Bitmap Heap Scan', 9000, 'medium selectivity, pages visited in order']];
  let g = '';
  if(st === 0){
    C.forEach((c,i)=> g += `<text class="t-serif" x="250" y="${48+i*72}" text-anchor="end" style="font-size:18px">${c[0]}</text>
      <rect x="270" y="${16+i*72}" width="600" height="46" rx="3" fill="var(--paper-2)" stroke="var(--ink)" stroke-width="2" stroke-dasharray="8 6"/>
      <text class="t-serif" x="570" y="${48+i*72}" text-anchor="middle" style="font-size:21px;fill:var(--muted)">cost = ?</text>`);
    return SV('0 0 1000 230', g);
  }
  C.forEach((c,i)=>{
    if(st < i+1) return;
    const w = 600 * c[1]/60000, y = 16 + i*72, win = i === 2 && st >= 3;
    g += `<text class="t-serif" x="250" y="${y+32}" text-anchor="end" style="font-size:18px">${c[0]}</text>
      <rect class="${an(i+1,st,'sv-rise')}" x="270" y="${y}" width="${w}" height="46" rx="3" fill="${win?'var(--leaf)':i===1?'var(--flame-soft)':'var(--pencil-soft)'}" stroke="var(--ink)" stroke-width="2.3"/>
      <text class="t-mono" x="${w>420?260+w:280+w}" y="${y+22}" ${w>420?'text-anchor="end"':''} style="font-size:14px;fill:var(--ink);font-weight:700">about ${c[1].toLocaleString('en-US')}${i===1?'+':''}${win?'  (winner)':''}</text>
      <text x="${w>420?260+w:280+w}" y="${y+40}" ${w>420?'text-anchor="end"':''} style="font-size:11px;fill:${w>420?'var(--ink-2)':'var(--muted)'}">${c[2]}</text>`;
  });
  return SV('0 0 1000 230', g);
}

  if(st >= 1){
    g += wire('M470 84 L470 108', {color:'var(--pencil-2)', dur:.8}) + wire('M470 174 L470 198', {color:'var(--pencil-2)', dur:.8, delay:.3});

  }
  return SV('0 0 1000 280', g);
}

/* the execution trace: scan checks every tuple, Sort drains it, Limit stops at 3 */
const XROWS = [
  ['Asha', 40000, 'Pune', 'vis', 'filtered: balance'],
  ['Kiran', 250000, 'Pune', 'del', 'invisible: deleted, xmax committed'],
  ['Meera', 180000, 'Pune', 'vis', 'kept'],
  ['Dev', 320000, 'Mumbai', 'vis', 'filtered: branch'],
  ['Rohan', 125000, 'Pune', 'vis', 'kept'],
  ['Nisha', 410000, 'Pune', 'vis', 'kept'],
  ['Arjun', 150000, 'Pune', 'new', 'invisible: xmin not committed'],
  ['Tara', 105000, 'Pune', 'vis', 'kept']];
function sceneExec(st, raw){
  let g = boxT(30, 40, 190, 54, 'Limit (3)', '', {fs:17, glow: st===1||st===3});
  g += boxT(30, 120, 190, 54, 'Sort', 'pipeline-breaker', {fs:17, ss:10, glow: st===2});
  g += boxT(30, 200, 190, 54, 'Seq Scan', 'filter + MVCC check', {fs:17, ss:10, glow: st===2});
  g += `<path d="M125 94 V120 M125 174 V200" stroke="var(--ink)" stroke-width="2.2"/>`;
  if(st >= 2 || raw){
    XROWS.forEach((r,i)=>{
      const ok = !raw && r[4] === 'kept', y = 40 + i*29;
      g += `<g class="${an(2,st,'sv-rise')}" ${D(i*140)}>
        <rect class="nofx" x="270" y="${y}" width="260" height="24" rx="3" fill="${ok?'var(--leaf-soft)':'var(--paper-2)'}" stroke="var(--ink)" stroke-width="1.5"/>
        <text class="t-mono" x="280" y="${y+17}" style="font-size:11px;fill:var(--ink)">${r[0]}, ${r[1].toLocaleString('en-US')}, ${r[2]}</text>
        <text x="545" y="${y+17}" style="font-size:12px;fill:${ok?'var(--leaf)':r[3]==='vis'?'var(--muted)':'var(--flame-ink)'}">${raw ? (r[3]==='del' ? 'deleted by a committed txn' : r[3]==='new' ? 'inserted, not committed' : '') : r[4]}</text></g>`;
    });
  }
  if(st >= 3){
    const top = XROWS.filter(r=>r[4]==='kept').sort((a,b)=>b[1]-a[1]).slice(0,3);
    g += `<g class="${an(3,st,'sv-rise')}"><text class="t-sub" x="820" y="58">returned to the client</text>
      ${top.map((r,i)=>boxT(820, 70+i*50, 170, 40, r[0]+', '+r[1].toLocaleString('en-US'), '', {fs:14, fill:'var(--amber)'})).join('')}</g>`;
    g += wire('M220 60 C 240 14, 700 14, 816 84', {color:'var(--leaf)', dur:1.6});
  }
  return SV('0 0 1000 280', g);
}


/* =====================================================================
   Problem scenes: each one shows what goes wrong before the fix
   ===================================================================== */

/* a 5-minute report adds up four accounts while a transfer commits mid-scan */
function sceneSum(k, good){
  const bal = [10000, 20000, 30000, 40000];
  const after = [5000, 20000, 30000, 45000];
  const moved = k >= 2;
  const read = k >= 3 ? 4 : k >= 1 ? 2 : 0;
  let g = '';
  bal.forEach((b,i)=>{
    const x = 40 + i*235, now = moved ? after[i] : b, isRead = i < read;
    const shown = good && i === 3 ? 40000 : (i === 0 ? b : now);   /* acc 1 was read before the transfer */
    g += `<rect x="${x}" y="90" width="205" height="74" rx="4" fill="${isRead?'var(--pencil-soft)':'var(--card)'}" stroke="var(--ink)" stroke-width="2.4"/>
      <text class="t-sub" x="${x+14}" y="112">acc ${i+1}</text>
      <text class="t-serif" x="${x+102}" y="150" text-anchor="middle" style="font-size:24px">${now.toLocaleString('en-US')}</text>`;
    if(isRead) g += `<text x="${x+102}" y="190" text-anchor="middle" style="font-size:14px;fill:var(--pencil-2)">report read ${shown.toLocaleString('en-US')}</text>`;
    if(good && i === 3) g += `<g class="sv-rise">${boxT(x, 200, 205, 58, 'old version: 40,000', 'what the snapshot sees', {fs:14, ss:10, fill:'var(--leaf-soft)'})}</g>`;
  });
  if(read) g += `<rect class="nofx" x="${34 + read*235}" y="82" width="6" height="90" fill="var(--amber-2)"/>
    <text class="t-sub" x="${36 + read*235}" y="76" text-anchor="middle">scan</text>`;
  if(moved){
    g += `<path class="${an(2,k,'sv-draw')}" style="--len:900" d="M140 86 C 300 10, 700 10, 850 86" fill="none" stroke="var(--flame)" stroke-width="3"/>
      ${arrowHead(850, 86, 'd', 'var(--flame)')}
      <text class="t-serif" x="495" y="18" text-anchor="middle" style="font-size:18px;fill:var(--flame-ink)">transfer: 5,000 from acc 1 to acc 4, committed</text>`;
  }
  const total = good ? 100000 : 10000 + 20000 + (read >= 3 ? 30000 : 0) + (read >= 4 ? 45000 : 0);
  let msg, col = 'var(--ink)';
  if(k === 0){ msg = 'money in the bank: 100,000'; }
  else if(read < 4){ msg = `report's running sum: ${total.toLocaleString('en-US')}`; }
  else if(good){ msg = 'report total: 100,000. Correct.'; col = 'var(--leaf)'; }

}

/* the three phases of every case, shown as a strip at the top of the slide */
const PH = {problem:'The problem', see:'See the problem', solve:'Solve it'};
function caseBar(sl, st){
  const ph = sl.steps[st].ph;
  const order = ['problem','see','solve'];
  const cur = order.indexOf(ph);
  const sols = sl.steps.filter(s=>s.ph==='solve').length;
  const k = sl.steps.slice(0, st+1).filter(s=>s.ph==='solve').length;
  const pills = order.map((p,i)=>`<span class="ph ${i===cur?'on':i<cur?'done':''}">${i+1}. ${PH[p]}${p==='solve'&&ph==='solve'?` (step ${k} of ${sols})`:''}</span>`)
    .join('<span class="ph-sep"></span>');
  return `<div class="casebar"><span class="case-n">Case ${sl.caseNo}</span>${pills}</div>
    ${ph!=='problem'?`<div class="caseq"><b>Problem:</b> ${sl.problem}</div>`:''}`;
}
const problemCard = (sl, extra='') => `<div class="probcard pop">
    <div class="pk">The problem</div><div class="pq">${sl.problem}</div>${extra?`<p>${extra}</p>`:''}</div>`;

function chapterBody(ch, st){
  const o = OPENERS[ch.n] || {};
  const cases = ch.of.map(id => SLIDE[id]).filter(d => d && d.problem);
  return `<div class="chapter">
    <div class="ch-rail"><span class="ch-num">${String(ch.n).padStart(2,'0')}</span>
      <span class="ch-of">Chapter ${ch.n} of ${CHAPTERS.length}</span></div>
    <div class="ch-body">
      <div class="ch-when">${o.when||''}</div>
      <h2 class="ch-title">${ch.t}</h2>
      ${st>=1?`<div class="req ${pp(1,st)}"><div class="req-k">The requirement</div><p>${o.problem}</p></div>`:''}
      ${st>=2?`<div class="hard ${pp(2,st)}"><span class="req-k">Why it is hard</span> ${o.detail}</div>`:''}
      ${st>=3?`<div class="caselist ${pp(3,st)}">${cases.length ? cases.map(c=>`<div class="cl"><span class="cl-n">Case ${c.caseNo}</span><span class="cl-t">${c.title}</span></div>`).join('') : `<div class="cl"><span class="cl-t">${o.next}</span></div>`}</div>`:''}
    </div></div>`;
}

  steps:[
